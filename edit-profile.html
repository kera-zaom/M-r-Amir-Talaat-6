<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>الخوارزمي | تعديل البيانات</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(116,72,232,.22),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(49,84,223,.18),
            transparent 35%
        ),
        #07070b;
    color:#fff;
}

.container{
    width:min(700px,94%);
    margin:auto;
}

header{
    height:70px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(7,7,11,.9);
    backdrop-filter:blur(15px);
}

.nav{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:25px;
    font-weight:900;
    background:linear-gradient(90deg,#fff,#9b7cff);
    -webkit-background-clip:text;
    color:transparent;
}

.back{
    color:#fff;
    text-decoration:none;
    padding:10px 16px;
    border-radius:12px;
    background:#111119;
    border:1px solid rgba(255,255,255,.1);
}

main{
    padding:35px 0 60px;
}

.card{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    padding:25px;
}

h1{
    font-size:27px;
    margin-bottom:8px;
}

.subtitle{
    color:#8d8d96;
    margin-bottom:25px;
}

.message{
    display:none;
    padding:13px;
    border-radius:12px;
    margin-bottom:18px;
}

.success{
    background:#092719;
    color:#75e9a9;
    border:1px solid #1d7348;
}

.error{
    background:#280f15;
    color:#ff9aaa;
    border:1px solid #6d2635;
}

/* IMAGE */

.photo{
    text-align:center;
    margin-bottom:28px;
}

.avatar-wrap{
    position:relative;
    width:145px;
    height:145px;
    margin:auto;
}

#studentAvatar{
    width:145px;
    height:145px;
    border-radius:50%;
    object-fit:cover;
    background:#111119;
    border:3px solid #7952ed;
    box-shadow:0 0 35px rgba(121,82,237,.3);
}

.camera{
    position:absolute;
    right:0;
    bottom:0;
    width:45px;
    height:45px;
    border-radius:50%;
    background:linear-gradient(135deg,#7448e8,#3154df);
    border:3px solid #07070b;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:19px;
}

#photoInput{
    display:none;
}

.photo-title{
    margin-top:13px;
    font-weight:bold;
}

.photo-info{
    color:#777;
    font-size:13px;
    margin-top:6px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.full{
    grid-column:1/-1;
}

label{
    color:#aaa;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    background:#0c0c12;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#7650ee;
}

input[readonly]{
    opacity:.5;
}

button.save{
    width:100%;
    margin-top:23px;
    padding:15px;
    border:0;
    border-radius:13px;
    color:#fff;
    background:linear-gradient(135deg,#7448e8,#3154df);
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button.save:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:600px){

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .card{
        padding:18px;
    }

}

</style>
</head>

<body>

<header>

<div class="container nav">

    <div class="logo">
        الخوارزمي
    </div>

    <a href="home.html" class="back">
        ← رجوع
    </a>

</div>

</header>


<main class="container">

<div class="card">

<h1>
    تعديل بياناتي
</h1>

<p class="subtitle">
    يمكنك تعديل بياناتك وتغيير صورتك الشخصية.
</p>


<div id="successBox" class="message success"></div>

<div id="errorBox" class="message error"></div>


<!-- ==============================
     PHOTO
============================== -->

<div class="photo">

    <div class="avatar-wrap">

        <img
            id="studentAvatar"
            src="teacher.png"
            alt="صورة الطالب"
        >

        <label
            class="camera"
            for="photoInput"
        >
            📷
        </label>

        <input
            id="photoInput"
            type="file"
            accept="image/jpeg,image/png,image/webp"
        >

    </div>

    <div class="photo-title">
        صورتك الشخصية
    </div>

    <div class="photo-info">
        JPG / PNG / WEBP — الحد الأقصى 5MB
    </div>

</div>


<!-- ==============================
     FORM
============================== -->

<form id="profileForm">

<div class="grid">


<div class="field full">

<label>
    الاسم بالكامل
</label>

<input
    id="fullName"
    type="text"
    required
>

</div>


<div class="field">

<label>
    البريد الإلكتروني
</label>

<input
    id="email"
    type="email"
    readonly
>

</div>


<div class="field">

<label>
    رقم الهاتف
</label>

<input
    id="phone"
    type="tel"
>

</div>


<div class="field">

<label>
    رقم ولي الأمر
</label>

<input
    id="parentPhone"
    type="tel"
>

</div>


<div class="field">

<label>
    الصف الدراسي
</label>

<input
    id="grade"
    type="text"
>

</div>


<div class="field">

<label>
    المحافظة
</label>

<input
    id="governorate"
    type="text"
>

</div>


<div class="field">

<label>
    المدينة
</label>

<input
    id="city"
    type="text"
>

</div>


<div class="field full">

<label>
    المدرسة
</label>

<input
    id="school"
    type="text"
>

</div>


</div>


<button
    id="saveBtn"
    class="save"
    type="submit"
>
    حفظ البيانات
</button>

</form>

</div>

</main>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

"use strict";


/* =========================================
   VARIABLES
========================================= */

let supabaseClient = null;

let currentUser = null;

let currentStudent = {};

let selectedFile = null;


/* =========================================
   ELEMENTS
========================================= */

const form =
    document.getElementById(
        "profileForm"
    );

const photoInput =
    document.getElementById(
        "photoInput"
    );

const avatar =
    document.getElementById(
        "studentAvatar"
    );

const saveBtn =
    document.getElementById(
        "saveBtn"
    );

const successBox =
    document.getElementById(
        "successBox"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );


/* =========================================
   MESSAGE
========================================= */

function showSuccess(message){

    successBox.textContent =
        message;

    successBox.style.display =
        "block";

    errorBox.style.display =
        "none";
}


function showError(message){

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

    successBox.style.display =
        "none";
}


/* =========================================
   INPUT HELPERS
========================================= */

function getValue(id){

    return document
        .getElementById(id)
        .value
        .trim();

}


function setValue(id,value){

    const element =
        document.getElementById(id);

    if(element){

        element.value =
            value || "";

    }

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

    try{

        if(!window.supabaseClient){

            throw new Error(
                "Supabase غير متصل. تأكد من supabase.js"
            );

        }

        supabaseClient =
            window.supabaseClient;


        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getSession();


        if(error){

            throw error;

        }


        if(!data?.session){

            window.location.href =
                "auth.html";

            return;

        }


        currentUser =
            data.session.user;


        /* =========================
           GET STUDENT
        ========================= */

        const {
            data:student,
            error:studentError
        } =
        await supabaseClient
            .from("students")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


        if(studentError){

            throw studentError;

        }


        currentStudent =
            student || {};


        /* =========================
           FIELDS
        ========================= */

        setValue(
            "fullName",
            currentStudent.full_name ||
            currentStudent.name ||
            currentUser.user_metadata?.full_name ||
            ""
        );


        setValue(
            "email",
            currentUser.email ||
            currentStudent.email ||
            ""
        );


        setValue(
            "phone",
            currentStudent.phone ||
            ""
        );


        setValue(
            "parentPhone",
            currentStudent.parent_phone ||
            ""
        );


        setValue(
            "grade",
            currentStudent.grade ||
            currentStudent.class ||
            ""
        );


        setValue(
            "governorate",
            currentStudent.governorate ||
            currentStudent.province ||
            ""
        );


        setValue(
            "city",
            currentStudent.city ||
            ""
        );


        setValue(
            "school",
            currentStudent.school ||
            ""
        );


        /* =========================
           CURRENT IMAGE
        ========================= */

        if(currentStudent.avatar_url){

            avatar.src =
                currentStudent.avatar_url;

        }


    }catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );

        showError(
            error.message ||
            "تعذر تحميل البيانات."
        );

    }

}


/* =========================================
   SELECT IMAGE
========================================= */

photoInput.addEventListener(
    "change",
    function(){

        const file =
            this.files?.[0];


        if(!file){

            return;

        }


        if(
            file.size >
            5 * 1024 * 1024
        ){

            showError(
                "حجم الصورة يجب ألا يتجاوز 5MB."
            );

            this.value = "";

            return;

        }


        const allowedTypes = [

            "image/jpeg",
            "image/png",
            "image/webp"

        ];


        if(
            !allowedTypes.includes(
                file.type
            )
        ){

            showError(
                "اختر صورة JPG أو PNG أو WEBP."
            );

            this.value = "";

            return;

        }


        selectedFile =
            file;


        /* PREVIEW */

        const reader =
            new FileReader();


        reader.onload =
            function(event){

                avatar.src =
                    event.target.result;

            };


        reader.readAsDataURL(
            file
        );


        errorBox.style.display =
            "none";

    }
);


/* =========================================
   UPLOAD IMAGE
========================================= */

async function uploadImage(){

    if(!selectedFile){

        return null;

    }


    const extension =
        selectedFile.name
            .split(".")
            .pop()
            .toLowerCase();


    /*
       مسار الصورة:

       USER_ID/profile-TIME.extension
    */

    const filePath =
        currentUser.id +
        "/profile-" +
        Date.now() +
        "." +
        extension;


    console.log(
        "UPLOAD PATH:",
        filePath
    );


    /* =========================
       UPLOAD
    ========================= */

    const {
        error
    } =
    await supabaseClient
        .storage
        .from("avatars")
        .upload(
            filePath,
            selectedFile,
            {
                cacheControl:"3600",
                contentType:
                    selectedFile.type,
                upsert:false
            }
        );


    if(error){

        console.error(
            "UPLOAD ERROR:",
            error
        );

        throw new Error(
            "فشل رفع الصورة: " +
            error.message
        );

    }


    /* =========================
       PUBLIC URL
    ========================= */

    const {
        data
    } =
    supabaseClient
        .storage
        .from("avatars")
        .getPublicUrl(
            filePath
        );


    const publicUrl =
        data?.publicUrl;


    if(!publicUrl){

        throw new Error(
            "لم يتم إنشاء رابط للصورة."
        );

    }


    console.log(
        "PUBLIC URL:",
        publicUrl
    );


    return publicUrl;

}


/* =========================================
   SAVE
========================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        try{

            if(!currentUser){

                throw new Error(
                    "لم يتم تحميل الحساب."
                );

            }


            const fullName =
                getValue("fullName");


            if(!fullName){

                throw new Error(
                    "اكتب الاسم بالكامل."
                );

            }


            saveBtn.disabled =
                true;

            saveBtn.textContent =
                "جاري الحفظ...";


            /* =========================
               IMAGE
            ========================= */

            let avatarUrl =
                currentStudent.avatar_url ||
                null;


            if(selectedFile){

                saveBtn.textContent =
                    "جاري رفع الصورة...";


                avatarUrl =
                    await uploadImage();

            }


            /* =========================
               UPDATE
            ========================= */

            const updateData = {

                full_name:
                    fullName,

                phone:
                    getValue("phone"),

                parent_phone:
                    getValue("parentPhone"),

                grade:
                    getValue("grade"),

                governorate:
                    getValue("governorate"),

                city:
                    getValue("city"),

                school:
                    getValue("school"),

                avatar_url:
                    avatarUrl

            };


            console.log(
                "SAVING:",
                updateData
            );


            saveBtn.textContent =
                "جاري حفظ البيانات...";


            const {
                error
            } =
            await supabaseClient
                .from("students")
                .update(
                    updateData
                )
                .eq(
                    "id",
                    currentUser.id
                );


            if(error){

                console.error(
                    "DATABASE ERROR:",
                    error
                );

                throw new Error(
                    "فشل حفظ البيانات: " +
                    error.message
                );

            }


            /* =========================
               SUCCESS
            ========================= */

            currentStudent = {

                ...currentStudent,

                ...updateData

            };


            selectedFile =
                null;

            photoInput.value =
                "";


            if(avatarUrl){

                avatar.src =
                    avatarUrl +
                    (
                        avatarUrl.includes("?")
                            ? "&"
                            : "?"
                    ) +
                    "v=" +
                    Date.now();

            }


            showSuccess(
                "تم حفظ البيانات والصورة بنجاح ✅"
            );


            saveBtn.textContent =
                "تم الحفظ ✓";


            /*
               ارجع للـ Home
            */

            setTimeout(
                function(){

                    window.location.href =
                        "home.html";

                },
                1200
            );


        }catch(error){

            console.error(
                "SAVE ERROR:",
                error
            );


            showError(
                error.message ||
                "حدث خطأ أثناء الحفظ."
            );


            saveBtn.disabled =
                false;

            saveBtn.textContent =
                "حفظ البيانات";

        }

    }
);


/* =========================================
   START
========================================= */

loadProfile();

</script>

</body>
</html>
