<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>الخوارزمي | تسجيل الدخول</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:"Cairo","Tajawal",Arial,sans-serif;
    color:#fff;
    background:#07070d;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    width:650px;
    height:650px;
    top:-300px;
    right:-200px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(113,73,245,.24),
        transparent 68%
    );
    filter:blur(30px);
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    bottom:-300px;
    left:-250px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(44,82,225,.18),
        transparent 68%
    );
    filter:blur(30px);
    pointer-events:none;
}

.page{
    width:min(1050px,calc(100% - 28px));
    min-height:650px;
    display:grid;
    grid-template-columns:1fr 1fr;
    border-radius:30px;
    overflow:hidden;
    background:rgba(14,14,23,.86);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 40px 120px rgba(0,0,0,.65);
    backdrop-filter:blur(25px);
    position:relative;
    z-index:2;
    animation:pageShow .7s ease;
}

@keyframes pageShow{

    from{
        opacity:0;
        transform:translateY(25px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

.visual{
    min-height:650px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        145deg,
        #11101e,
        #171333,
        #0c1020
    );
}

.visual::before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(125,82,255,.35),
        transparent 68%
    );

    filter:blur(20px);
    animation:visualGlow 5s ease-in-out infinite;
}

@keyframes visualGlow{

    0%,100%{
        transform:scale(1);
        opacity:.7;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }

}

.ring{
    position:absolute;
    width:410px;
    height:410px;
    border-radius:50%;
    border:1px solid rgba(145,112,255,.25);
    animation:rotate 18s linear infinite;
}

.ring::before{
    content:"";
    position:absolute;
    width:9px;
    height:9px;
    top:8%;
    right:12%;
    border-radius:50%;
    background:#a78aff;
    box-shadow:0 0 25px #a78aff;
}

@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

.visual-content{
    position:relative;
    z-index:3;
    text-align:center;
    padding:30px;
}

.big-logo{
    width:105px;
    height:105px;
    margin:0 auto 25px;

    display:grid;
    place-items:center;

    border-radius:30px;

    font-size:58px;
    font-weight:900;

    background:linear-gradient(
        135deg,
        #895aff,
        #3159e8
    );

    box-shadow:
        0 25px 70px rgba(92,65,230,.4);

    animation:floating 4s ease-in-out infinite;
}

@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

}

.visual-content h1{
    font-size:35px;
    margin-bottom:10px;
}

.visual-content h1 span{
    color:#a58aff;
}

.visual-content p{
    color:#858592;
    font-size:12px;
    line-height:2;
    max-width:350px;
    margin:auto;
}

.form-area{
    padding:45px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
}

.back{
    position:absolute;
    top:25px;
    right:30px;

    color:#777783;
    font-size:11px;

    transition:.25s;
    text-decoration:none;
}

.back:hover{
    color:#fff;
}

.form-header{
    margin-bottom:25px;
}

.form-header small{
    color:#9170ff;
    font-size:10px;
}

.form-header h2{
    font-size:30px;
    margin-top:7px;
}

.form-header p{
    color:#777783;
    font-size:10px;
    margin-top:7px;
    line-height:1.8;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;

    padding:4px;
    margin-bottom:23px;

    border-radius:13px;

    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
}

.tab{
    border:0;

    padding:11px;

    border-radius:10px;

    background:transparent;
    color:#777783;

    font-family:inherit;
    font-size:10px;

    cursor:pointer;

    transition:.3s;
}

.tab.active{
    color:#fff;

    background:linear-gradient(
        135deg,
        rgba(124,82,245,.8),
        rgba(49,87,220,.8)
    );

    box-shadow:
        0 8px 25px rgba(78,60,200,.25);
}

.form{
    display:none;
    animation:formShow .35s ease;
}

.form.active{
    display:block;
}

@keyframes formShow{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:#aaaab5;
    font-size:10px;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

.input-wrap span{
    position:absolute;

    right:14px;
    top:50%;

    transform:translateY(-50%);

    color:#666673;
    font-size:14px;

    pointer-events:none;
}

input,
select{
    width:100%;
    height:48px;

    padding:
        0
        42px
        0
        45px;

    border-radius:12px;

    outline:none;

    color:#fff;

    font-family:inherit;
    font-size:11px;

    background:rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.075);

    transition:.25s;
}

input::placeholder{
    color:#555561;
}

input:focus,
select:focus{
    border-color:
        rgba(135,99,255,.6);

    background:
        rgba(255,255,255,.055);

    box-shadow:
        0 0 0 3px
        rgba(120,80,245,.08);
}

select{
    appearance:auto;
}

select option{
    background:#171722;
    color:#fff;
}

.password-toggle{
    position:absolute;

    left:13px;
    top:50%;

    transform:translateY(-50%);

    border:0;

    background:transparent;

    color:#777783;

    cursor:pointer;

    font-size:13px;
}

.submit{
    width:100%;
    height:50px;

    border:0;
    border-radius:13px;

    color:#fff;

    font-family:inherit;
    font-size:11px;
    font-weight:800;

    cursor:pointer;

    background:linear-gradient(
        135deg,
        #8558f6,
        #315be9
    );

    box-shadow:
        0 15px 35px
        rgba(76,60,205,.25);

    transition:.3s;
}

.submit:hover{
    transform:translateY(-2px);
}

.submit:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;

    margin-top:13px;
    padding:11px;

    border-radius:10px;

    text-align:center;

    font-size:9px;
    line-height:1.7;
}

.message.show{
    display:block;
}

.message.error{
    color:#ff9eaa;

    background:
        rgba(255,70,90,.08);

    border:
        1px solid
        rgba(255,70,90,.13);
}

.message.success{
    color:#9ff0bd;

    background:
        rgba(50,210,110,.08);

    border:
        1px solid
        rgba(50,210,110,.13);
}

.form-footer{
    margin-top:22px;

    text-align:center;

    color:#555561;

    font-size:8px;

    line-height:1.8;
}

@media(max-width:800px){

    body{
        padding:20px 0;
    }

    .page{
        grid-template-columns:1fr;

        min-height:auto;

        width:calc(100% - 22px);

        border-radius:23px;
    }

    .visual{
        min-height:270px;
    }

    .ring{
        width:250px;
        height:250px;
    }

    .big-logo{
        width:75px;
        height:75px;

        font-size:40px;
    }

    .visual-content h1{
        font-size:26px;
    }

    .form-area{
        padding:30px 22px 35px;
    }

}

@media(max-width:430px){

    body{
        align-items:flex-start;
        padding:12px 0;
    }

    .page{
        width:calc(100% - 16px);
    }

    .visual{
        min-height:235px;
    }

    .visual-content{
        padding:15px;
    }

    .visual-content h1{
        font-size:23px;
    }

    .visual-content p{
        font-size:8px;
    }

    .form-area{
        padding:28px 17px 25px;
    }

    .form-header h2{
        font-size:25px;
    }

}

</style>

</head>

<!-- ==================================================
     SUPABASE LIBRARY
     
     مهم:
     auth.html موجود في ROOT
     لذلك المسار الصحيح:
     ./supabase.js
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase.js"></script>


<script>

"use strict";


/* =====================================================
   SUPABASE
===================================================== */

function getSupabase(){

    if(
        !window.supabaseClient
    ){

        throw new Error(
            "Supabase غير متصل. تأكد من وجود supabase.js بجوار auth.html."
        );

    }

    return window.supabaseClient;

}


/* =====================================================
   ELEMENTS
===================================================== */

const loginTab =
    document.getElementById("loginTab");

const registerTab =
    document.getElementById("registerTab");

const loginForm =
    document.getElementById("loginForm");

const registerForm =
    document.getElementById("registerForm");

const loginMessage =
    document.getElementById("loginMessage");

const registerMessage =
    document.getElementById("registerMessage");

const loginButton =
    document.getElementById("loginButton");

const registerButton =
    document.getElementById("registerButton");


/* =====================================================
   TABS
===================================================== */

loginTab.addEventListener(
    "click",
    function(){

        loginTab.classList.add("active");

        registerTab.classList.remove("active");

        loginForm.classList.add("active");

        registerForm.classList.remove("active");

        clearMessage(registerMessage);

    }
);


registerTab.addEventListener(
    "click",
    function(){

        registerTab.classList.add("active");

        loginTab.classList.remove("active");

        registerForm.classList.add("active");

        loginForm.classList.remove("active");

        clearMessage(loginMessage);

    }
);


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

document
.querySelectorAll(".password-toggle")
.forEach(function(button){

    button.addEventListener(
        "click",
        function(){

            const input =
                document.getElementById(
                    button.dataset.target
                );

            if(
                input.type === "password"
            ){

                input.type = "text";

                button.textContent = "🙈";

            }else{

                input.type = "password";

                button.textContent = "👁";

            }

        }
    );

});


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    element,
    text,
    type
){

    element.textContent = text;

    element.className =
        "message show " + type;

}


function clearMessage(element){

    element.textContent = "";

    element.className = "message";

}


/* =====================================================
   EGYPT PHONE
===================================================== */

function validEgyptPhone(phone){

    return /^01[0125][0-9]{8}$/.test(
        phone
    );

}


/* =====================================================
   LOGIN IDENTIFIER
===================================================== */

function isEmail(value){

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
        value
    );

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage(loginMessage);

        const identifier =
            document
            .getElementById("loginIdentifier")
            .value
            .trim();

        const password =
            document
            .getElementById("loginPassword")
            .value;


        if(!identifier){

            showMessage(
                loginMessage,
                "اكتب البريد الإلكتروني أو رقم الموبايل.",
                "error"
            );

            return;

        }


        if(!password){

            showMessage(
                loginMessage,
                "اكتب كلمة المرور.",
                "error"
            );

            return;

        }


        /*
         * البريد:
         * يتم الدخول به مباشرة.
         *
         * الهاتف:
         * يتم الدخول به مباشرة من Supabase Auth.
         *
         * لا يوجد RPC.
         * لا يوجد user_id وهمي.
         */

        if(
            !isEmail(identifier) &&
            !validEgyptPhone(identifier)
        ){

            showMessage(
                loginMessage,
                "اكتب بريدًا إلكترونيًا صحيحًا أو رقم موبايل مصري صحيح.",
                "error"
            );

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "جاري تسجيل الدخول...";


        try{

            const supabase =
                getSupabase();


            let loginData;


            /* =========================================
               EMAIL LOGIN
            ========================================= */

            if(
                isEmail(identifier)
            ){

                loginData =
                    await supabase
                    .auth
                    .signInWithPassword({

                        email:
                            identifier.toLowerCase(),

                        password:
                            password

                    });

            }


            /* =========================================
               PHONE LOGIN
            ========================================= */

            else{

                loginData =
                    await supabase
                    .auth
                    .signInWithPassword({

                        phone:
                            identifier,

                        password:
                            password

                    });

            }


            if(loginData.error){

                throw loginData.error;

            }


            if(
                !loginData.data ||
                !loginData.data.user
            ){

                throw new Error(
                    "لم يتم العثور على الحساب."
                );

            }


            const user =
                loginData.data.user;


            /* =========================================
               GET PROFILE
            ========================================= */

            const profileResult =
                await supabase
                .from("profiles")
                .select(
                    "id,full_name,email,phone,role"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


            if(profileResult.error){

                throw profileResult.error;

            }


            /*
             * لو الـ profile غير موجود،
             * لا ننشئ profile من المتصفح
             * لأن الدور يجب أن يأتي من قاعدة البيانات.
             */

            if(!profileResult.data){

                throw new Error(
                    "تم تسجيل الدخول ولكن بيانات الحساب غير موجودة في profiles. تأكد من إنشاء profile للمستخدم."
                );

            }


            const role =
                String(
                    profileResult.data.role || ""
                )
                .trim()
                .toLowerCase();


            showMessage(
                loginMessage,
                "تم تسجيل الدخول بنجاح. جاري التحويل...",
                "success"
            );


            setTimeout(
                function(){

                    /* =================================
                       ADMIN
                    ================================= */

                    if(role === "admin"){

                        window.location.replace(
                            "./admin/index.html"
                        );

                        return;

                    }


                    /* =================================
                       STUDENT
                    ================================= */

                    if(
                        role === "student" ||
                        role === ""
                    ){

                        window.location.replace(
                            "./home.html"
                        );

                        return;

                    }


                    /*
                     * أي Role غير معروف
                     */

                    throw new Error(
                        "دور الحساب غير معروف: " +
                        role
                    );

                },
                500
            );


        }catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            let text =
                error?.message ||
                "حدث خطأ أثناء تسجيل الدخول.";


            const lower =
                text.toLowerCase();


            if(
                lower.includes(
                    "invalid login credentials"
                )
            ){

                text =
                    "البريد أو رقم الموبايل أو كلمة المرور غير صحيحة.";

            }


            else if(
                lower.includes(
                    "email not confirmed"
                )
            ){

                text =
                    "يجب تأكيد البريد الإلكتروني أولًا.";

            }


            else if(
                lower.includes(
                    "phone not confirmed"
                )
            ){

                text =
                    "يجب تأكيد رقم الموبايل أولًا.";

            }


            showMessage(
                loginMessage,
                text,
                "error"
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "دخول إلى المنصة";

        }

    }
);


/* =====================================================
   REGISTER
===================================================== */

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage(registerMessage);


        const name =
            document
            .getElementById("registerName")
            .value
            .trim();


        const email =
            document
            .getElementById("registerEmail")
            .value
            .trim()
            .toLowerCase();


        const phone =
            document
            .getElementById("registerPhone")
            .value
            .trim();


        const parentPhone =
            document
            .getElementById("parentPhone")
            .value
            .trim();


        const grade =
            document
            .getElementById("registerGrade")
            .value;


        const password =
            document
            .getElementById("registerPassword")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        /* =========================================
           VALIDATION
        ========================================= */

        if(name.length < 3){

            showMessage(
                registerMessage,
                "اكتب الاسم بالكامل.",
                "error"
            );

            return;

        }


        if(!isEmail(email)){

            showMessage(
                registerMessage,
                "اكتب بريدًا إلكترونيًا صحيحًا.",
                "error"
            );

            return;

        }


        if(!validEgyptPhone(phone)){

            showMessage(
                registerMessage,
                "رقم الموبايل غير صحيح.",
                "error"
            );

            return;

        }


        if(!validEgyptPhone(parentPhone)){

            showMessage(
                registerMessage,
                "رقم ولي الأمر غير صحيح.",
                "error"
            );

            return;

        }


        if(!grade){

            showMessage(
                registerMessage,
                "اختر الصف الدراسي.",
                "error"
            );

            return;

        }


        if(password.length < 6){

            showMessage(
                registerMessage,
                "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
                "error"
            );

            return;

        }


        if(password !== confirmPassword){

            showMessage(
                registerMessage,
                "كلمتا المرور غير متطابقتين.",
                "error"
            );

            return;

        }


        registerButton.disabled = true;

        registerButton.textContent =
            "جاري إنشاء الحساب...";


        try{

            const supabase =
                getSupabase();


            /* =========================================
               CHECK PHONE IN PROFILES
               
               ملاحظة:
               هذا الاستعلام يحتاج Policy تسمح
               بالقراءة المناسبة من profiles.
               ========================================= */

            const phoneCheck =
                await supabase
                .from("profiles")
                .select("id")
                .eq(
                    "phone",
                    phone
                )
                .limit(1);


            if(phoneCheck.error){

                throw phoneCheck.error;

            }


            if(
                phoneCheck.data &&
                phoneCheck.data.length > 0
            ){

                throw new Error(
                    "رقم الموبايل مسجل بالفعل."
                );

            }


            /* =========================================
               CREATE AUTH USER
            ========================================= */

            const signUpResult =
                await supabase
                .auth
                .signUp({

                    email:
                        email,

                    password:
                        password,

                    options:{

                        data:{

                            full_name:
                                name,

                            phone:
                                phone,

                            parent_phone:
                                parentPhone,

                            grade:
                                grade,

                            role:
                                "student"

                        }

                    }

                });


            if(signUpResult.error){

                throw signUpResult.error;

            }


            const user =
                signUpResult.data?.user;


            if(!user){

                throw new Error(
                    "لم يتم إنشاء حساب Supabase."
                );

            }


            /* =========================================
               PROFILE
               
               id = auth.users.id
               ========================================= */

            const profileResult =
                await supabase
                .from("profiles")
                .upsert({

                    id:
                        user.id,

                    full_name:
                        name,

                    email:
                        email,

                    phone:
                        phone,

                    parent_phone:
                        parentPhone,

                    grade:
                        grade,

                    role:
                        "student"

                },{
                    onConflict:"id"
                });


            if(profileResult.error){

                throw profileResult.error;

            }


            /* =========================================
               STUDENT
               
               جدولك يحتوي:
               id
               profile_id
               full_name
               email
               phone
               parent_phone
               grade
               status
               
               لا نستخدم user_id.
               ========================================= */

            const studentResult =
                await supabase
                .from("students")
                .upsert({

                    id:
                        user.id,

                    profile_id:
                        user.id,

                    full_name:
                        name,

                    email:
                        email,

                    phone:
                        phone,

                    parent_phone:
                        parentPhone,

                    grade:
                        grade,

                    status:
                        "active"

                },{
                    onConflict:"id"
                });


            if(studentResult.error){

                /*
                 * هنا لا نخفي الخطأ.
                 * لأن الطالب يجب أن يكون موجودًا
                 * في students إذا كان المشروع يعتمد عليه.
                 */

                throw studentResult.error;

            }


            /* =========================================
               SESSION
            ========================================= */

            if(
                signUpResult.data.session
            ){

                showMessage(
                    registerMessage,
                    "تم إنشاء الحساب بنجاح. جاري الدخول...",
                    "success"
                );


                setTimeout(
                    function(){

                        window.location.replace(
                            "./home.html"
                        );

                    },
                    700
                );

            }

            else{

                showMessage(
                    registerMessage,
                    "تم إنشاء الحساب. إذا كان تأكيد البريد مفعّلًا، افتح بريدك الإلكتروني ثم سجل الدخول.",
                    "success"
                );


                registerButton.disabled = false;

                registerButton.textContent =
                    "إنشاء الحساب";

            }

        }catch(error){

            console.error(
                "REGISTER ERROR:",
                error
            );


            let text =
                error?.message ||
                "حدث خطأ أثناء إنشاء الحساب.";


            const lower =
                text.toLowerCase();


            if(
                lower.includes(
                    "user already registered"
                )
            ){

                text =
                    "هذا البريد الإلكتروني مسجل بالفعل.";

            }


            else if(
                lower.includes(
                    "duplicate key"
                )
            ){

                text =
                    "البريد الإلكتروني أو رقم الموبايل مستخدم بالفعل.";

            }


            else if(
                lower.includes(
                    "row-level security"
                ) ||
                lower.includes(
                    "permission denied"
                )
            ){

                text =
                    "تم رفض العملية من صلاحيات قاعدة البيانات RLS. راجع سياسات profiles و students.";

            }


            showMessage(
                registerMessage,
                text,
                "error"
            );


            registerButton.disabled = false;

            registerButton.textContent =
                "إنشاء الحساب";

        }

    }
);


/* =====================================================
   PHONE INPUT
===================================================== */

document
.querySelectorAll(
    'input[type="tel"]'
)
.forEach(function(input){

    input.addEventListener(
        "input",
        function(){

            input.value =
                input.value
                .replace(
                    /[^0-9]/g,
                    ""
                )
                .slice(
                    0,
                    11
                );

        }
    );

});

    async function(){

            const supabase =
                getSupabase();


            const sessionResult =
                await supabase
                .auth
                .getSession();


            if(
                sessionResult.error
            ){

                console.error(
                    "SESSION CHECK ERROR:",
                    sessionResult.error
                );

                return;

            }


            /*
             * لا نحول المستخدم تلقائيًا هنا.
             * المستخدم موجود في auth.html ويمكنه
             * تسجيل الدخول بنفسه.
             */

            console.log(
                "✅ Supabase connected successfully."
            );

        }catch(error){

            console.error(
                "❌ SUPABASE CONNECTION ERROR:",
                error
            );

            showMessage(
                loginMessage,
                "Supabase غير متصل. تأكد أن supabase.js موجود بجوار auth.html.",
                "error"
            );

        }

    }
);
