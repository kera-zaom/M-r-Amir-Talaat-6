<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الاختبار | الخوارزمي</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Cairo", Arial, sans-serif;
}

:root {
    --bg: #06060a;
    --card: rgba(18,18,27,.88);
    --border: rgba(255,255,255,.08);
    --text: #fff;
    --muted: #9c9cab;
    --primary: #7657ff;
    --primary-dark: #4d35d9;
    --danger: #ff6078;
    --success: #35d39a;
}

body {
    min-height: 100vh;
    color: var(--text);

    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(118,87,255,.16),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(70,45,190,.12),
            transparent 30%
        ),
        var(--bg);

    padding-bottom: 60px;
}

/* ================= HEADER ================= */

header {
    height: 74px;
    position: sticky;
    top: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    background: rgba(6,6,10,.88);
    backdrop-filter: blur(18px);

    border-bottom: 1px solid var(--border);
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 43px;
    height: 43px;

    display: grid;
    place-items: center;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            #a796ff
        );

    font-size: 20px;
    font-weight: 900;
}

.logo-text strong {
    display: block;
    font-size: 17px;
}

.logo-text span {
    display: block;
    color: var(--muted);
    font-size: 10px;
}

.exit-btn {
    height: 40px;
    padding: 0 14px;

    border-radius: 10px;
    border: 1px solid var(--border);

    background: rgba(255,255,255,.04);
    color: white;

    cursor: pointer;
}

/* ================= MAIN ================= */

main {
    width: min(950px, 94%);
    margin: auto;
    padding-top: 28px;
}

/* ================= TOP ================= */

.exam-top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;

    padding: 20px;
    margin-bottom: 20px;

    border-radius: 18px;
    border: 1px solid var(--border);

    background: var(--card);
}

.exam-title {
    font-size: clamp(19px, 4vw, 27px);
    font-weight: 900;
}

.exam-subtitle {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
}

.timer {
    min-width: 125px;
    padding: 12px;

    border-radius: 14px;

    text-align: center;

    background: rgba(118,87,255,.09);

    border: 1px solid rgba(118,87,255,.18);
}

.timer-label {
    display: block;
    color: var(--muted);
    font-size: 9px;
    margin-bottom: 2px;
}

#timer {
    font-size: 22px;
    font-weight: 900;
    direction: ltr;
}

.timer.warning {
    background: rgba(255,96,120,.09);
    border-color: rgba(255,96,120,.25);
    color: #ff8497;
}

/* ================= PROGRESS ================= */

.progress-box {
    margin-bottom: 20px;
}

.progress-info {
    display: flex;
    justify-content: space-between;

    color: var(--muted);
    font-size: 10px;

    margin-bottom: 7px;
}

.progress-bar {
    height: 7px;

    border-radius: 20px;

    overflow: hidden;

    background: rgba(255,255,255,.07);
}

.progress-fill {
    width: 0%;
    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            var(--primary-dark),
            #9c86ff
        );

    transition: .3s;
}

/* ================= QUESTIONS ================= */

.questions {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.question-card {
    padding: 22px;

    border-radius: 18px;

    border: 1px solid var(--border);

    background: var(--card);
}

.question-number {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 32px;
    height: 28px;

    padding: 0 8px;

    border-radius: 8px;

    background: rgba(118,87,255,.11);

    color: #b7aaff;

    font-size: 10px;
    font-weight: 800;

    margin-bottom: 12px;
}

.question-text {
    font-size: 16px;
    font-weight: 800;

    line-height: 1.9;

    margin-bottom: 17px;
}

/* ================= OPTIONS ================= */

.options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.option {
    position: relative;
    cursor: pointer;
}

.option input {
    position: absolute;
    opacity: 0;
}

.option-content {
    display: flex;
    align-items: center;

    gap: 12px;

    min-height: 52px;

    padding: 10px 13px;

    border-radius: 12px;

    border: 1px solid var(--border);

    background: rgba(255,255,255,.025);

    transition: .2s;
}

.option:hover .option-content {
    border-color: rgba(118,87,255,.3);
    background: rgba(118,87,255,.06);
}

.option-letter {
    width: 32px;
    height: 32px;

    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 9px;

    background: rgba(255,255,255,.06);

    color: #c7c7d0;

    font-size: 11px;
    font-weight: 800;
}

.option-text {
    font-size: 12px;
    line-height: 1.7;
}

.option input:checked ~ .option-content {
    border-color: var(--primary);

    background: rgba(118,87,255,.10);

    box-shadow:
        0 0 0 1px
        rgba(118,87,255,.12);
}

.option input:checked
~ .option-content
.option-letter {
    background: var(--primary);
    color: white;
}

/* ================= TEXT ANSWER ================= */

textarea {
    width: 100%;
    min-height: 130px;

    resize: vertical;

    padding: 14px;

    border-radius: 12px;

    border: 1px solid var(--border);

    background: rgba(255,255,255,.025);

    color: white;

    outline: none;

    font-size: 12px;
}

textarea:focus {
    border-color: rgba(118,87,255,.5);
}

/* ================= SUBMIT ================= */

.submit-box {
    margin-top: 22px;

    padding: 20px;

    border-radius: 18px;

    border: 1px solid var(--border);

    background: var(--card);

    text-align: center;
}

.submit-info {
    color: var(--muted);

    font-size: 11px;

    margin-bottom: 14px;
}

.submit-btn {
    width: 100%;

    min-height: 52px;

    border: 0;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    color: white;

    font-size: 14px;
    font-weight: 900;

    cursor: pointer;

    transition: .25s;
}

.submit-btn:hover {
    transform: translateY(-1px);

    box-shadow:
        0 12px 30px
        rgba(118,87,255,.22);
}

.submit-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
}

/* ================= LOADING ================= */

.loading {
    position: fixed;

    inset: 0;

    z-index: 999;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #06060a;
}

.loader {
    width: 45px;
    height: 45px;

    border-radius: 50%;

    border:
        3px solid
        rgba(118,87,255,.15);

    border-top-color:
        var(--primary);

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* ================= EMPTY ================= */

.empty {
    display: none;

    text-align: center;

    padding: 70px 20px;

    border-radius: 20px;

    border: 1px solid var(--border);

    background: var(--card);
}

.empty-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.empty h2 {
    font-size: 18px;
    margin-bottom: 5px;
}

.empty p {
    color: var(--muted);
    font-size: 11px;
}

/* ================= ERROR ================= */

.error-box {
    display: none;

    padding: 18px;

    margin-bottom: 20px;

    border-radius: 14px;

    background: rgba(255,96,120,.08);

    border: 1px solid rgba(255,96,120,.2);

    color: #ff9aaa;

    text-align: center;

    font-size: 12px;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 650px) {

    header {
        padding: 0 4%;
    }

    .logo-text span {
        display: none;
    }

    main {
        width: 94%;
    }

    .exam-top {
        flex-direction: column;
        align-items: stretch;
    }

    .timer {
        width: 100%;
    }

    .question-card {
        padding: 17px;
    }

    .question-text {
        font-size: 14px;
    }

}

</style>

</head>

<body>

<!-- LOADING -->

<div
    class="loading"
    id="loading"
>

    <div class="loader"></div>

</div>


<!-- HEADER -->

<header>

    <div class="logo-area">

        <div class="logo">
            خ
        </div>

        <div class="logo-text">

            <strong>
                الخوارزمي
            </strong>

            <span>
                منصة الاختبارات
            </span>

        </div>

    </div>


    <button
        class="exit-btn"
        onclick="exitExam()"
    >
        خروج من الاختبار
    </button>

</header>


<main>

    <!-- ERROR -->

    <div
        class="error-box"
        id="errorBox"
    ></div>


    <!-- EXAM TOP -->

    <section class="exam-top">

        <div>

            <h1
                class="exam-title"
                id="examTitle"
            >
                جاري تحميل الاختبار...
            </h1>

            <p
                class="exam-subtitle"
                id="examSubtitle"
            >
                يرجى الانتظار
            </p>

        </div>


        <div
            class="timer"
            id="timerBox"
        >

            <span class="timer-label">
                الوقت المتبقي
            </span>

            <strong id="timer">
                00:00
            </strong>

        </div>

    </section>


    <!-- PROGRESS -->

    <div class="progress-box">

        <div class="progress-info">

            <span>
                تقدم الإجابة
            </span>

            <span id="progressText">
                0 / 0
            </span>

        </div>


        <div class="progress-bar">

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

        </div>

    </div>


    <!-- QUESTIONS -->

    <section
        class="questions"
        id="questions"
    ></section>


    <!-- EMPTY -->

    <div
        class="empty"
        id="empty"
    >

        <div class="empty-icon">
            📝
        </div>

        <h2>
            لا توجد أسئلة
        </h2>

        <p>
            لم تتم إضافة أسئلة لهذا الاختبار حتى الآن.
        </p>

    </div>


    <!-- SUBMIT -->

    <section
        class="submit-box"
        id="submitBox"
    >

        <p class="submit-info">
            تأكد من مراجعة إجاباتك قبل تسليم الاختبار.
        </p>

        <button
            class="submit-btn"
            id="submitBtn"
        >
            تسليم الاختبار
        </button>

    </section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

/*
============================================================
    EXAM PAGE - SUPABASE
============================================================

    الرابط:

    exam.html?id=EXAM_ID

    لا يوجد Demo Data.

    كل البيانات تأتي من قاعدة البيانات.

============================================================
*/


/* =========================================================
   PARAMS
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const examId =
    params.get("id");


/* =========================================================
   ELEMENTS
========================================================= */

const loading =
    document.getElementById("loading");

const examTitle =
    document.getElementById("examTitle");

const examSubtitle =
    document.getElementById("examSubtitle");

const questionsContainer =
    document.getElementById("questions");

const empty =
    document.getElementById("empty");

const submitBox =
    document.getElementById("submitBox");

const submitBtn =
    document.getElementById("submitBtn");

const timer =
    document.getElementById("timer");

const timerBox =
    document.getElementById("timerBox");

const progressText =
    document.getElementById("progressText");

const progressFill =
    document.getElementById("progressFill");

const errorBox =
    document.getElementById("errorBox");


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;

let currentExam = null;

let examQuestions = [];

let remainingSeconds = 0;

let timerInterval = null;

let submitting = false;


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/* =========================================================
   LOAD EXAM
========================================================= */

async function loadExam() {

    loading.style.display =
        "flex";


    try {

        /* -----------------------------------------------
           CHECK EXAM ID
        ------------------------------------------------ */

        if (!examId) {

            throw new Error(
                "لم يتم تحديد الاختبار."
            );

        }


        /* -----------------------------------------------
           CHECK SUPABASE
        ------------------------------------------------ */

        if (
            typeof supabase === "undefined"
        ) {

            throw new Error(
                "لم يتم تحميل ملف Supabase."
            );

        }


        /* -----------------------------------------------
           CHECK LOGIN
        ------------------------------------------------ */

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabase.auth.getSession();


        if (sessionError) {

            throw sessionError;

        }


        currentUser =
            sessionData?.session?.user;


        if (!currentUser) {

            window.location.href =
                "auth.html";

            return;

        }


        /* -----------------------------------------------
           LOAD EXAM
        ------------------------------------------------ */

        const {
            data: exam,
            error: examError
        } =
            await supabase

                .from("exams")

                .select("*")

                .eq(
                    "id",
                    examId
                )

                .single();


        if (examError) {

            console.error(
                "Exam error:",
                examError
            );

            throw new Error(
                "لم نتمكن من تحميل الاختبار."
            );

        }


        if (!exam) {

            throw new Error(
                "الاختبار غير موجود."
            );

        }


        /* -----------------------------------------------
           CHECK PUBLISHED
        ------------------------------------------------ */

        if (
            exam.published === false
        ) {

            throw new Error(
                "هذا الاختبار غير متاح حاليًا."
            );

        }


        currentExam =
            exam;


        /* -----------------------------------------------
           EXAM INFO
        ------------------------------------------------ */

        examTitle.textContent =
            exam.title ||
            "اختبار";


        examSubtitle.textContent =
            exam.description ||
            "اختبار رياضيات";


        /* -----------------------------------------------
           DURATION
        ------------------------------------------------ */

        remainingSeconds =
            Number(
                exam.duration ||
                exam.duration_minutes ||
                30
            ) * 60;


        /* -----------------------------------------------
           LOAD QUESTIONS
        ------------------------------------------------ */

        const {
            data: questions,
            error: questionsError
        } =
            await supabase

                .from("questions")

                .select("*")

                .eq(
                    "exam_id",
                    examId
                )

                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


        if (questionsError) {

            console.error(
                "Questions error:",
                questionsError
            );

            throw new Error(
                "حدث خطأ أثناء تحميل أسئلة الاختبار."
            );

        }


        examQuestions =
            questions || [];


        renderQuestions(
            examQuestions
        );


        startTimer();

    }

    catch (error) {

        console.error(
            "Load exam error:",
            error
        );


        questionsContainer.innerHTML =
            "";


        empty.style.display =
            "block";


        submitBox.style.display =
            "none";


        showError(
            error.message ||
            "حدث خطأ أثناء تحميل الاختبار."
        );

    }

    finally {

        loading.style.display =
            "none";

    }

}


/* =========================================================
   RENDER QUESTIONS
========================================================= */

function renderQuestions(
    questions
) {

    questionsContainer.innerHTML =
        "";


    if (
        !questions ||
        questions.length === 0
    ) {

        empty.style.display =
            "block";

        submitBox.style.display =
            "none";

        progressText.textContent =
            "0 / 0";

        return;

    }


    empty.style.display =
        "none";


    submitBox.style.display =
        "block";


    questions.forEach(
        (question, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "question-card";


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "question-number";


            number.textContent =
                "السؤال " +
                (index + 1);


            const questionText =
                document.createElement(
                    "div"
                );


            questionText.className =
                "question-text";


            questionText.textContent =
                question.question ||
                question.question_text ||
                "";


            card.appendChild(
                number
            );


            card.appendChild(
                questionText
            );


            const type =
                String(
                    question.type ||
                    question.question_type ||
                    "mcq"
                ).toLowerCase();


            /* =================================================
               MCQ
            ================================================= */

            if (
                type === "mcq" ||
                type === "multiple_choice" ||
                type === "multiple-choice"
            ) {

                const optionsContainer =
                    document.createElement(
                        "div"
                    );


                optionsContainer.className =
                    "options";


                let options =
                    question.options;


                /*
                    لو options محفوظة كـ JSON
                */

                if (
                    typeof options === "string"
                ) {

                    try {

                        options =
                            JSON.parse(
                                options
                            );

                    }

                    catch {

                        options = [];

                    }

                }


                /*
                    دعم options بالشكل:

                    [
                        {
                            id:"a",
                            text:"..."
                        }
                    ]

                    أو:

                    [
                        "..."
                    ]
                */


                if (
                    Array.isArray(options)
                ) {

                    const letters =
                        [
                            "أ",
                            "ب",
                            "ج",
                            "د",
                            "هـ"
                        ];


                    options.forEach(
                        (option, optionIndex) => {

                            let optionId =
                                optionIndex;


                            let optionText =
                                option;


                            if (
                                typeof option === "object"
                                &&
                                option !== null
                            ) {

                                optionId =
                                    option.id ??
                                    option.value ??
                                    optionIndex;

                                optionText =
                                    option.text ??
                                    option.label ??
                                    option.value ??
                                    "";

                            }


                            const label =
                                document.createElement(
                                    "label"
                                );


                            label.className =
                                "option";


                            const input =
                                document.createElement(
                                    "input"
                                );


                            input.type =
                                "radio";


                            input.name =
                                "question_" +
                                question.id;


                            input.value =
                                String(
                                    optionId
                                );


                            input.addEventListener(
                                "change",
                                updateProgress
                            );


                            const content =
                                document.createElement(
                                    "div"
                                );


                            content.className =
                                "option-content";


                            const letter =
                                document.createElement(
                                    "span"
                                );


                            letter.className =
                                "option-letter";


                            letter.textContent =
                                letters[
                                    optionIndex
                                ] ||
                                String(
                                    optionIndex + 1
                                );


                            const text =
                                document.createElement(
                                    "span"
                                );


                            text.className =
                                "option-text";


                            text.textContent =
                                optionText;


                            content.appendChild(
                                letter
                            );


                            content.appendChild(
                                text
                            );


                            label.appendChild(
                                input
                            );


                            label.appendChild(
                                content
                            );


                            optionsContainer.appendChild(
                                label
                            );

                        }
                    );

                }


                card.appendChild(
                    optionsContainer
                );

            }


            /* =================================================
               ESSAY
            ================================================= */

            else {

                const textarea =
                    document.createElement(
                        "textarea"
                    );


                textarea.name =
                    "question_" +
                    question.id;


                textarea.placeholder =
                    "اكتب إجابتك هنا...";


                textarea.addEventListener(
                    "input",
                    updateProgress
                );


                card.appendChild(
                    textarea
                );

            }


            questionsContainer.appendChild(
                card
            );

        }
    );


    updateProgress();

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const total =
        examQuestions.length;


    let answered =
        0;


    examQuestions.forEach(
        question => {

            const radio =
                document.querySelector(
                    `input[name="question_${question.id}"]:checked`
                );


            if (radio) {

                answered++;

                return;

            }


            const textarea =
                document.querySelector(
                    `textarea[name="question_${question.id}"]`
                );


            if (
                textarea &&
                textarea.value.trim()
            ) {

                answered++;

            }

        }
    );


    progressText.textContent =
        answered +
        " / " +
        total;


    const percentage =
        total > 0
            ? (answered / total) * 100
            : 0;


    progressFill.style.width =
        percentage + "%";

}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    updateTimer();


    timerInterval =
        setInterval(
            () => {

                remainingSeconds--;


                updateTimer();


                if (
                    remainingSeconds <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    submitExam(
                        true
                    );

                }

            },
            1000
        );

}


/* =========================================================
   TIMER UI
========================================================= */

function updateTimer() {

    const safeSeconds =
        Math.max(
            0,
            remainingSeconds
        );


    const minutes =
        Math.floor(
            safeSeconds / 60
        );


    const seconds =
        safeSeconds % 60;


    timer.textContent =
        String(minutes)
            .padStart(2, "0")
        +
        ":"
        +
        String(seconds)
            .padStart(2, "0");


    if (
        safeSeconds <= 60
    ) {

        timerBox.classList.add(
            "warning"
        );

    }

}


/* =========================================================
   GET ANSWERS
========================================================= */

function getAnswers() {

    const answers =
        [];


    examQuestions.forEach(
        question => {

            const radio =
                document.querySelector(
                    `input[name="question_${question.id}"]:checked`
                );


            if (radio) {

                answers.push({

                    question_id:
                        question.id,

                    answer:
                        radio.value

                });

                return;

            }


            const textarea =
                document.querySelector(
                    `textarea[name="question_${question.id}"]`
                );


            if (textarea) {

                answers.push({

                    question_id:
                        question.id,

                    answer:
                        textarea.value.trim()

                });

            }

        }
    );


    return answers;

}


/* =========================================================
   SUBMIT
========================================================= */

submitBtn.addEventListener(
    "click",
    () => submitExam(false)
);


async function submitExam(
    automatic = false
) {

    if (submitting) {

        return;

    }


    const answers =
        getAnswers();


    const total =
        examQuestions.length;


    const answered =
        answers.filter(
            item =>
                item.answer !== null &&
                item.answer !== undefined &&
                String(
                    item.answer
                ).trim() !== ""
        ).length;


    /* -----------------------------------------------
       CONFIRM
    ------------------------------------------------ */

    if (!automatic) {

        if (
            answered < total
        ) {

            const confirmed =
                confirm(
                    `أجبت على ${answered} من ${total} سؤال. هل تريد تسليم الاختبار؟`
                );


            if (!confirmed) {

                return;

            }

        }

        else {

            const confirmed =
                confirm(
                    "هل أنت متأكد من تسليم الاختبار؟"
                );


            if (!confirmed) {

                return;

            }

        }

    }


    submitting =
        true;


    submitBtn.disabled =
        true;


    submitBtn.textContent =
        "جاري تسليم الاختبار...";


    clearInterval(
        timerInterval
    );


    try {

        /* =================================================
           CALCULATE SCORE FOR MCQ
        ================================================= */

        let score =
            0;


        let autoGraded =
            true;


        examQuestions.forEach(
            question => {

                const answer =
                    answers.find(
                        item =>
                            String(
                                item.question_id
                            )
                            ===
                            String(
                                question.id
                            )
                    );


                if (!answer) {

                    return;

                }


                const type =
                    String(
                        question.type ||
                        question.question_type ||
                        "mcq"
                    ).toLowerCase();


                if (
                    type === "essay"
                    ||
                    type === "text"
                    ||
                    type === "short_answer"
                ) {

                    autoGraded =
                        false;

                    return;

                }


                const correct =
                    question.correct_answer ??
                    question.answer ??
                    question.correct_option;


                if (
                    correct !== null &&
                    correct !== undefined
                    &&
                    String(correct)
                        ===
                    String(answer.answer)
                ) {

                    score++;

                }

            }
        );


        /* =================================================
           SAVE RESULT
        ================================================= */


        /*
            الجدول المقترح:

            results

            id
            student_id
            exam_id
            answers
            score
            total_questions
            submitted_at
        */


        const resultData = {

            student_id:
                currentUser.id,

            exam_id:
                examId,

            answers:
                answers,

            score:
                score,

            total_questions:
                total,

            submitted_at:
                new Date().toISOString()

        };


        const {
            data: result,
            error: resultError
        } =
            await supabase

                .from("results")

                .insert(
                    resultData
                )

                .select()

                .single();


        if (resultError) {

            console.error(
                "Result insert error:",
                resultError
            );

            throw new Error(
                "لم نتمكن من حفظ إجاباتك. تأكد من إعداد جدول النتائج في Supabase."
            );

        }


        /* =================================================
           SAVE LOCAL RESULT ID
        ================================================= */

        if (result?.id) {

            localStorage.setItem(
                "last_result_id",
                result.id
            );

        }


        /* =================================================
           GO RESULT
        ================================================= */

        window.location.href =
            "result.html?exam_id=" +
            encodeURIComponent(
                examId
            )
            +
            (
                result?.id
                    ? "&result_id=" +
                      encodeURIComponent(
                          result.id
                      )
                    : ""
            );

    }

    catch (error) {

        console.error(
            "Submit error:",
            error
        );


        submitting =
            false;


        submitBtn.disabled =
            false;


        submitBtn.textContent =
            "تسليم الاختبار";


        showError(
            error.message ||
            "حدث خطأ أثناء تسليم الاختبار."
        );

    }

}


/* =========================================================
   EXIT
========================================================= */

function exitExam() {

    if (submitting) {

        return;

    }


    const leave =
        confirm(
            "هل أنت متأكد أنك تريد الخروج؟ سيتم فقدان الإجابات غير المحفوظة."
        );


    if (leave) {

        clearInterval(
            timerInterval
        );


        window.location.href =
            "tests.html";

    }

}


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    loadExam
);

</script>
