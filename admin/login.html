<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>دخول الإدارة | الخوارزمي</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Cairo",Arial,sans-serif;
}

:root{

    --bg:#050507;
    --card:rgba(18,18,27,.90);
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --muted:#9999a8;
    --primary:#7657ff;
    --primary-dark:#4d35d9;
    --danger:#ff6078;
    --success:#35d39a;

}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

    color:var(--text);

    background:

        radial-gradient(
            circle at 20% 10%,
            rgba(118,87,255,.20),
            transparent 32%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(70,45,190,.15),
            transparent 32%
        ),

        #050507;

}

.container{

    width:min(430px,100%);

}

.brand{

    text-align:center;

    margin-bottom:20px;

}

.logo{

    width:70px;
    height:70px;

    margin:0 auto 12px;

    display:grid;

    place-items:center;

    border-radius:22px;

    background:

        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    font-size:32px;

    font-weight:900;

    box-shadow:

        0 0 40px
        rgba(118,87,255,.25);

}

.brand h1{

    font-size:25px;

    font-weight:900;

}

.brand p{

    color:var(--muted);

    font-size:10px;

    margin-top:4px;

}

.card{

    padding:27px;

    border-radius:23px;

    border:
        1px solid var(--border);

    background:var(--card);

    box-shadow:

        0 30px 100px
        rgba(0,0,0,.35);

    backdrop-filter:blur(18px);

}

.card-title{

    font-size:17px;

    font-weight:900;

    margin-bottom:18px;

}

.form-group{

    margin-bottom:15px;

}

label{

    display:block;

    color:#c4c4ce;

    font-size:10px;

    font-weight:700;

    margin-bottom:7px;

}

.input-wrap{

    position:relative;

}

input{

    width:100%;

    height:50px;

    padding:0 13px;

    color:#fff;

    outline:none;

    border:
        1px solid var(--border);

    border-radius:12px;

    background:
        rgba(255,255,255,.035);

    font-size:11px;

    transition:.25s;

}

input:focus{

    border-color:
        rgba(118,87,255,.50);

    background:
        rgba(118,87,255,.05);

    box-shadow:

        0 0 0 3px
        rgba(118,87,255,.06);

}

.password-toggle{

    position:absolute;

    left:10px;

    top:50%;

    transform:translateY(-50%);

    border:0;

    background:transparent;

    color:#999;

    cursor:pointer;

    font-size:16px;

}

.login-btn{

    width:100%;

    height:51px;

    border:0;

    border-radius:13px;

    color:#fff;

    cursor:pointer;

    font-size:11px;

    font-weight:900;

    background:

        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    transition:.25s;

    box-shadow:

        0 12px 30px
        rgba(118,87,255,.18);

}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:

        0 16px 38px
        rgba(118,87,255,.28);

}

.login-btn:disabled{

    opacity:.55;

    cursor:not-allowed;

    transform:none;

}

.message{

    display:none;

    margin-bottom:14px;

    padding:11px;

    border-radius:10px;

    font-size:9px;

    line-height:1.8;

    text-align:center;

}

.message.error{

    display:block;

    color:#ff9aaa;

    background:
        rgba(255,96,120,.07);

    border:
        1px solid
        rgba(255,96,120,.15);

}

.message.success{

    display:block;

    color:#8ce6bf;

    background:
        rgba(53,211,154,.07);

    border:
        1px solid
        rgba(53,211,154,.15);

}

.footer{

    text-align:center;

    margin-top:18px;

    color:#666673;

    font-size:8px;

}

.loading{

    position:fixed;

    inset:0;

    z-index:999;

    display:none;

    align-items:center;

    justify-content:center;

    background:#050507;

}

.spinner{

    width:42px;

    height:42px;

    border-radius:50%;

    border:
        3px solid
        rgba(118,87,255,.15);

    border-top-color:
        var(--primary);

    animation:
        spin .8s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

@media(max-width:500px){

    body{
        padding:15px;
    }

    .card{
        padding:21px;
    }

}

</style>

</head>


<body>


<div
    class="loading"
    id="loading"
>

    <div class="spinner"></div>

</div>


<div class="container">


    <div class="brand">

        <div class="logo">
            خ
        </div>

        <h1>
            الخوارزمي
        </h1>

        <p>
            لوحة تحكم الإدارة
        </p>

    </div>


    <div class="card">

        <div class="card-title">
            🔐 تسجيل دخول الأدمن
        </div>


        <div
            id="message"
            class="message"
        ></div>


        <form id="loginForm">


            <div class="form-group">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="admin@example.com"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    كلمة المرور
                </label>

                <div class="input-wrap">

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                دخول لوحة التحكم
            </button>


        </form>

    </div>


    <div class="footer">
        الخوارزمي © جميع الحقوق محفوظة
    </div>


</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

/*
   ضع هنا بيانات مشروعك من Supabase

   Project URL
   + 
   Publishable Key

   أو anon key في المشاريع القديمة.

   ممنوع وضع service_role key هنا.
*/

const SUPABASE_URL =
    "https://fdqolsygigqukejlwcon.supabase.co";


const SUPABASE_KEY =
    "ضع_publishable_key_هنا";


/* =========================================================
   CREATE CLIENT
   ========================================================= */

let supabaseClient = null;

try{

    if(
        SUPABASE_URL &&
        SUPABASE_URL.startsWith("https://") &&
        SUPABASE_KEY &&
        !SUPABASE_KEY.includes("ضع_")
    ){

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY,
                {
                    auth:{
                        persistSession:true,
                        autoRefreshToken:true,
                        detectSessionInUrl:true
                    }
                }
            );

    }

}catch(error){

    console.error(
        "Supabase initialization error:",
        error
    );

}


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const passwordToggle =
    document.getElementById("passwordToggle");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const loading =
    document.getElementById("loading");


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(
    text,
    type="error"
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =========================================================
   CLEAR MESSAGE
   ========================================================= */

function clearMessage(){

    message.textContent =
        "";

    message.className =
        "message";

}


/* =========================================================
   LOADING
   ========================================================= */

function setLoading(state){

    loading.style.display =
        state ? "flex" : "none";

    loginBtn.disabled =
        state;

    loginBtn.textContent =
        state
        ? "جاري تسجيل الدخول..."
        : "دخول لوحة التحكم";

}


/* =========================================================
   PASSWORD TOGGLE
   ========================================================= */

passwordToggle.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            passwordToggle.textContent =
                "🙈";

        }else{

            passwordInput.type =
                "password";

            passwordToggle.textContent =
                "👁";

        }

    }
);


/* =========================================================
   GET ADMIN PROFILE
   ========================================================= */

async function getAdminProfile(userId){

    const {
        data,
        error
    } =
        await supabaseClient

            .from("profiles")

            .select(
                "id, full_name, role"
            )

            .eq(
                "id",
                userId
            )

            .maybeSingle();


    if(error){

        console.error(
            "PROFILE ERROR:",
            error
        );

        throw new Error(
            "تعذر قراءة صلاحيات الحساب من قاعدة البيانات."
        );

    }


    return data;

}


/* =========================================================
   CHECK ADMIN
   ========================================================= */

async function checkAdmin(){

    if(!supabaseClient){

        return false;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if(error){

        console.error(error);

        return false;

    }


    const session =
        data?.session;


    if(
        !session ||
        !session.user
    ){

        return false;

    }


    const profile =
        await getAdminProfile(
            session.user.id
        );


    if(
        profile &&
        profile.role === "admin"
    ){

        return true;

    }


    /*
       المستخدم مسجل دخول
       ولكنه ليس Admin.
    */

    await supabaseClient
        .auth
        .signOut();


    return false;

}


/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        clearMessage();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if(!email){

            showMessage(
                "اكتب البريد الإلكتروني."
            );

            return;

        }


        if(!password){

            showMessage(
                "اكتب كلمة المرور."
            );

            return;

        }


        if(!supabaseClient){

            showMessage(
                "Supabase غير متصل. تأكد من وضع Project URL و Publishable Key."
            );

            return;

        }


        setLoading(true);


        try{

            /*
             * تسجيل الدخول من Supabase Auth
             */

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signInWithPassword({

                        email:
                            email,

                        password:
                            password

                    });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.user
            ){

                throw new Error(
                    "لم يتم العثور على بيانات المستخدم."
                );

            }


            /*
             * قراءة profile
             */

            const profile =
                await getAdminProfile(
                    data.user.id
                );


            /*
             * التحقق من role
             */

            if(
                !profile ||
                profile.role !== "admin"
            ){

                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "هذا الحساب ليس لديه صلاحية دخول لوحة الإدارة."
                );

            }


            /*
             * نجاح
             */

            showMessage(
                "تم تسجيل الدخول بنجاح ✅ جاري فتح لوحة التحكم...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                700
            );


        }catch(error){

            console.error(
                "ADMIN LOGIN ERROR:",
                error
            );


            let text =
                "حدث خطأ أثناء تسجيل الدخول.";


            const errorMessage =
                error?.message || "";


            if(
                errorMessage
                    .toLowerCase()
                    .includes(
                        "invalid login credentials"
                    )
            ){

                text =
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }

            else if(
                errorMessage
                    .toLowerCase()
                    .includes(
                        "email not confirmed"
                    )
            ){

                text =
                    "يجب تأكيد البريد الإلكتروني أولًا.";

            }

            else if(
                errorMessage
                    .toLowerCase()
                    .includes(
                        "rate limit"
                    )
            ){

                text =
                    "تم تجاوز عدد المحاولات مؤقتًا. انتظر قليلًا ثم حاول مرة أخرى.";

            }

            else if(
                errorMessage
                    .includes(
                        "ليس لديه صلاحية"
                    )
            ){

                text =
                    errorMessage;

            }

            else if(
                errorMessage
            ){

                text =
                    errorMessage;

            }


            showMessage(text);


        }finally{

            setLoading(false);

        }

    }
);


/* =========================================================
   CHECK EXISTING SESSION
   ========================================================= */

async function checkExistingSession(){

    if(!supabaseClient){

        return;

    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if(error){

            console.error(error);

            return;

        }


        const session =
            data?.session;


        if(
            !session ||
            !session.user
        ){

            return;

        }


        /*
         * لدينا جلسة بالفعل.
         * نتأكد أنها Admin.
         */

        const profile =
            await getAdminProfile(
                session.user.id
            );


        if(
            profile &&
            profile.role === "admin"
        ){

            window.location.replace(
                "index.html"
            );

            return;

        }


        /*
         * لو ليس Admin
         */

        await supabaseClient
            .auth
            .signOut();


    }catch(error){

        console.error(
            "SESSION CHECK ERROR:",
            error
        );

    }

}


/* =========================================================
   AUTH STATE
   ========================================================= */

if(supabaseClient){

    supabaseClient
        .auth
        .onAuthStateChange(
            function(event, session){

                console.log(
                    "AUTH EVENT:",
                    event
                );

            }
        );

}


/* =========================================================
   START
   ========================================================= */

checkExistingSession();

</script>

</body>

</html>
