<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | تسجيل الدخول</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:"Cairo","Tajawal",Arial,sans-serif;
    color:#fff;
    background:#07070d;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:20px 0;
}

body::before{
    content:"";
    position:fixed;
    width:650px;
    height:650px;
    top:-300px;
    right:-200px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(113,73,245,.24),
        transparent 68%
    );
    filter:blur(30px);
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    bottom:-300px;
    left:-250px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(44,82,225,.18),
        transparent 68%
    );
    filter:blur(30px);
    pointer-events:none;
}

.page{
    width:min(1050px,calc(100% - 28px));
    min-height:650px;

    display:grid;
    grid-template-columns:1fr 1fr;

    border-radius:30px;
    overflow:hidden;

    background:rgba(14,14,23,.88);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 40px 120px rgba(0,0,0,.65);

    backdrop-filter:blur(25px);

    position:relative;
    z-index:2;

    animation:pageShow .7s ease;
}

@keyframes pageShow{

    from{
        opacity:0;
        transform:translateY(25px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

.visual{
    min-height:650px;

    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        145deg,
        #11101e,
        #171333,
        #0c1020
    );
}

.visual::before{
    content:"";

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(125,82,255,.35),
        transparent 68%
    );

    filter:blur(20px);

    animation:visualGlow 5s ease-in-out infinite;
}

@keyframes visualGlow{

    0%,100%{
        transform:scale(1);
        opacity:.7;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }

}

.ring{
    position:absolute;

    width:410px;
    height:410px;

    border-radius:50%;

    border:1px solid rgba(145,112,255,.25);

    animation:rotate 18s linear infinite;
}

.ring::before{
    content:"";

    position:absolute;

    width:9px;
    height:9px;

    top:8%;
    right:12%;

    border-radius:50%;

    background:#a78aff;

    box-shadow:
        0 0 25px #a78aff;
}

@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

.visual-content{
    position:relative;
    z-index:3;

    text-align:center;

    padding:30px;
}

.big-logo{
    width:105px;
    height:105px;

    margin:0 auto 25px;

    display:grid;
    place-items:center;

    border-radius:30px;

    font-size:58px;
    font-weight:900;

    background:linear-gradient(
        135deg,
        #895aff,
        #3159e8
    );

    box-shadow:
        0 25px 70px rgba(92,65,230,.4);

    animation:floating 4s ease-in-out infinite;
}

@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

}

.visual-content h1{
    font-size:35px;
    margin-bottom:10px;
}

.visual-content h1 span{
    color:#a58aff;
}

.visual-content p{
    color:#858592;
    font-size:12px;
    line-height:2;

    max-width:350px;

    margin:auto;
}

.form-area{
    padding:45px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    position:relative;
}

.back{
    position:absolute;

    top:25px;
    right:30px;

    color:#777783;

    font-size:11px;

    transition:.25s;

    text-decoration:none;
}

.back:hover{
    color:#fff;
}

.form-header{
    margin-bottom:25px;
}

.form-header small{
    color:#9170ff;
    font-size:10px;
}

.form-header h2{
    font-size:30px;
    margin-top:7px;
}

.form-header p{
    color:#777783;
    font-size:10px;

    margin-top:7px;

    line-height:1.8;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;

    padding:4px;

    margin-bottom:23px;

    border-radius:13px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.06);
}

.tab{
    border:0;

    padding:11px;

    border-radius:10px;

    background:transparent;

    color:#777783;

    font-family:inherit;
    font-size:10px;

    cursor:pointer;

    transition:.3s;
}

.tab.active{
    color:#fff;

    background:linear-gradient(
        135deg,
        rgba(124,82,245,.8),
        rgba(49,87,220,.8)
    );

    box-shadow:
        0 8px 25px rgba(78,60,200,.25);
}

.form{
    display:none;

    animation:formShow .35s ease;
}

.form.active{
    display:block;
}

@keyframes formShow{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;

    color:#aaaab5;

    font-size:10px;

    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

.input-wrap > span{
    position:absolute;

    right:14px;
    top:50%;

    transform:translateY(-50%);

    color:#666673;

    font-size:14px;

    pointer-events:none;

    z-index:2;
}

input,
select{

    width:100%;
    height:48px;

    padding:0 42px 0 45px;

    border-radius:12px;

    outline:none;

    color:#fff;

    font-family:inherit;

    font-size:11px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.075);

    transition:.25s;
}

input::placeholder{
    color:#555561;
}

input:focus,
select:focus{

    border-color:
        rgba(135,99,255,.6);

    background:
        rgba(255,255,255,.055);

    box-shadow:
        0 0 0 3px
        rgba(120,80,245,.08);
}

select{
    appearance:auto;
}

select option{
    background:#171722;
    color:#fff;
}

.password-toggle{

    position:absolute;

    left:13px;
    top:50%;

    transform:translateY(-50%);

    border:0;

    background:transparent;

    color:#777783;

    cursor:pointer;

    font-size:13px;

    z-index:3;
}

.submit{

    width:100%;
    height:50px;

    border:0;

    border-radius:13px;

    color:#fff;

    font-family:inherit;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    background:linear-gradient(
        135deg,
        #8558f6,
        #315be9
    );

    box-shadow:
        0 15px 35px
        rgba(76,60,205,.25);

    transition:.3s;
}

.submit:hover{
    transform:translateY(-2px);

    box-shadow:
        0 20px 45px
        rgba(76,60,205,.4);
}

.submit:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.message{

    display:none;

    margin-top:13px;

    padding:11px;

    border-radius:10px;

    text-align:center;

    font-size:9px;

    line-height:1.7;
}

.message.show{
    display:block;
}

.message.error{

    color:#ff9eaa;

    background:
        rgba(255,70,90,.08);

    border:
        1px solid
        rgba(255,70,90,.13);
}

.message.success{

    color:#9ff0bd;

    background:
        rgba(50,210,110,.08);

    border:
        1px solid
        rgba(50,210,110,.13);
}

.form-footer{

    margin-top:22px;

    text-align:center;

    color:#555561;

    font-size:8px;

    line-height:1.8;
}

@media(max-width:800px){

    body{
        padding:20px 0;
    }

    .page{

        grid-template-columns:1fr;

        min-height:auto;

        width:calc(100% - 22px);

        border-radius:23px;
    }

    .visual{

        min-height:270px;

        padding:20px;
    }

    .ring{

        width:250px;
        height:250px;
    }

    .big-logo{

        width:75px;
        height:75px;

        border-radius:22px;

        font-size:40px;

        margin-bottom:15px;
    }

    .visual-content h1{
        font-size:26px;
    }

    .visual-content p{
        font-size:9px;
    }

    .form-area{
        padding:30px 22px 35px;
    }

}

@media(max-width:430px){

    .page{
        width:calc(100% - 14px);
    }

    .visual{
        min-height:235px;
    }

    .visual-content{
        padding:15px;
    }

    .visual-content h1{
        font-size:23px;
    }

    .visual-content p{
        font-size:8px;
    }

    .form-area{
        padding:28px 17px 25px;
    }

    .form-header h2{
        font-size:25px;
    }

    input,
    select{
        height:46px;
    }

}

</style>

</head>

<body>

<div class="page">

<section class="visual">

<div class="ring"></div>

<div class="visual-content">

</div>

<!-- =================================================
     SUPABASE
================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase.js"></script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const loginTab =
    document.getElementById("loginTab");

const registerTab =
    document.getElementById("registerTab");

const loginForm =
    document.getElementById("loginForm");

const registerForm =
    document.getElementById("registerForm");

const loginMessage =
    document.getElementById("loginMessage");

const registerMessage =
    document.getElementById("registerMessage");

const loginButton =
    document.getElementById("loginButton");

const registerButton =
    document.getElementById("registerButton");


/* =====================================================
   SUPABASE
===================================================== */

function getSupabase(){

    if(
        !window.supabaseClient
    ){

        throw new Error(
            "Supabase غير متصل. تأكد من تحميل supabase.js."
        );

    }

    return window.supabaseClient;
}


/* =====================================================
   TABS
===================================================== */

loginTab.addEventListener(
    "click",
    function(){

        loginTab.classList.add("active");

        registerTab.classList.remove("active");

        loginForm.classList.add("active");

        registerForm.classList.remove("active");

        loginMessage.className = "message";

        registerMessage.className = "message";

    }
);


registerTab.addEventListener(
    "click",
    function(){

        registerTab.classList.add("active");

        loginTab.classList.remove("active");

        registerForm.classList.add("active");

        loginForm.classList.remove("active");

        loginMessage.className = "message";

        registerMessage.className = "message";

    }
);


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

document
    .querySelectorAll(".password-toggle")
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                const input =
                    document.getElementById(
                        button.dataset.target
                    );

                if(
                    input.type === "password"
                ){

                    input.type = "text";

                    button.textContent = "🙈";

                }else{

                    input.type = "password";

                    button.textContent = "👁";

                }

            }
        );

    });


/* =====================================================
   EGYPT PHONE
===================================================== */

function validEgyptPhone(phone){

    return /^01[0125][0-9]{8}$/.test(
        phone
    );

}


/* =====================================================
   EMAIL
===================================================== */

function validEmail(email){

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
        email
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    element,
    text,
    type
){

    element.textContent = text;

    element.className =
        "message show " + type;

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        loginButton.disabled = true;

        loginMessage.className =
            "message";


        const identifier =
            document
                .getElementById(
                    "loginIdentifier"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "loginPassword"
                )
                .value;


        if(
            !identifier ||
            !password
        ){

            showMessage(
                loginMessage,
                "اكتب البريد الإلكتروني أو رقم الموبايل وكلمة المرور.",
                "error"
            );

            loginButton.disabled = false;

            return;

        }


        try{

            const supabase =
                getSupabase();


            /* =========================================
               تحديد هل الدخول بالبريد أم بالموبايل
            ========================================= */

            let email =
                identifier;


            if(
                validEgyptPhone(identifier)
            ){

                /*
                 * البحث عن البريد المرتبط
                 * برقم الموبايل داخل profiles
                 */

                const phoneResult =
                    await supabase
                        .from("profiles")
                        .select("email")
                        .eq(
                            "phone",
                            identifier
                        )
                        .maybeSingle();


                if(
                    phoneResult.error
                ){

                    throw phoneResult.error;

                }


                if(
                    !phoneResult.data ||
                    !phoneResult.data.email
                ){

                    throw new Error(
                        "رقم الموبايل غير مسجل في المنصة."
                    );

                }


                email =
                    phoneResult.data.email;

            }


            /*
             * لو ليس رقمًا،
             * نتحقق أنه بريد إلكتروني
             */

            if(
                !validEgyptPhone(identifier) &&
                !validEmail(email)
            ){

                throw new Error(
                    "اكتب بريدًا إلكترونيًا صحيحًا أو رقم موبايل مصري صحيح."
                );

            }


            /* =========================================
               SUPABASE AUTH
            ========================================= */

            const loginResult =
                await supabase
                    .auth
                    .signInWithPassword({

                        email:email,

                        password:password

                    });


            if(
                loginResult.error
            ){

                throw loginResult.error;

            }


            const user =
                loginResult
                    .data
                    ?.user;


            if(!user){

                throw new Error(
                    "لم يتم العثور على الحساب."
                );

            }


            /* =========================================
               PROFILE
            ========================================= */

            const profileResult =
                await supabase
                    .from("profiles")
                    .select(
                        "id,full_name,email,phone,role,grade"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .maybeSingle();


            if(
                profileResult.error
            ){

                throw profileResult.error;

            }


            /*
             * لو profile غير موجود
             */

            if(
                !profileResult.data
            ){

                /*
                 * نحاول إنشاء profile
                 * باستخدام بيانات Auth فقط.
                 */

                const metadata =
                    user.user_metadata || {};


                const createProfile =
                    await supabase
                        .from("profiles")
                        .insert({

                            id:user.id,

                            full_name:
                                metadata.full_name || "",

                            email:
                                user.email || email,

                            phone:
                                metadata.phone || null,

                            parent_phone:
                                metadata.parent_phone || null,

                            grade:
                                metadata.grade || null,

                            role:"student"

                        });


                if(
                    createProfile.error
                ){

                    await supabase.auth.signOut();

                    throw new Error(
                        "تم تسجيل الدخول ولكن لم يتم العثور على ملف الحساب في profiles. راجع صلاحيات RLS."
                    );

                }

            }


            /*
             * إعادة قراءة الـ profile
             */

            const finalProfile =
                await supabase
                    .from("profiles")
                    .select(
                        "id,full_name,email,phone,role,grade"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .maybeSingle();


            if(
                finalProfile.error
            ){

                throw finalProfile.error;

            }


            const role =
                String(
                    finalProfile.data?.role ||
                    "student"
                ).toLowerCase();


            /* =========================================
               ADMIN
            ========================================= */

            if(
                role === "admin"
            ){

                showMessage(
                    loginMessage,
                    "تم تسجيل دخول الأدمن بنجاح. جاري فتح لوحة التحكم...",
                    "success"
                );


                setTimeout(
                    function(){

                        window.location.replace(
                            "./admin/index.html"
                        );

                    },
                    500
                );

                return;

            }


            /* =========================================
               STUDENT
            ========================================= */

            showMessage(
                loginMessage,
                "تم تسجيل الدخول بنجاح. جاري فتح المنصة...",
                "success"
            );


            setTimeout(
                function(){

                    /*
                     * مهم:
                     * لا يوجد home.html في مشروعك.
                     * لذلك نرجع إلى index.html.
                     */

                    window.location.replace(
                        "./index.html"
                    );

                },
                500
            );

        }catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            let text =
                error?.message ||
                "حدث خطأ أثناء تسجيل الدخول.";


            const lower =
                text.toLowerCase();


            if(
                lower.includes(
                    "invalid login credentials"
                )
            ){

                text =
                    "البريد أو رقم الموبايل أو كلمة المرور غير صحيحة.";

            }


            if(
                lower.includes(
                    "email not confirmed"
                )
            ){

                text =
                    "يجب تأكيد البريد الإلكتروني أولًا.";

            }


            showMessage(
                loginMessage,
                text,
                "error"
            );


            loginButton.disabled = false;

        }

    }
);


/* =====================================================
   REGISTER
===================================================== */

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        registerButton.disabled = true;

        registerMessage.className =
            "message";


        const name =
            document
                .getElementById(
                    "registerName"
                )
                .value
                .trim();


        const email =
            document
                .getElementById(
                    "registerEmail"
                )
                .value
                .trim()
                .toLowerCase();


        const phone =
            document
                .getElementById(
                    "registerPhone"
                )
                .value
                .trim();


        const parentPhone =
            document
                .getElementById(
                    "parentPhone"
                )
                .value
                .trim();


        const grade =
            document
                .getElementById(
                    "registerGrade"
                )
                .value;


        const password =
            document
                .getElementById(
                    "registerPassword"
                )
                .value;


        const confirmPassword =
            document
                .getElementById(
                    "confirmPassword"
                )
                .value;


        /* =========================================
           VALIDATION
        ========================================= */

        if(
            name.length < 3
        ){

            showMessage(
                registerMessage,
                "اكتب الاسم بالكامل.",
                "error"
            );

            registerButton.disabled = false;

            return;

        }


        if(
            !validEmail(email)
        ){

            showMessage(
                registerMessage,
                "اكتب بريدًا إلكترونيًا صحيحًا.",
                "error"
            );

            registerButton.disabled = false;

            return;

        }


        if(
            !validEgyptPhone(phone)
        ){

            showMessage(
                registerMessage,
                "رقم الموبايل غير صحيح.",
                "error"
            );

            registerButton.disabled = false;

            return;

        }


        if(
            !validEgyptPhone(parentPhone)
        ){

            showMessage(
                registerMessage,
                "رقم ولي الأمر غير صحيح.",
                "error"
            );

            registerButton.disabled = false;

            return;

        }


        if(!grade){

            showMessage(
                registerMessage,
                "اختر الصف الدراسي.",
                "error"
            );

            registerButton.disabled = false;

            return;

        }


        if(
            password.length < 6
        ){

            showMessage(
                registerMessage,
                "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
                "error"
            );

            registerButton.disabled = false;

            return;

        }


        if(
            password !== confirmPassword
        ){

            showMessage(
                registerMessage,
                "كلمتا المرور غير متطابقتين.",
                "error"
            );

            registerButton.disabled = false;

            return;

        }


        try{

            const supabase =
                getSupabase();


            /* =========================================
               التأكد أن البريد غير مستخدم
            ========================================= */

            /*
             * لا نستخدم Auth Admin من المتصفح.
             * نتحقق من profiles فقط.
             */


            const emailCheck =
                await supabase
                    .from("profiles")
                    .select("id")
                    .eq(
                        "email",
                        email
                    )
                    .maybeSingle();


            if(
                emailCheck.error
            ){

                throw emailCheck.error;

            }


            if(
                emailCheck.data
            ){

                throw new Error(
                    "البريد الإلكتروني مسجل بالفعل."
                );

            }


            /* =========================================
               التأكد أن رقم الموبايل غير مستخدم
            ========================================= */

            const phoneCheck =
                await supabase
                    .from("profiles")
                    .select("id")
                    .eq(
                        "phone",
                        phone
                    )
                    .maybeSingle();


            if(
                phoneCheck.error
            ){

                throw phoneCheck.error;

            }


            if(
                phoneCheck.data
            ){

                throw new Error(
                    "رقم الموبايل مسجل بالفعل."
                );

            }


            /* =========================================
               إنشاء حساب Supabase Auth
            ========================================= */

            const signupResult =
                await supabase
                    .auth
                    .signUp({

                        email:email,

                        password:password,

                        options:{

                            data:{

                                full_name:
                                    name,

                                phone:
                                    phone,

                                parent_phone:
                                    parentPhone,

                                grade:
                                    grade

                            }

                        }

                    });


            if(
                signupResult.error
            ){

                throw signupResult.error;

            }


            const user =
                signupResult
                    .data
                    ?.user;


            if(!user){

                throw new Error(
                    "فشل إنشاء الحساب."
                );

            }


            /* =========================================
               حفظ المستخدم في profiles
            ========================================= */

            const profileResult =
                await supabase
                    .from("profiles")
                    .upsert({

                        id:
                            user.id,

                        full_name:
                            name,

                        email:
                            email,

                        phone:
                            phone,

                        parent_phone:
                            parentPhone,

                        grade:
                            grade,

                        role:
                            "student"

                    },{
                        onConflict:"id"
                    });


            if(
                profileResult.error
            ){

                console.error(
                    "PROFILE ERROR:",
                    profileResult.error
                );


                /*
                 * لا نترك Session معلقة
                 * لو فشل حفظ الـ profile.
                 */

                if(
                    signupResult.data?.session
                ){

                    await supabase
                        .auth
                        .signOut();

                }


                throw new Error(
                    "تم إنشاء حساب Auth ولكن لم يتم حفظ بيانات الطالب في profiles. راجع RLS لجدول profiles."
                );

            }


            /* =========================================
               SUCCESS
            ========================================= */

            if(
                signupResult.data?.session
            ){

                showMessage(
                    registerMessage,
                    "تم إنشاء الحساب بنجاح. جاري فتح المنصة...",
                    "success"
                );


                setTimeout(
                    function(){

                        /*
                         * الطالب يدخل index.html
                         */

                        window.location.replace(
                            "./index.html"
                        );

                    },
                    700
                );


            }else{

                /*
                 * إذا كان Email Confirmation مفعلاً
                 */

                showMessage(
                    registerMessage,
                    "تم إنشاء الحساب بنجاح. افتح بريدك الإلكتروني لتأكيد الحساب ثم سجل الدخول.",
                    "success"
                );


                registerButton.disabled = false;

            }


        }catch(error){

            console.error(
                "REGISTER ERROR:",
                error
            );


            let text =
                error?.message ||
                "حدث خطأ أثناء إنشاء الحساب.";


            const lower =
                text.toLowerCase();


            if(
                lower.includes(
                    "user already registered"
                )
            ){

                text =
                    "هذا البريد الإلكتروني مسجل بالفعل.";

            }


            if(
                lower.includes(
                    "duplicate"
                )
            ){

                text =
                    "البريد أو رقم الموبايل مستخدم بالفعل.";

            }


            if(
                lower.includes(
                    "email rate limit"
                )
            ){

                text =
                    "تم تجاوز حد إرسال البريد مؤقتًا. انتظر قليلًا ثم حاول مرة أخرى.";

            }


            if(
                lower.includes(
                    "row-level security"
                )
            ){

                text =
                    "تم إنشاء الحساب لكن RLS يمنع حفظ بيانات الطالب في profiles. راجع سياسات RLS.";

            }


            showMessage(
                registerMessage,
                text,
                "error"
            );


            registerButton.disabled = false;

        }

    }
);


/* =====================================================
   PHONE INPUT
===================================================== */

document
    .querySelectorAll(
        'input[type="tel"]'
    )
    .forEach(
        function(input){

            input.addEventListener(
                "input",
                function(){

                    input.value =
                        input.value
                            .replace(
                                /[^0-9]/g,
                                ""
                            )
                            .slice(
                                0,
                                11
                            );

                }
            );

        }
    );


/* =====================================================
   YEAR
===================================================== */

document.getElementById(
    "year"
).textContent =
    new Date().getFullYear();


/* =====================================================
   SUPABASE CHECK
===================================================== */

window.addEventListener(
    "load",
    function(){

        if(
            !window.supabaseClient
        ){

            showMessage(
                loginMessage,
                "Supabase غير متصل. تأكد من وجود supabase.js بجوار auth.html.",
                "error"
            );

            console.error(
                "❌ supabaseClient غير موجود."
            );

        }else{

            console.log(
                "✅ Auth page connected to Supabase."
            );

        }

    }
);

</script>
