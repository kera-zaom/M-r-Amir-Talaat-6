<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | تسجيل الدخول</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    font-family:
        "Cairo",
        "Tajawal",
        Arial,
        sans-serif;

    color:#fff;

    background:#07070d;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow-x:hidden;

    position:relative;
}


/* =========================
   BACKGROUND
========================= */

body::before{

    content:"";

    position:fixed;

    width:650px;
    height:650px;

    top:-300px;
    right:-200px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(113,73,245,.24),
            transparent 68%
        );

    filter:blur(30px);

    pointer-events:none;
}

body::after{

    content:"";

    position:fixed;

    width:600px;
    height:600px;

    bottom:-300px;
    left:-250px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(44,82,225,.18),
            transparent 68%
        );

    filter:blur(30px);

    pointer-events:none;
}


/* =========================
   PAGE
========================= */

.page{

    width:min(
        1050px,
        calc(100% - 28px)
    );

    min-height:650px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    border-radius:30px;

    overflow:hidden;

    background:
        rgba(14,14,23,.86);

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 40px 120px
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(25px);

    position:relative;

    z-index:2;

    animation:
        pageShow .7s ease;
}

@keyframes pageShow{

    from{

        opacity:0;

        transform:
            translateY(25px)
            scale(.98);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================
   LEFT
========================= */

.visual{

    min-height:650px;

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #11101e,
            #171333,
            #0c1020
        );
}

.visual::before{

    content:"";

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(125,82,255,.35),
            transparent 68%
        );

    filter:blur(20px);

    animation:
        visualGlow 5s ease-in-out infinite;
}

@keyframes visualGlow{

    0%,100%{

        transform:scale(1);

        opacity:.7;

    }

    50%{

        transform:scale(1.15);

        opacity:1;

    }

}


/* =========================
   RING
========================= */

.ring{

    position:absolute;

    width:410px;
    height:410px;

    border-radius:50%;

    border:
        1px solid
        rgba(145,112,255,.25);

    animation:
        rotate 18s linear infinite;
}

.ring::before{

    content:"";

    position:absolute;

    width:9px;
    height:9px;

    top:8%;
    right:12%;

    border-radius:50%;

    background:#a78aff;

    box-shadow:
        0 0 25px
        #a78aff;
}

@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   LOGO
========================= */

.visual-content{

    position:relative;

    z-index:3;

    text-align:center;

    padding:30px;
}

.big-logo{

    width:105px;
    height:105px;

    margin:
        0 auto 25px;

    display:grid;

    place-items:center;

    border-radius:30px;

    font-size:58px;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #895aff,
            #3159e8
        );

    box-shadow:
        0 25px 70px
        rgba(92,65,230,.4);

    animation:
        floating 4s ease-in-out infinite;
}

@keyframes floating{

    0%,100%{

        transform:translateY(0);

    }

    50%{

        transform:translateY(-10px);

    }

}

.visual-content h1{

    font-size:35px;

    margin-bottom:10px;
}

.visual-content h1 span{

    color:#a58aff;
}

.visual-content p{

    color:#858592;

    font-size:12px;

    line-height:2;

    max-width:350px;

    margin:auto;
}


/* =========================
   FORM AREA
========================= */

.form-area{

    padding:45px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    position:relative;
}


/* BACK */

.back{

    position:absolute;

    top:25px;
    right:30px;

    color:#777783;

    font-size:11px;

    transition:.25s;

    text-decoration:none;
}

.back:hover{

    color:#fff;

}


/* =========================
   HEADER
========================= */

.form-header{

    margin-bottom:25px;
}

.form-header small{

    color:#9170ff;

    font-size:10px;
}

.form-header h2{

    font-size:30px;

    margin-top:7px;
}

.form-header p{

    color:#777783;

    font-size:10px;

    margin-top:7px;

    line-height:1.8;
}


/* =========================
   TABS
========================= */

.tabs{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    padding:4px;

    margin-bottom:23px;

    border-radius:13px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.06);
}

.tab{

    border:0;

    padding:11px;

    border-radius:10px;

    background:transparent;

    color:#777783;

    font-family:inherit;

    font-size:10px;

    cursor:pointer;

    transition:.3s;
}

.tab.active{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(124,82,245,.8),
            rgba(49,87,220,.8)
        );

    box-shadow:
        0 8px 25px
        rgba(78,60,200,.25);
}


/* =========================
   FORMS
========================= */

.form{

    display:none;

    animation:
        formShow .35s ease;
}

.form.active{

    display:block;

}

@keyframes formShow{

    from{

        opacity:0;

        transform:
            translateY(10px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =========================
   FIELD
========================= */

.field{

    margin-bottom:14px;
}

.field label{

    display:block;

    color:#aaaab5;

    font-size:10px;

    margin-bottom:7px;
}

.input-wrap{

    position:relative;
}

.input-wrap span{

    position:absolute;

    right:14px;

    top:50%;

    transform:
        translateY(-50%);

    color:#666673;

    font-size:14px;

    pointer-events:none;

}

input,
select{

    width:100%;

    height:48px;

    padding:
        0 42px
        0 14px;

    border-radius:12px;

    outline:none;

    color:#fff;

    font-family:inherit;

    font-size:11px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.075);

    transition:.25s;
}

input::placeholder{

    color:#555561;

}

input:focus,
select:focus{

    border-color:
        rgba(135,99,255,.6);

    background:
        rgba(255,255,255,.055);

    box-shadow:
        0 0 0 3px
        rgba(120,80,245,.08);
}

select{

    appearance:auto;

}


/* =========================
   PASSWORD
========================= */

.password-toggle{

    position:absolute;

    left:13px;

    top:50%;

    transform:
        translateY(-50%);

    border:0;

    background:transparent;

    color:#777783;

    cursor:pointer;

    font-size:13px;
}


/* =========================
   REMEMBER
========================= */

.remember{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin:
        4px 0 17px;
}

.check{

    display:flex;

    align-items:center;

    gap:7px;

    color:#777783;

    font-size:9px;
}

.check input{

    width:15px;
    height:15px;

    padding:0;

    accent-color:#7651ef;
}


/* =========================
   BUTTON
========================= */

.submit{

    width:100%;

    height:50px;

    border:0;

    border-radius:13px;

    color:#fff;

    font-family:inherit;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #8558f6,
            #315be9
        );

    box-shadow:
        0 15px 35px
        rgba(76,60,205,.25);

    transition:.3s;

    position:relative;

    overflow:hidden;
}

.submit:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 20px 45px
        rgba(76,60,205,.4);
}

.submit:active{

    transform:
        translateY(0);

}

.submit:disabled{

    cursor:not-allowed;

}


/* =========================
   LOADING
========================= */

.submit.loading{

    pointer-events:none;

    opacity:.7;

}

.submit.loading::after{

    content:"";

    position:absolute;

    width:18px;
    height:18px;

    border:
        2px solid
        rgba(255,255,255,.3);

    border-top-color:#fff;

    border-radius:50%;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    animation:
        spin .7s linear infinite;
}

@keyframes spin{

    to{

        transform:
            translate(-50%,-50%)
            rotate(360deg);

    }

}


/* =========================
   MESSAGE
========================= */

.message{

    display:none;

    margin-top:13px;

    padding:11px;

    border-radius:10px;

    text-align:center;

    font-size:9px;

    line-height:1.7;
}

.message.show{

    display:block;

}

.message.error{

    color:#ff9eaa;

    background:
        rgba(255,70,90,.08);

    border:
        1px solid
        rgba(255,70,90,.13);
}

.message.success{

    color:#9ff0bd;

    background:
        rgba(50,210,110,.08);

    border:
        1px solid
        rgba(50,210,110,.13);
}


/* =========================
   FOOTER
========================= */

.form-footer{

    margin-top:22px;

    text-align:center;

    color:#555561;

    font-size:8px;

    line-height:1.8;

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    body{

        padding:20px 0;

    }

    .page{

        grid-template-columns:1fr;

        min-height:auto;

        width:
            calc(100% - 22px);

        border-radius:23px;

    }

    .visual{

        min-height:270px;

        padding:20px;

    }

    .ring{

        width:250px;

    }

    .big-logo{

        width:75px;

        border-radius:22px;

        font-size:40px;

        margin-bottom:15px;

    }

    .visual-content h1{

        font-size:26px;

    }

    .visual-content p{

        font-size:9px;

    }

    .form-area{

        padding:
            30px 22px 35px;

    }

    .back{

        top:20px;
        right:22px;

    }

}


@media(max-width:430px){

    body{

        align-items:flex-start;

        padding:
            12px 0;

    }

            calc(100% - 16px);

    }

        min-height:235px;

    }

    }

    .visual-content h1{

        font-size:23px;

    }

    .visual-content p{

        font-size:8px;

    }

    .form-area{

        padding:
            28px 17px 25px;

    }

    .form-header h2{

        font-size:25px;

    }

    input,
    select{

        height:46px;

    }

}

</style>

</head>

    </script>


<script>

/* =================================
   ELEMENTS
================================= */

const loginTab =
document.getElementById("loginTab");

const registerTab =
document.getElementById("registerTab");

const loginForm =
document.getElementById("loginForm");

const registerForm =
document.getElementById("registerForm");


/* =================================
   SWITCH FORMS
================================= */

loginTab.addEventListener(
"click",
function(){

    loginTab.classList.add("active");

    registerTab.classList.remove("active");

    loginForm.classList.add("active");

    registerForm.classList.remove("active");

});


registerTab.addEventListener(
"click",
function(){

    registerTab.classList.add("active");

    loginTab.classList.remove("active");

    registerForm.classList.add("active");

    loginForm.classList.remove("active");

});


/* =================================
   PASSWORD SHOW / HIDE
================================= */

document
.querySelectorAll(".password-toggle")
.forEach(function(button){

    button.addEventListener(
    "click",
    function(){

        const input =
        document.getElementById(
            button.dataset.target
        );

        if(input.type === "password"){

            input.type = "text";

            button.textContent = "🙈";

        }else{

            input.type = "password";

            button.textContent = "👁";

        }

    });

});


/* =================================
   EGYPT PHONE
================================= */

function validEgyptPhone(phone){

    return /^01[0125][0-9]{8}$/.test(
        phone
    );

}


/* =================================
   MESSAGE
================================= */

function showMessage(
    element,
    text,
    type
){

    element.textContent = text;

    element.className =
        "message show " + type;

}


/* =================================
   LOGIN
================================= */

loginForm.addEventListener(
"submit",
async function(event){

    event.preventDefault();


    const email =
    document.getElementById(
        "loginEmail"
    ).value.trim();


    const password =
    document.getElementById(
        "loginPassword"
    ).value;


    const message =
    document.getElementById(
        "loginMessage"
    );


    const button =
    loginForm.querySelector(
        ".submit"
    );


    if(!email || !password){

        showMessage(
            message,
            "اكتب البريد الإلكتروني وكلمة المرور.",
            "error"
        );

        return;

    }


    button.classList.add("loading");

    button.disabled = true;


    try{


        /* =========================
           LOGIN
        ========================= */

        const {
            data,
            error
        } =
        await supabase.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "لم يتم العثور على الحساب."
            );

        }


        /* =========================
           GET ROLE
        ========================= */

        const {
            data:profile,
            error:profileError
        } =
        await supabase
        .from("profiles")
        .select("role")
        .eq("id",data.user.id)
        .maybeSingle();


        if(profileError){

            throw profileError;

        }


        showMessage(
            message,
            "تم تسجيل الدخول بنجاح...",
            "success"
        );


        /* =========================
           REDIRECT
        ========================= */

        setTimeout(
        function(){

            if(
                profile &&
                profile.role === "admin"
            ){

                window.location.href =
                    "admin/index.html";

            }else{

                window.location.href =
                    "home.html";

            }

        },
        500
        );


    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        let text =
            error.message ||
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";


        if(
            text
            .toLowerCase()
            .includes("invalid login credentials")
        ){

            text =
                "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        }


        showMessage(
            message,
            text,
            "error"
        );


        button.classList.remove(
            "loading"
        );

        button.disabled = false;

    }

});


/* =================================
   REGISTER
================================= */

registerForm.addEventListener(
"submit",
async function(event){

    event.preventDefault();


    const name =
    document.getElementById(
        "registerName"
    ).value.trim();


    const email =
    document.getElementById(
        "registerEmail"
    ).value.trim();


    const phone =
    document.getElementById(
        "registerPhone"
    ).value.trim();


    const parentPhone =
    document.getElementById(
        "parentPhone"
    ).value.trim();


    const grade =
    document.getElementById(
        "registerGrade"
    ).value;


    const password =
    document.getElementById(
        "registerPassword"
    ).value;


    const confirmPassword =
    document.getElementById(
        "confirmPassword"
    ).value;


    const message =
    document.getElementById(
        "registerMessage"
    );


    const button =
    registerForm.querySelector(
        ".submit"
    );


    /* =========================
       VALIDATION
    ========================= */

    if(name.length < 3){

        showMessage(
            message,
            "اكتب الاسم بالكامل بشكل صحيح.",
            "error"
        );

        return;

    }


    if(!validEgyptPhone(phone)){

        showMessage(
            message,
            "رقم الموبايل المصري غير صحيح.",
            "error"
        );

        return;

    }


    if(!validEgyptPhone(parentPhone)){

        showMessage(
            message,
            "رقم ولي الأمر غير صحيح.",
            "error"
        );

        return;

    }


    if(!grade){

        showMessage(
            message,
            "اختار الصف الدراسي.",
            "error"
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            message,
            "كلمة المرور لازم تكون 6 أحرف على الأقل.",
            "error"
        );

        return;

    }


    if(password !== confirmPassword){

        showMessage(
            message,
            "كلمتا المرور غير متطابقتين.",
            "error"
        );

        return;

    }


    button.classList.add(
        "loading"
    );

    button.disabled = true;


    try{


        /* =========================
           CREATE AUTH USER
        ========================= */

        const {
            data,
            error
        } =
        await supabase.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{

                    full_name:name,

                    phone:phone,

                    parent_phone:parentPhone,

                    grade:grade

                }

            }

        });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "لم يتم إنشاء الحساب."
            );

        }


        /* =========================
           SAVE PROFILE
        ========================= */

        const {
            error:profileError
        } =
        await supabase
        .from("profiles")
        .upsert(
        [

            {

                id:data.user.id,

                full_name:name,

                phone:phone,

                parent_phone:parentPhone,

                grade:grade,

                role:"student"

            }

        ],
        {

            onConflict:"id"

        });


        if(profileError){

            console.error(
                "PROFILE ERROR:",
                profileError
            );

            throw profileError;

        }


        /* =========================
           SUCCESS
        ========================= */

        if(data.session){

            showMessage(
                message,
                "تم إنشاء الحساب بنجاح، جاري الدخول...",
                "success"
            );


            setTimeout(
            function(){

                window.location.href =
                    "home.html";

            },
            700
            );


        }else{

            showMessage(
                message,
                "تم إنشاء الحساب. افتح بريدك الإلكتروني لتأكيد الحساب ثم سجل الدخول.",
                "success"
            );


            button.classList.remove(
                "loading"
            );

            button.disabled = false;

        }


    }catch(error){

        console.error(
            "REGISTER ERROR:",
            error
        );


        let text =
            error.message ||
            "حدث خطأ أثناء إنشاء الحساب.";


        if(
            text
            .toLowerCase()
            .includes(
                "user already registered"
            )
        ){

            text =
                "هذا البريد الإلكتروني مسجل بالفعل.";

        }


        showMessage(
            message,
            text,
            "error"
        );


        button.classList.remove(
            "loading"
        );

        button.disabled = false;

    }

});


/* =================================
   YEAR
================================= */

document.getElementById(
    "year"
).textContent =
new Date().getFullYear();


/* =================================
   PHONE NUMBERS ONLY
================================= */

document
.querySelectorAll(
    'input[type="tel"]'
)
.forEach(function(input){

    input.addEventListener(
    "input",
    function(){

        input.value =
            input.value
            .replace(
                /[^0-9]/g,
                ""
            )
            .slice(0,11);

    });

});

</script>
