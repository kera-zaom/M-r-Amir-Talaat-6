<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | تسجيل الدخول</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 80% 10%,
            rgba(125,82,255,.22),
            transparent 35%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(49,91,233,.16),
            transparent 35%
        ),
        #07070d;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.page{

    width:min(950px,100%);

    min-height:600px;

    display:grid;

    grid-template-columns:1fr 1fr;

    overflow:hidden;

    border-radius:28px;

    background:
        rgba(14,14,24,.88);

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 30px 100px rgba(0,0,0,.5);

    backdrop-filter:blur(20px);
}


/* =========================
   VISUAL
========================= */

.visual{

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    padding:35px;

    background:
        linear-gradient(
            135deg,
            rgba(125,82,255,.16),
            rgba(49,91,233,.08)
        );
}

.visual::before{

    content:"";

    position:absolute;

    width:400px;
    height:400px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(125,82,255,.35),
            transparent 68%
        );

    filter:blur(20px);

    animation:glow 5s ease-in-out infinite;
}

@keyframes glow{

    0%,100%{
        transform:scale(1);
        opacity:.7;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }

}

.ring{

    position:absolute;

    width:400px;
    height:400px;

    border-radius:50%;

    border:
        1px solid
        rgba(145,112,255,.25);

    animation:
        rotate 18s linear infinite;
}

.ring::before{

    content:"";

    position:absolute;

    width:9px;
    height:9px;

    top:8%;
    right:12%;

    border-radius:50%;

    background:#a78aff;

    box-shadow:
        0 0 25px #a78aff;
}

@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

.visual-content{

    position:relative;
    z-index:3;

    text-align:center;
}

.big-logo{

    width:105px;
    height:105px;

    margin:0 auto 25px;

    display:grid;
    place-items:center;

    border-radius:30px;

    font-size:58px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #895aff,
            #3159e8
        );

    box-shadow:
        0 25px 70px
        rgba(92,65,230,.4);

    animation:
        floating 4s ease-in-out infinite;
}

@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

}

.visual-content h1{

    font-size:36px;

    margin-bottom:10px;
}

.visual-content h1 span{

    color:#a58aff;
}

.visual-content p{

    color:#858592;

    font-size:12px;

    line-height:2;
}


/* =========================
   FORM
========================= */

.form-area{

    position:relative;

    padding:45px;

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.back{

    position:absolute;

    top:25px;
    right:30px;

    color:#777783;

    font-size:11px;

    text-decoration:none;

    transition:.25s;
}

.back:hover{
    color:#fff;
}

.form-header{

    margin-bottom:23px;
}

.form-header small{

    color:#9170ff;

    font-size:10px;
}

.form-header h2{

    margin-top:7px;

    font-size:30px;
}

.form-header p{

    margin-top:7px;

    color:#777783;

    font-size:10px;

    line-height:1.8;
}


/* =========================
   TABS
========================= */

.tabs{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:4px;

    padding:4px;

    margin-bottom:22px;

    border-radius:13px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.06);
}

.tab{

    border:0;

    padding:11px;

    border-radius:10px;

    background:transparent;

    color:#777783;

    font-family:inherit;

    cursor:pointer;

    transition:.3s;
}

.tab.active{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(124,82,245,.8),
            rgba(49,87,220,.8)
        );
}


/* =========================
   FORMS
========================= */

.form{
    display:none;
}

.form.active{
    display:block;
}

.field{
    margin-bottom:13px;
}

.field label{

    display:block;

    color:#aaaab5;

    font-size:10px;

    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

.input-wrap > span{

    position:absolute;

    right:14px;
    top:50%;

    transform:translateY(-50%);

    color:#666673;

    pointer-events:none;

    z-index:2;
}

input,
select{

    width:100%;

    height:47px;

    padding:
        0 42px 0 45px;

    border-radius:12px;

    outline:none;

    color:#fff;

    font-family:inherit;

    font-size:11px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.075);
}

input:focus,
select:focus{

    border-color:
        rgba(135,99,255,.6);

    box-shadow:
        0 0 0 3px
        rgba(120,80,245,.08);
}

select option{

    background:#171722;

    color:#fff;
}

.password-toggle{

    position:absolute;

    left:13px;
    top:50%;

    transform:translateY(-50%);

    border:0;

    background:transparent;

    color:#777783;

    cursor:pointer;

    z-index:3;
}


/* =========================
   BUTTON
========================= */

.submit{

    width:100%;

    height:49px;

    border:0;

    border-radius:13px;

    color:#fff;

    font-family:inherit;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #8558f6,
            #315be9
        );

    box-shadow:
        0 15px 35px
        rgba(76,60,205,.25);

    transition:.3s;
}

.submit:hover{

    transform:translateY(-2px);
}

.submit:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}


/* =========================
   MESSAGE
========================= */

.message{

    display:none;

    margin-top:12px;

    padding:10px;

    border-radius:10px;

    text-align:center;

    font-size:9px;

    line-height:1.7;
}

.message.show{
    display:block;
}

.message.error{

    color:#ff9eaa;

    background:
        rgba(255,70,90,.08);

    border:
        1px solid
        rgba(255,70,90,.13);
}

.message.success{

    color:#9ff0bd;

    background:
        rgba(50,210,110,.08);

    border:
        1px solid
        rgba(50,210,110,.13);
}

.form-footer{

    margin-top:20px;

    text-align:center;

    color:#555561;

    font-size:8px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    body{
        padding:12px;
    }

    .page{

        grid-template-columns:1fr;

        min-height:auto;

        border-radius:22px;
    }

    .visual{

        min-height:240px;
    }

    .ring{

        width:250px;
        height:250px;
    }

    .big-logo{

        width:75px;
        height:75px;

        border-radius:22px;

        font-size:40px;

        margin-bottom:15px;
    }

    .visual-content h1{
        font-size:26px;
    }

    .visual-content p{
        font-size:9px;
    }

    .form-area{
        padding:30px 22px 35px;
    }
}

</style>

</head>


<body>

<div class="page">


<section class="visual">

<div class="ring"></div>

<div class="visual-content">

<div class="big-logo">
    ∑
</div>

<h1>
    الخوارزمي
    <span>معاك</span>
</h1>

<p>
    منصة المستر أمير للرياضيات
    <br>
    افهم، اتدرب، وطور مستواك
</p>

</div>

</section>


<section class="form-area">

<a
    href="./index.html"
    class="back"
>
    ← الرئيسية
</a>


<div class="form-header">

<small>
    أهلاً بيك 👋
</small>

<h2>
    ابدأ رحلتك
</h2>

<p>
    سجل دخولك أو أنشئ حسابك للوصول إلى المنصة.
</p>

</div>


<div class="tabs">

<button
    class="tab active"
    id="loginTab"
    type="button"
>
    تسجيل الدخول
</button>

<button
    class="tab"
    id="registerTab"
    type="button"
>
    إنشاء حساب
</button>

</div>


<!-- LOGIN -->

<form
    class="form active"
    id="loginForm"
>

<div class="field">

<label>
    البريد الإلكتروني
</label>

<div class="input-wrap">

<span>✉️</span>

<input
    type="email"
    id="loginEmail"
    placeholder="example@gmail.com"
    autocomplete="email"
    required
>

</div>

</div>


<div class="field">

<label>
    كلمة المرور
</label>

<span>🔒</span>

<input
    type="password"
    id="loginPassword"
    placeholder="كلمة المرور"

    required
>

<button
    type="button"
    class="password-toggle"
    data-target="loginPassword"
>
    👁
</button>

</div>

</div>


<button
    class="submit"
    id="loginButton"
    type="submit"
>
    دخول إلى المنصة
</button>

<!-- REGISTER -->

<form
    class="form"
    id="registerForm"
>

<div class="field">

<label>
    الاسم بالكامل
</label>

<div class="input-wrap">

<span>👤</span>

<input
    type="text"
    id="registerName"
    placeholder="أحمد محمد علي"
    required
>

</div>

</div>


<div class="field">

<label>
    البريد الإلكتروني
</label>

<div class="input-wrap">

<span>✉️</span>

<input
    type="email"
    id="registerEmail"
    placeholder="example@gmail.com"
    required
>

</div>

</div>


<div class="field">

<label>
    رقم الموبايل
</label>

    type="tel"

</div>

<span>📞</span>

<input
    type="tel"
    id="parentPhone"
    placeholder="01xxxxxxxxx"
    maxlength="11"
    inputmode="numeric"
    required
>

</div>

</div>


<div class="field">

<label>
    الصف الدراسي
</label>

<div class="input-wrap">

<span>🎓</span>

<select
    id="registerGrade"
    required
>

<option value="">
    اختر الصف الدراسي
</option>

<option value="أولى إعدادي">
    أولى إعدادي
</option>

<option value="ثانية إعدادي">
    ثانية إعدادي
</option>

<option value="ثالثة إعدادي">
    ثالثة إعدادي
</option>

<option value="أولى ثانوي">
    أولى ثانوي
</option>

<option value="ثانية ثانوي">
    ثانية ثانوي
</option>

<option value="ثالثة ثانوي">
    ثالثة ثانوي
</option>

</select>

</div>

</div>


<div class="field">

<label>
    كلمة المرور
</label>

<div class="input-wrap">

<span>🔒</span>

<input
    type="password"
    id="registerPassword"
    placeholder="6 أحرف على الأقل"
    required
>

<button
    type="button"
    class="password-toggle"
    data-target="registerPassword"
>
    👁
</button>

</div>

</div>


<div class="field">

<label>
    تأكيد كلمة المرور
</label>

<div class="input-wrap">

<span>🔐</span>

<input
    type="password"
    id="confirmPassword"
    placeholder="كرر كلمة المرور"
    required
>

<button
    type="button"
    class="password-toggle"
    data-target="confirmPassword"
>
    👁
</button>

</div>

    class="submit"

    إنشاء الحساب

</form>

</div>

</section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase.js"></script>


<script>

"use strict";


const loginTab =
    document.getElementById("loginTab");

const registerTab =
    document.getElementById("registerTab");

const loginForm =
    document.getElementById("loginForm");

const registerForm =
    document.getElementById("registerForm");

const loginMessage =
    document.getElementById("loginMessage");

const registerMessage =
    document.getElementById("registerMessage");

const loginButton =
    document.getElementById("loginButton");

const registerButton =
    document.getElementById("registerButton");


/* =========================
   YEAR
========================= */

document.getElementById("year")
    .textContent =
    new Date().getFullYear();


/* =========================
   TABS
========================= */

loginTab.addEventListener(
    "click",
    function(){

        loginTab.classList.add("active");

        registerTab.classList.remove("active");

        loginForm.classList.add("active");

        registerForm.classList.remove("active");

    }
);


registerTab.addEventListener(
    "click",
    function(){

        registerTab.classList.add("active");

        loginTab.classList.remove("active");

        registerForm.classList.add("active");

        loginForm.classList.remove("active");

    }
);


/* =========================
   PASSWORD
========================= */

document
.querySelectorAll(".password-toggle")
.forEach(function(button){

    button.addEventListener(
        "click",
        function(){

            const input =
                document.getElementById(
                    button.dataset.target
                );

            if(
                input.type === "password"
            ){

                input.type = "text";

                button.textContent = "🙈";

            }else{

                input.type = "password";

                button.textContent = "👁";

            }

        }
    );

});


/* =========================
   MESSAGE
========================= */

function showMessage(
    element,
    text,
    type
){

    element.textContent =
        text;

    element.className =
        "message show " + type;

}


/* =========================
   SUPABASE
========================= */

function getSupabase(){

    if(
        !window.supabaseClient
    ){

        throw new Error(
            "Supabase غير متصل. تأكد من supabase.js."
        );

    }

    return window.supabaseClient;

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        loginButton.disabled = true;

        loginMessage.className =
            "message";


        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();


        const password =
            document
            .getElementById("loginPassword")
            .value;


        try{

            const supabase =
                getSupabase();


            const {
                data,
                error
            } =
                await supabase
                .auth
                .signInWithPassword({

                    email,
                    password

                });


            if(error){

                throw error;

            }


            if(!data?.user){

                throw new Error(
                    "لم يتم العثور على الحساب."
                );

            }


            showMessage(
                loginMessage,
                "تم تسجيل الدخول بنجاح ✅ جاري فتح المنصة...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "./home.html"
                    );

                },
                500
            );


        }catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            let message =
                error?.message ||
                "حدث خطأ أثناء تسجيل الدخول.";


            if(
                message
                .toLowerCase()
                .includes(
                    "invalid login credentials"
                )
            ){

                message =
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }


            if(
                message
                .toLowerCase()
                .includes(
                    "email not confirmed"
                )
            ){

                message =
                    "يجب تأكيد البريد الإلكتروني أولًا.";

            }


            showMessage(
                loginMessage,
                message,
                "error"
            );


            loginButton.disabled =
                false;

        }

    }
);


/* =========================
   REGISTER
========================= */

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        registerButton.disabled =
            true;

        registerMessage.className =
            "message";


        const name =
            document
            .getElementById("registerName")
            .value
            .trim();


        const email =
            document
            .getElementById("registerEmail")
            .value
            .trim()
            .toLowerCase();


        const phone =
            document
            .getElementById("registerPhone")
            .value
            .trim();


        const parentPhone =
            document
            .getElementById("parentPhone")
            .value
            .trim();


        const grade =
            document
            .getElementById("registerGrade")
            .value;


        const password =
            document
            .getElementById("registerPassword")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        if(name.length < 3){

            showMessage(
                registerMessage,
                "اكتب الاسم بالكامل.",
                "error"
            );

            registerButton.disabled =
                false;

            return;

        }


        if(!email.includes("@")){

            showMessage(
                registerMessage,
                "اكتب بريدًا إلكترونيًا صحيحًا.",
                "error"
            );

            registerButton.disabled =
                false;

            return;

        }


        if(!/^01[0125][0-9]{8}$/.test(phone)){

            showMessage(
                registerMessage,
                "رقم الموبايل غير صحيح.",
                "error"
            );

            registerButton.disabled =
                false;

            return;

        }


        if(!/^01[0125][0-9]{8}$/.test(parentPhone)){

            showMessage(
                registerMessage,
                "رقم ولي الأمر غير صحيح.",
                "error"
            );

            registerButton.disabled =
                false;

            return;

        }


        if(!grade){

            showMessage(
                registerMessage,
                "اختر الصف الدراسي.",
                "error"
            );

            registerButton.disabled =
                false;

            return;

        }


        if(password.length < 6){

            showMessage(
                registerMessage,
                "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
                "error"
            );

            registerButton.disabled =
                false;

            return;

        }


        if(password !== confirmPassword){

            showMessage(
                registerMessage,
                "كلمتا المرور غير متطابقتين.",
                "error"
            );

            registerButton.disabled =
                false;

            return;

        }


        try{

            const supabase =
                getSupabase();


            /* =========================
               SIGN UP
            ========================= */

            const {
                data,
                error
            } =
                await supabase
                .auth
                .signUp({

                    email,

                    password,

                    options:{

                        data:{

                            full_name:
                                name,

                            phone:
                                phone,

                            parent_phone:
                                parentPhone,

                            grade:
                                grade

                        }

                    }

                });


            if(error){

                throw error;

            }


            const user =
                data?.user;


            if(!user){

                throw new Error(
                    "فشل إنشاء الحساب."
                );

            }


            /* =========================
               PROFILE
            ========================= */

            const profile =
                await supabase
                .from("profiles")
                .upsert({

                    id:
                        user.id,

                    full_name:
                        name,

                    email:
                        email,

                    phone:
                        phone,

                    parent_phone:
                        parentPhone,

                    grade:
                        grade,

                    role:
                        "student"

                },{
                    onConflict:"id"

                });


            if(profile.error){

                console.error(
                    profile.error
                );

                throw new Error(
                    "تم إنشاء الحساب لكن لم يتم حفظ بيانات الطالب في profiles. راجع RLS."
                );

            }


            /* =========================
               REDIRECT
            ========================= */

            if(data.session){

                showMessage(
                    registerMessage,
                    "تم إنشاء الحساب بنجاح ✅ جاري فتح المنصة...",
                    "success"
                );


                setTimeout(
                    function(){

                        window.location.replace(
                            "./home.html"
                        );

                    },
                    700
                );

            }else{

                showMessage(
                    registerMessage,
                    "تم إنشاء الحساب. إذا كان تأكيد البريد مفعلًا، أكد بريدك أولًا ثم سجل الدخول.",
                    "success"
                );

                registerButton.disabled =
                    false;

            }


        }catch(error){

            console.error(
                "REGISTER ERROR:",
                error
            );


            let message =
                error?.message ||
                "حدث خطأ أثناء إنشاء الحساب.";


            const lower =
                message.toLowerCase();


            if(
                lower.includes(
                    "user already registered"
                )
            ){

                message =
                    "البريد الإلكتروني مسجل بالفعل.";

            }


            if(
                lower.includes(
                    "email rate limit"
                )
            ){

                message =
                    "تم تجاوز حد إرسال البريد مؤقتًا. حاول لاحقًا.";

            }


            if(
                lower.includes(
                    "row-level security"
                )
            ){

                message =
                    "RLS يمنع حفظ بيانات الطالب في profiles.";

            }


            showMessage(
                registerMessage,
                message,
                "error"
            );


            registerButton.disabled =
                false;

        }

    }
);


/* =========================
   PHONE INPUT
========================= */

document
.querySelectorAll(
    'input[type="tel"]'
)
.forEach(function(input){

    input.addEventListener(
        "input",
        function(){

            input.value =
                input.value
                .replace(
                    /[^0-9]/g,
                    ""
                )
                .slice(
                    0,
                    11
                );

        }
    );

});


/* =========================
   SUPABASE CHECK
========================= */

window.addEventListener(
    "load",
    function(){

        if(
            !window.supabaseClient
        ){

            showMessage(
                loginMessage,
                "Supabase غير متصل. تأكد أن supabase.js موجود بجوار auth.html.",
                "error"
            );

        }

    }
);

</script>
