<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>نتيجة الاختبار | الخوارزمي</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Cairo", Arial, sans-serif;
}

:root {
    --bg: #06060a;
    --card: rgba(18,18,27,.88);
    --border: rgba(255,255,255,.08);
    --text: #fff;
    --muted: #9999a8;

    --primary: #7657ff;
    --primary-dark: #4d35d9;

    --success: #35d39a;
    --danger: #ff6078;
    --warning: #ffbd55;
}

body {

    min-height: 100vh;

    color: var(--text);

    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(118,87,255,.17),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(70,45,190,.12),
            transparent 30%
        ),
        var(--bg);

    padding-bottom: 60px;
}


/* ================= HEADER ================= */

header {

    height: 74px;

    position: sticky;

    top: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 5%;

    background:
        rgba(6,6,10,.88);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid var(--border);
}


.logo-area {

    display: flex;

    align-items: center;

    gap: 12px;
}


.logo {

    width: 43px;

    height: 43px;

    display: grid;

    place-items: center;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            #a796ff
        );

    font-size: 20px;

    font-weight: 900;

    box-shadow:
        0 0 30px
        rgba(118,87,255,.25);
}


.logo-text strong {

    display: block;

    font-size: 17px;
}


.logo-text span {

    display: block;

    color: var(--muted);

    font-size: 10px;
}


.back-btn {

    height: 40px;

    padding: 0 15px;

    border-radius: 10px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.04);

    color: white;

    cursor: pointer;

    transition: .25s;
}


.back-btn:hover {

    background:
        rgba(118,87,255,.12);

}


/* ================= MAIN ================= */

main {

    width:
        min(850px, 94%);

    margin: auto;

    padding-top: 35px;
}


/* ================= LOADING ================= */

.loading {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #06060a;
}


.loader {

    width: 45px;

    height: 45px;

    border-radius: 50%;

    border:
        3px solid
        rgba(118,87,255,.15);

    border-top-color:
        var(--primary);

    animation:
        spin .8s linear infinite;
}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* ================= ERROR ================= */

.error-box {

    display: none;

    text-align: center;

    padding: 45px 20px;

    border-radius: 20px;

    border:
        1px solid
        rgba(255,96,120,.15);

    background:
        rgba(255,96,120,.04);

    margin-bottom: 20px;
}


.error-icon {

    width: 65px;

    height: 65px;

    display: grid;

    place-items: center;

    margin:
        0 auto 15px;

    border-radius: 50%;

    background:
        rgba(255,96,120,.10);

    color:
        var(--danger);

    font-size: 28px;
}


.error-box h2 {

    font-size: 18px;

    margin-bottom: 6px;
}


.error-box p {

    color: var(--muted);

    font-size: 11px;

    line-height: 1.8;
}


/* ================= RESULT HERO ================= */

.result-hero {

    text-align: center;

    padding: 35px 20px 28px;

    border-radius: 22px;

    border:
        1px solid var(--border);

    background:
        var(--card);

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.25);

    margin-bottom: 18px;
}


.success-icon {

    width: 72px;

    height: 72px;

    display: grid;

    place-items: center;

    margin:
        0 auto 15px;

    border-radius: 50%;

    background:
        rgba(53,211,154,.10);

    border:
        1px solid
        rgba(53,211,154,.22);

    color:
        var(--success);

    font-size: 31px;
}


.result-hero.failed
.success-icon {

    background:
        rgba(255,96,120,.10);

    border-color:
        rgba(255,96,120,.22);

    color:
        var(--danger);
}


.result-title {

    font-size:
        clamp(22px, 5vw, 32px);

    font-weight: 900;

    margin-bottom: 5px;
}


.result-subtitle {

    color: var(--muted);

    font-size: 12px;

    line-height: 1.8;
}


/* ================= SCORE ================= */

.score-circle {

    width: 175px;

    height: 175px;

    margin: 28px auto;

    position: relative;

    display: grid;

    place-items: center;

    border-radius: 50%;

    background:
        conic-gradient(
            var(--primary) 0deg,
            rgba(255,255,255,.07) 0deg
        );
}


.score-circle::before {

    content: "";

    position: absolute;

    width: 143px;

    height: 143px;

    border-radius: 50%;

    background:
        #101017;

    border:
        1px solid var(--border);
}


.score-content {

    position: relative;

    z-index: 2;

    text-align: center;
}


.score-number {

    font-size: 38px;

    font-weight: 900;

    line-height: 1;
}


.score-label {

    color: var(--muted);

    font-size: 10px;

    margin-top: 7px;
}


/* ================= STATS ================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-top: 15px;
}


.stat {

    padding: 17px 10px;

    border-radius: 14px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.025);

    text-align: center;
}


.stat-value {

    font-size: 22px;

    font-weight: 900;
}


.stat-label {

    color: var(--muted);

    font-size: 9px;

    margin-top: 3px;
}


.stat.correct .stat-value {

    color:
        var(--success);
}


.stat.wrong .stat-value {

    color:
        var(--danger);
}


.stat.skipped .stat-value {

    color:
        var(--warning);
}


/* ================= INFO ================= */

.info-card {

    padding: 20px;

    border-radius: 18px;

    border:
        1px solid var(--border);

    background:
        var(--card);

    margin-bottom: 18px;
}


.info-title {

    font-size: 15px;

    font-weight: 900;

    margin-bottom: 14px;
}


.info-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}


.info-item {

    padding: 12px;

    border-radius: 11px;

    background:
        rgba(255,255,255,.025);
}


.info-item span {

    display: block;

    color: var(--muted);

    font-size: 9px;

    margin-bottom: 4px;
}


.info-item strong {

    font-size: 11px;

    word-break: break-word;
}


/* ================= ACTIONS ================= */

.actions {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-bottom: 18px;
}


.action-btn {

    min-height: 48px;

    border-radius: 12px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.04);

    color: white;

    cursor: pointer;

    font-weight: 800;

    transition: .25s;
}


.action-btn:hover {

    background:
        rgba(118,87,255,.10);

}


.action-primary {

    border: 0;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );
}


/* ================= ANSWERS ================= */

.answers-card {

    padding: 20px;

    border-radius: 18px;

    border:
        1px solid var(--border);

    background:
        var(--card);
}


.answer-item {

    padding: 15px;

    border-radius: 13px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.02);

    margin-top: 10px;
}


.answer-head {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 8px;
}


.answer-number {

    font-size: 11px;

    font-weight: 900;
}


.answer-status {

    padding:
        4px 8px;

    border-radius: 7px;

    font-size: 8px;

    font-weight: 800;
}


.answer-status.correct {

    color:
        #67e4b4;

    background:
        rgba(53,211,154,.09);
}


.answer-status.wrong {

    color:
        #ff8798;

    background:
        rgba(255,96,120,.09);
}


.answer-status.skipped {

    color:
        #ffd27e;

    background:
        rgba(255,189,85,.09);
}


.answer-question {

    font-size: 12px;

    line-height: 1.8;

    margin-bottom: 8px;
}


.answer-value {

    color: var(--muted);

    font-size: 10px;

    line-height: 1.8;
}


.answer-correct {

    color:
        var(--success);

    font-size: 10px;

    margin-top: 5px;
}


/* ================= EMPTY ================= */

.empty-answers {

    text-align: center;

    color: var(--muted);

    font-size: 11px;

    padding: 25px;
}


/* ================= RESPONSIVE ================= */

@media (max-width: 600px) {

    header {

        padding: 0 4%;

    }


    .logo-text span {

        display: none;

    }


    main {

        width: 94%;

        padding-top: 20px;

    }


    .stats {

        grid-template-columns:
            repeat(3, 1fr);

    }


    .stat-value {

        font-size: 18px;

    }


    .info-grid {

        grid-template-columns: 1fr;

    }


    .actions {

        grid-template-columns: 1fr;

    }


    .score-circle {

        width: 155px;

        height: 155px;

    }


    .score-circle::before {

        width: 127px;

        height: 127px;

    }

}

</style>

</head>


<body>


<!-- ================= LOADING ================= -->

<div
    class="loading"
    id="loading"
>

    <div class="loader"></div>

</div>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo-area">

        <div class="logo">
            خ
        </div>

        <div class="logo-text">

            <strong>
                الخوارزمي
            </strong>

            <span>

<main>

    </div>

    <section

    >

        <div

            class="result-title"

        <div

            <div class="score-content">

                </div>

<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

/*
============================================================
    RESULT PAGE
    الطالب فقط
============================================================

    الرابط:

    result.html?exam_id=EXAM_ID

    مثال:

    result.html?exam_id=123

    الصفحة لا تعتمد على Demo Data.

    البيانات تأتي من Supabase.

============================================================
*/


/* =========================================================
   PARAMETERS
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const examId =
    params.get("exam_id");


const resultId =
    params.get("result_id");


/* =========================================================
   ELEMENTS
========================================================= */

const loading =
    document.getElementById(
        "loading"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const errorTitle =
    document.getElementById(
        "errorTitle"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const resultHero =
    document.getElementById(
        "resultHero"
    );


const infoCard =
    document.getElementById(
        "infoCard"
    );


const actions =
    document.getElementById(
        "actions"
    );


const answersCard =
    document.getElementById(
        "answersCard"
    );


const resultIcon =
    document.getElementById(
        "resultIcon"
    );


const resultTitle =
    document.getElementById(
        "resultTitle"
    );


const resultSubtitle =
    document.getElementById(
        "resultSubtitle"
    );


const scoreCircle =
    document.getElementById(
        "scoreCircle"
    );


const scoreNumber =
    document.getElementById(
        "scoreNumber"
    );


const correctCount =
    document.getElementById(
        "correctCount"
    );


const wrongCount =
    document.getElementById(
        "wrongCount"
    );


const skippedCount =
    document.getElementById(
        "skippedCount"
    );


const examName =
    document.getElementById(
        "examName"
    );


const studentName =
    document.getElementById(
        "studentName"
    );


const scoreDetails =
    document.getElementById(
        "scoreDetails"
    );


const submitDate =
    document.getElementById(
        "submitDate"
    );


const answersContainer =
    document.getElementById(
        "answersContainer"
    );


/* =========================================================
   GET SUPABASE CLIENT
========================================================= */

function getSupabaseClient() {

    /*
        supabase.js عندك يجب أن يضع
        العميل في window.supabaseClient

        مثال supabase.js:

        const { createClient } =
            window.supabase;

        window.supabaseClient =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );
    */

    if (
        window.supabaseClient
    ) {

        return window.supabaseClient;

    }


    /*
        دعم إضافي لو ملف supabase.js
        عندك يستخدم اسم supabaseClient
        بطريقة مختلفة.
    */

    if (
        window.client
    ) {

        return window.client;

    }


    return null;

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    title,
    message
) {

    errorTitle.textContent =
        title ||
        "حدث خطأ";


    errorMessage.textContent =
        message ||
        "تعذر تحميل البيانات.";


    errorBox.style.display =
        "block";


    resultHero.style.display =
        "none";


    infoCard.style.display =
        "none";


    actions.style.display =
        "none";


    answersCard.style.display =
        "none";

}


/* =========================================================
   LOAD RESULT
========================================================= */

async function loadResult() {

    loading.style.display =
        "flex";


    try {


        /* ================= CHECK ID ================= */

        if (
            !examId &&
            !resultId
        ) {

            showError(
                "لا يوجد اختبار",
                "رابط النتيجة غير صحيح."
            );

            return;

        }


        /* ================= SUPABASE ================= */

        const supabase =
            getSupabaseClient();


        if (!supabase) {

            throw new Error(
                "Supabase client not found"
            );

        }


        /* ================= USER ================= */

        const {
            data: authData,
            error: authError
        } =
            await supabase.auth.getUser();


        if (authError) {

            throw authError;

        }


        const user =
            authData?.user;


        if (!user) {

            showError(
                "يجب تسجيل الدخول",
                "قم بتسجيل الدخول أولًا لعرض نتيجة الاختبار."
            );

            return;

        }


        /* =================================================
           GET RESULT
        ================================================= */

        let query =
            supabase
                .from("exam_results")
                .select("*");


        /*
            لو الرابط يحتوي result_id
            نستخدمه مباشرة.

            وإلا نستخدم exam_id + student_id.
        */

        if (resultId) {

            query =
                query
                    .eq(
                        "id",
                        resultId
                    )
                    .eq(
                        "student_id",
                        user.id
                    )
                    .maybeSingle();

        }

        else {

            query =
                query
                    .eq(
                        "exam_id",
                        examId
                    )
                    .eq(
                        "student_id",
                        user.id
                    )
                    .order(
                        "submitted_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(1)
                    .maybeSingle();

        }


        const {
            data,
            error
        } =
            await query;


        if (error) {

            console.error(
                "RESULT ERROR:",
                error
            );

            throw error;

        }


        if (!data) {

            showError(
                "لم يتم العثور على النتيجة",
                "لا توجد نتيجة محفوظة لهذا الاختبار على حسابك."
            );

            return;

        }


        /* =================================================
           GET EXAM NAME
        ================================================= */

        let examTitle =
            data.exam_name ||
            data.title ||
            "الاختبار";


        /*
            نحاول جلب اسم الاختبار من جدول exams
            لو exam_results لا يحتوي exam_name.
        */

        if (
            data.exam_id &&
            !data.exam_name
        ) {

            const {
                data: examData,
                error: examError
            } =
                await supabase
                    .from("exams")
                    .select("title")
                    .eq(
                        "id",
                        data.exam_id
                    )
                    .maybeSingle();


            if (
                !examError &&
                examData
            ) {

                examTitle =
                    examData.title ||
                    examTitle;

            }

        }


        /* =================================================
           GET STUDENT NAME
        ================================================= */

        let studentFullName =
            data.student_name ||
            "الطالب";


        /*
            نحاول جلب الاسم من profiles
            إذا لم يكن محفوظًا في النتيجة.
        */

        if (
            !data.student_name
        ) {

            const {
                data: profileData,
                error: profileError
            } =
                await supabase
                    .from("profiles")
                    .select("full_name")
                    .eq(
                        "id",
                        user.id
                    )
                    .maybeSingle();


            if (
                !profileError &&
                profileData
            ) {

                studentFullName =
                    profileData.full_name ||
                    "الطالب";

            }

        }


        /* =================================================
           NORMALIZE RESULT
        ================================================= */

        const result =
            normalizeResult(
                data
            );


        result.exam_name =
            examTitle;


        result.student_name =
            studentFullName;


        /* =================================================
           RENDER
        ================================================= */

        renderResult(
            result
        );


    }

    catch (error) {

        console.error(
            "LOAD RESULT ERROR:",
            error
        );


        showError(
            "تعذر تحميل النتيجة",
            "حدث خطأ أثناء الاتصال بقاعدة البيانات. حاول مرة أخرى."
        );

    }

    finally {

        loading.style.display =
            "none";

    }

}


/* =========================================================
   NORMALIZE RESULT
========================================================= */

function normalizeResult(data) {


    const score =
        Number(
            data.score ??
            data.correct_answers ??
            0
        );


    const totalScore =
        Number(
            data.total_score ??
            data.total_questions ??
            0
        );


    let percentage =
        Number(
            data.percentage
        );


    /*
        لو percentage غير موجود
        نحسبه تلقائيًا.
    */

    if (
        !Number.isFinite(
            percentage
        )
    ) {

        if (
            totalScore > 0
        ) {

            percentage =
                (
                    score /
                    totalScore
                ) *
                100;

        }

        else {

            percentage = 0;

        }

    }


    let correct =
        Number(
            data.correct_answers ??
            data.correct ??
            0
        );


    let wrong =
        Number(
            data.wrong_answers ??
            data.wrong ??
            0
        );


    let skipped =
        Number(
            data.skipped_answers ??
            data.skipped ??
            0
        );


    /*
        لو الإحصائيات غير موجودة
        نحاول حسابها من إجمالي الأسئلة.
    */

    if (
        correct === 0 &&
        score > 0 &&
        data.correct_answers === undefined &&
        data.correct === undefined
    ) {

        correct =
            score;

    }


    if (
        skipped === 0 &&
        data.skipped_answers === undefined &&
        data.skipped === undefined
    ) {

        const answered =
            correct +
            wrong;


        if (
            totalScore >
            answered
        ) {

            skipped =
                totalScore -
                answered;

        }

    }


    /*
        لو total_score موجود
        نمنع الأرقام السالبة.
    */

    correct =
        Math.max(
            0,
            correct
        );


    wrong =
        Math.max(
            0,
            wrong
        );


    skipped =
        Math.max(
            0,
            skipped
        );


    percentage =
        Math.max(
            0,
            Math.min(
                100,
                percentage
            )
        );


    /* ================= ANSWERS ================= */

    let answers =
        data.answers ||
        data.answer_details ||
        [];


    if (
        typeof answers === "string"
    ) {

        try {

            answers =
                JSON.parse(
                    answers
                );

        }

        catch {

            answers = [];

        }

    }


    if (
        !Array.isArray(
            answers
        )
    ) {

        answers = [];

    }


    return {

        ...data,

        score:
            score,

        total_score:
            totalScore,

        percentage:
            percentage,

        correct_answers:
            correct,

        wrong_answers:
            wrong,

        skipped_answers:
            skipped,

        answers:
            answers

    };

}


/* =========================================================
   RENDER RESULT
========================================================= */

function renderResult(data) {


    /* ================= SHOW ================= */

    resultHero.style.display =
        "block";


    infoCard.style.display =
        "block";


    actions.style.display =
        "grid";


    answersCard.style.display =
        "block";


    /* ================= VALUES ================= */

    const percentage =
        Number(
            data.percentage || 0
        );


    scoreNumber.textContent =
        Math.round(
            percentage
        ) + "%";


    correctCount.textContent =
        data.correct_answers || 0;


    wrongCount.textContent =
        data.wrong_answers || 0;


    skippedCount.textContent =
        data.skipped_answers || 0;


    /* ================= CIRCLE ================= */

    const degrees =
        Math.max(
            0,
            Math.min(
                100,
                percentage
            )
        ) *
        3.6;


    scoreCircle.style.background = `
        conic-gradient(
            var(--primary) ${degrees}deg,
            rgba(255,255,255,.07) ${degrees}deg
        )
    `;


    /* ================= RESULT STATUS ================= */

    if (
        percentage >= 50
    ) {

        resultHero.classList.remove(
            "failed"
        );


        resultIcon.textContent =
            "✓";


        resultTitle.textContent =
            "أحسنت! 🎉";


        resultSubtitle.textContent =
            "لقد اجتزت الاختبار بنجاح.";

    }

    else {

        resultHero.classList.add(
            "failed"
        );


        resultIcon.textContent =
            "×";


        resultTitle.textContent =
            "حاول مرة أخرى 💪";


        resultSubtitle.textContent =
            "راجع إجاباتك والدروس ثم حاول مرة أخرى.";

    }


    /* ================= INFO ================= */

    examName.textContent =
        data.exam_name ||
        "—";


    studentName.textContent =
        data.student_name ||
        "—";


    scoreDetails.textContent =
        `${data.score || 0} / ${data.total_score || 0}`;


    submitDate.textContent =
        formatDate(
            data.submitted_at
        );


    /* ================= ANSWERS ================= */

    renderAnswers(
        data.answers || []
    );

}


/* =========================================================
   RENDER ANSWERS
========================================================= */

function renderAnswers(
    answers
) {

    answersContainer.innerHTML =
        "";


    if (
        !answers ||
        answers.length === 0
    ) {

        answersContainer.innerHTML = `

            <div class="empty-answers">
                لا توجد تفاصيل للإجابات محفوظة لهذه النتيجة.
            </div>

        `;

        return;

    }


    answers.forEach(
        (
            answer,
            index
        ) => {


            const number =
                answer.number ??
                answer.question_number ??
                index + 1;


            const question =
                answer.question ??
                answer.question_text ??
                "السؤال";


            const studentAnswer =
                answer.answer ??
                answer.student_answer ??
                answer.selected_answer ??
                "";


            const correctAnswer =
                answer.correct_answer ??
                answer.right_answer ??
                "";


            let status =
                answer.status;


            /*
                لو status غير موجود
                نحاول تحديده.
            */

            if (
                !status
            ) {

                if (
                    !studentAnswer
                ) {

                    status =
                        "skipped";

                }

                else if (
                    correctAnswer &&
                    String(
                        studentAnswer
                    ).trim() ===
                    String(
                        correctAnswer
                    ).trim()
                ) {

                    status =
                        "correct";

                }

                else {

                    status =
                        "wrong";

                }

            }


            let statusText =
                "بدون إجابة";


            if (
                status ===
                "correct"
            ) {

                statusText =
                    "إجابة صحيحة";

            }

            else if (
                status ===
                "wrong"
            ) {

                statusText =
                    "إجابة خاطئة";

            }


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "answer-item";


            item.innerHTML = `

                <div class="answer-head">

                    <span class="answer-number">

                        السؤال
                        ${escapeHTML(number)}

                    </span>


                    <span
                        class="
                            answer-status
                            ${escapeHTML(status)}
                        "
                    >

                        ${statusText}

                    </span>

                </div>


                <div class="answer-question">

                    ${escapeHTML(
                        question
                    )}

                </div>


                <div class="answer-value">

                    إجابتك:

                    ${
                        studentAnswer
                        ?
                        escapeHTML(
                            studentAnswer
                        )
                        :
                        "بدون إجابة"
                    }

                </div>


                ${
                    status === "wrong" &&
                    correctAnswer
                    ?
                    `

                        <div class="answer-correct">

                            الإجابة الصحيحة:

                            ${escapeHTML(
                                correctAnswer
                            )}

                        </div>

                    `
                    :
                    ""
                }

            `;


            answersContainer.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   DATE
========================================================= */

function formatDate(
    date
) {

    if (!date) {

        return "—";

    }


    const d =
        new Date(
            date
        );


    if (
        Number.isNaN(
            d.getTime()
        )
    ) {

        return "—";

    }


    return d.toLocaleDateString(
        "ar-EG",
        {
            year:
                "numeric",

            month:
                "long",

            day:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    );

}

   NAVIGATION
========================================================= */

/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(
        value
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
