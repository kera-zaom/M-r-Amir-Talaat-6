<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>الخوارزمي | تعديل بياناتي</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(116, 72, 232, .20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(49, 84, 223, .16),
                    transparent 30%
                ),
                #07070b;

            color: #fff;
        }

        .container {
            width: min(720px, 94%);
            margin: auto;
        }

        header {
            height: 75px;

            background: rgba(7, 7, 11, .90);

            backdrop-filter: blur(15px);

            border-bottom:
                1px solid rgba(255, 255, 255, .08);
        }

        .nav {
            height: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .logo {
            font-size: 25px;

            font-weight: 900;

            background:
                linear-gradient(
                    90deg,
                    #fff,
                    #9b7cff
                );

            -webkit-background-clip: text;

            color: transparent;
        }

        .back {
            color: #fff;

            text-decoration: none;

            background: #111119;

            border:
                1px solid rgba(255, 255, 255, .10);

            padding: 10px 16px;

            border-radius: 12px;
        }

        main {
            padding: 35px 0 60px;
        }

        .card {
            background:
                rgba(255, 255, 255, .045);

            border:
                1px solid rgba(255, 255, 255, .08);

            border-radius: 25px;

            padding: 25px;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, .25);
        }

        h1 {
            font-size: 27px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;

            margin-bottom: 25px;
        }

        /* =========================
           PHOTO
        ========================= */

        .photo-box {
            text-align: center;

            margin-bottom: 28px;
        }

        .avatar-wrapper {
            position: relative;

            width: 130px;
            height: 130px;

            margin: auto;
        }

        .avatar {
            width: 130px;
            height: 130px;

            object-fit: cover;

            border-radius: 50%;

            border:
                3px solid #7d52ff;

            background: #15151e;

            display: block;
        }

        .photo-button {
            position: absolute;

            right: 0;
            bottom: 0;

            width: 42px;
            height: 42px;

            border-radius: 50%;

            border: 3px solid #07070b;

            background:
                linear-gradient(
                    135deg,
                    #7448e8,
                    #3154df
                );

            color: #fff;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            font-size: 19px;
        }

        #photoInput {
            display: none;
        }

        .photo-text {
            margin-top: 12px;

            color: #999;

            font-size: 13px;
        }

        /* =========================
           FORM
        ========================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;
        }

        .field {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            color: #aaa;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border:
                1px solid rgba(255, 255, 255, .10);

            background: #0c0c12;

            color: #fff;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #7650ee;

            box-shadow:
                0 0 0 3px
                rgba(118, 80, 238, .10);
        }

        input[readonly] {
            opacity: .55;

            cursor: not-allowed;
        }

        .save {
            width: 100%;

            margin-top: 22px;

            padding: 15px;

            border: 0;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #7448e8,
                    #3154df
                );

            color: #fff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: .2s;
        }

        .save:hover {
            transform: translateY(-2px);
        }

        .save:disabled {
            opacity: .6;

            cursor: not-allowed;

            transform: none;
        }

        /* =========================
           MESSAGES
        ========================= */

        .message {
            display: none;

            padding: 14px;

            border-radius: 12px;

            margin-bottom: 18px;

            line-height: 1.7;
        }

        .success {
            background: #092719;

            border:
                1px solid #1d7348;

            color: #75e9a9;
        }

        .error {
            background: #280f15;

            border:
                1px solid #6d2635;

            color: #ff9aaa;
        }

        .upload-info {
            display: none;

            text-align: center;

            color: #aaa;

            margin-top: 10px;

            font-size: 13px;
        }

        @media(max-width: 600px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .card {
                padding: 18px;
            }

            h1 {
                font-size: 23px;
            }
        }

    </style>
</head>


<body>


<header>

    <div class="container nav">

        <div class="logo">
            الخوارزمي
        </div>

        <a
            href="home.html"
            class="back"
        >
            ← رجوع
        </a>

    </div>

</header>



<main class="container">


    <div class="card">


        <h1>
            تعديل بياناتي
        </h1>


        <p class="subtitle">
            عدّل بياناتك الشخصية وصورتك الشخصية.
        </p>



        <div
            id="success"
            class="message success"
        ></div>


        <div
            id="error"
            class="message error"
        ></div>



        <!-- =========================
             PHOTO
        ========================= -->

        <div class="photo-box">


            <div class="avatar-wrapper">


                <img
                    id="avatar"
                    class="avatar"
                    src="teacher.png"
                    alt="صورة الطالب"
                >


                <label
                    for="photoInput"
                    class="photo-button"
                    title="تغيير الصورة"
                >
                    📷
                </label>


                <input
                    id="photoInput"
                    type="file"
                    accept="image/jpeg,image/png,image/webp"
                >


            </div>


            <div class="photo-text">
                اضغط على 📷 لاختيار صورتك الشخصية
            </div>


            <div
                id="uploadInfo"
                class="upload-info"
            >
                جاري تجهيز الصورة...
            </div>


        </div>



        <!-- =========================
             FORM
        ========================= -->

        <form id="profileForm">


            <div class="form-grid">


                <div class="field full">

                    <label>
                        الاسم بالكامل
                    </label>

                    <input
                        id="name"
                        type="text"
                        placeholder="اكتب اسمك بالكامل"
                        required
                    >

                </div>



                <div class="field">

                    <label>
                        البريد الإلكتروني
                    </label>

                    <input
                        id="email"
                        type="email"
                        readonly
                    >

                </div>



                <div class="field">

                    <label>
                        رقم الهاتف
                    </label>

                    <input
                        id="phone"
                        type="tel"
                        placeholder="01xxxxxxxxx"
                    >

                </div>



                <div class="field">

                    <label>
                        رقم ولي الأمر
                    </label>

                    <input
                        id="parentPhone"
                        type="tel"
                        placeholder="01xxxxxxxxx"
                    >

                </div>



                <div class="field">

                    <label>
                        الصف الدراسي
                    </label>

                    <input
                        id="grade"
                        type="text"
                        placeholder="مثال: ثالثة ثانوي"
                    >

                </div>



                <div class="field">

                    <label>
                        المحافظة
                    </label>

                    <input
                        id="governorate"
                        type="text"
                        placeholder="المحافظة"
                    >

                </div>



                <div class="field">

                    <label>
                        المدينة
                    </label>

                    <input
                        id="city"
                        type="text"
                        placeholder="المدينة"
                    >

                </div>



                <div class="field full">

                    <label>
                        المدرسة
                    </label>

                    <input
                        id="school"
                        type="text"
                        placeholder="اسم المدرسة"
                    >

                </div>


            </div>



            <button
                type="submit"
                class="save"
                id="saveBtn"
            >
                حفظ البيانات
            </button>


        </form>


    </div>


</main>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>

"use strict";


let supabaseClient = null;

let currentUser = null;

let currentTable = null;

let currentRow = null;

let selectedFile = null;



const form =
    document.getElementById("profileForm");


const saveBtn =
    document.getElementById("saveBtn");


const successBox =
    document.getElementById("success");


const errorBox =
    document.getElementById("error");


const photoInput =
    document.getElementById("photoInput");


const avatar =
    document.getElementById("avatar");


const uploadInfo =
    document.getElementById("uploadInfo");



/* =========================
   MESSAGE
========================= */


function showSuccess(message) {

    successBox.textContent = message;

    successBox.style.display = "block";

    errorBox.style.display = "none";
}



function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";

    successBox.style.display = "none";
}



/* =========================
   VALUE
========================= */


function value(id) {

    return document
        .getElementById(id)
        .value
        .trim();

}



function setValue(id, value) {

    document
        .getElementById(id)
        .value = value || "";

}



/* =========================
   GET FIELD
========================= */


function getField(row, names) {

    if (!row) return "";

    for (const name of names) {

        if (
            Object.prototype
                .hasOwnProperty
                .call(row, name)
            &&
            row[name] !== null
            &&
            row[name] !== undefined
        ) {

            return row[name];

        }

    }

    return "";
}



/* =========================
   AVATAR
========================= */


function setAvatar(url) {

    avatar.src =
        url ||
        "teacher.png";


    avatar.onerror = () => {

        avatar.src =
            "teacher.png";

    };

}



/* =========================
   LOAD PROFILE
========================= */


async function loadProfile() {

    try {


        if (!window.supabaseClient) {

            throw new Error(
                "Supabase غير متصل. تأكد من ملف supabase.js."
            );

        }


        supabaseClient =
            window.supabaseClient;



        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();



        if (error) {

            throw error;

        }



        if (!data.session) {

            window.location.href =
                "auth.html";

            return;

        }



        currentUser =
            data.session.user;



        /*
         * students
         */

        let response =
            await supabaseClient
                .from("students")
                .select("*")
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();



        if (
            !response.error
            &&
            response.data
        ) {

            currentTable =
                "students";

            currentRow =
                response.data;

        }

        else {


            /*
             * profiles
             */

            response =
                await supabaseClient
                    .from("profiles")
                    .select("*")
                    .eq(
                        "id",
                        currentUser.id
                    )
                    .maybeSingle();



            if (
                !response.error
                &&
                response.data
            ) {

                currentTable =
                    "profiles";

                currentRow =
                    response.data;

            }

            else {

                currentTable =
                    "students";

                currentRow = {
                    id: currentUser.id
                };

            }

        }



        const row =
            currentRow;



        const name =
            getField(
                row,
                [
                    "full_name",
                    "name",
                    "student_name"
                ]
            )
            ||
            currentUser
                .user_metadata
                ?.full_name
            ||
            currentUser
                .user_metadata
                ?.name
            ||
            "";



        const phone =
            getField(
                row,
                [
                    "phone",
                    "phone_number"
                ]
            )
            ||
            currentUser
                .user_metadata
                ?.phone
            ||
            "";



        const parentPhone =
            getField(
                row,
                [
                    "parent_phone",
                    "parentPhone"
                ]
            );



        const grade =
            getField(
                row,
                [
                    "grade",
                    "class",
                    "grade_name"
                ]
            );



        const governorate =
            getField(
                row,
                [
                    "governorate",
                    "province"
                ]
            );



        const city =
            getField(
                row,
                [
                    "city"
                ]
            );



        const school =
            getField(
                row,
                [
                    "school"
                ]
            );



        const avatarUrl =
            getField(
                row,
                [
                    "avatar_url",
                    "photo_url",
                    "image_url"
                ]
            );



        setValue(
            "name",
            name
        );


        setValue(
            "email",
            currentUser.email ||
            getField(row, ["email"])
        );


        setValue(
            "phone",
            phone
        );


        setValue(
            "parentPhone",
            parentPhone
        );


        setValue(
            "grade",
            grade
        );


        setValue(
            "governorate",
            governorate
        );


        setValue(
            "city",
            city
        );


        setValue(
            "school",
            school
        );


        setAvatar(
            avatarUrl
        );


    }

    catch (error) {

        console.error(
            "PROFILE ERROR:",
            error
        );


        showError(
            error.message ||
            "حدث خطأ أثناء تحميل البيانات."
        );

    }

}



/* =========================
   SELECT PHOTO
========================= */


photoInput.addEventListener(
    "change",
    event => {


        const file =
            event.target.files[0];


        if (!file) {

            return;

        }



        /*
         * الحد الأقصى 5MB
         */

        if (
            file.size >
            5 * 1024 * 1024
        ) {

            showError(
                "حجم الصورة يجب ألا يتجاوز 5 ميجابايت."
            );

            photoInput.value = "";

            return;

        }



        /*
         * أنواع الصور
         */

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];



        if (
            !allowedTypes
                .includes(file.type)
        ) {

            showError(
                "اختار صورة JPG أو PNG أو WEBP فقط."
            );

            photoInput.value = "";

            return;

        }



        selectedFile =
            file;



        /*
         * معاينة الصورة
         */

        const reader =
            new FileReader();



        reader.onload =
            event => {

                avatar.src =
                    event.target.result;

            };



        reader.readAsDataURL(file);



        uploadInfo.textContent =
            "تم اختيار الصورة ✓";


        uploadInfo.style.display =
            "block";


        errorBox.style.display =
            "none";

    }
);



/* =========================
   UPLOAD PHOTO
========================= */


async function uploadPhoto() {


    if (!selectedFile) {

        return null;

    }



    uploadInfo.textContent =
        "جاري رفع الصورة...";


    uploadInfo.style.display =
        "block";



    /*
     * اسم فريد للصورة
     */

    const extension =
        selectedFile.name
            .split(".")
            .pop()
            .toLowerCase();



    const filePath =
        currentUser.id
        +
        "/profile-"
        +
        Date.now()
        +
        "."
        +
        extension;



    /*
     * رفع الصورة
     */

    const {
        error: uploadError
    } =
        await supabaseClient
            .storage
            .from("avatars")
            .upload(
                filePath,
                selectedFile,
                {
                    cacheControl: "3600",
                    upsert: true,
                    contentType:
                        selectedFile.type
                }
            );



    if (uploadError) {

        throw uploadError;

    }



    /*
     * الحصول على الرابط العام
     */

    const {
        data
    } =
        supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(
                filePath
            );



    if (!data.publicUrl) {

        throw new Error(
            "لم يتم الحصول على رابط الصورة."
        );

    }



    uploadInfo.textContent =
        "تم رفع الصورة بنجاح ✓";



    return data.publicUrl;

}



/* =========================
   SAVE PROFILE
========================= */


form.addEventListener(
    "submit",
    async event => {


        event.preventDefault();



        if (
            !supabaseClient
            ||
            !currentUser
        ) {

            showError(
                "لم يتم تحميل الحساب بعد."
            );

            return;

        }



        saveBtn.disabled =
            true;


        saveBtn.textContent =
            "جاري الحفظ...";



        try {


            const newName =
                value("name");


            const newPhone =
                value("phone");


            const newParentPhone =
                value("parentPhone");


            const newGrade =
                value("grade");


            const newGovernorate =
                value("governorate");


            const newCity =
                value("city");


            const newSchool =
                value("school");



            if (!newName) {

                throw new Error(
                    "اكتب الاسم بالكامل."
                );

            }



            /*
             * رفع الصورة أولاً
             */

            let newAvatarUrl =
                null;


            if (selectedFile) {

                newAvatarUrl =
                    await uploadPhoto();

            }



            /*
             * تجهيز البيانات
             */

            const updateData = {};



            /*
             * الاسم
             */

            if (
                currentRow
                &&
                Object.prototype
                    .hasOwnProperty
                    .call(
                        currentRow,
                        "full_name"
                    )
            ) {

                updateData.full_name =
                    newName;

            }

            else if (
                currentRow
                &&
                Object.prototype
                    .hasOwnProperty
                    .call(
                        currentRow,
                        "name"
                    )
            ) {

                updateData.name =
                    newName;

            }

            else {

                updateData.full_name =
                    newName;

            }



            /*
             * الهاتف
             */

            if (
                currentRow
                &&
                Object.prototype
                    .hasOwnProperty
                    .call(
                        currentRow,
                        "phone"
                    )
            ) {

                updateData.phone =
                    newPhone;

            }

            else if (
                currentRow
                &&
                Object.prototype
                    .hasOwnProperty
                    .call(
                        currentRow,
                        "phone_number"
                    )
            ) {

                updateData.phone_number =
                    newPhone;

            }



            /*
             * ولي الأمر
             */

            if (
                currentRow
                &&
                Object.prototype
                    .hasOwnProperty
                    .call(
                        currentRow,
                        "parent_phone"
                    )
            ) {

                updateData.parent_phone =
                    newParentPhone;

            }



            /*
             * الصف
             */

            if (
                currentRow
                &&
                Object.prototype
                    .hasOwnProperty
                    .call(
                        currentRow,
                        "grade"
                    )
            ) {

                updateData.grade =
                    newGrade;

            }

            else if (
                currentRow
                &&
                Object.prototype
                    .hasOwnProperty
                    .call(
                        currentRow,
                        "class"
                    )
            ) {

                updateData.class =
                    newGrade;

            }



            /*
             * المحافظة
             */

            if (
                currentRow
                &&
                Object.prototype
                    .hasOwnProperty
                    .call(
                        currentRow,
                        "governorate"
                    )
            ) {

                updateData.governorate =
                    newGovernorate;

            }

            else if (
                currentRow
                &&
                Object.prototype
                    .hasOwnProperty
                    .call(
                        currentRow,
                        "province"
                    )
            ) {

                updateData.province =
                    newGovernorate;

            }



            /*
             * المدينة
             */

            if (
                currentRow
                &&
                Object.prototype
                    .hasOwnProperty
                    .call(
                        currentRow,
                        "city"
                    )
            ) {

                updateData.city =
                    newCity;

            }



            /*
             * المدرسة
             */

            if (
                currentRow
                &&
                Object.prototype
                    .hasOwnProperty
                    .call(
                        currentRow,
                        "school"
                    )
            ) {

                updateData.school =
                    newSchool;

            }



            /*
             * رابط الصورة
             */

            if (
                newAvatarUrl
            ) {

                if (
                    currentRow
                    &&
                    Object.prototype
                        .hasOwnProperty
                        .call(
                            currentRow,
                            "avatar_url"
                        )
                ) {

                    updateData.avatar_url =
                        newAvatarUrl;

                }

                else if (
                    currentRow
                    &&
                    Object.prototype
                        .hasOwnProperty
                        .call(
                            currentRow,
                            "photo_url"
                        )
                ) {

                    updateData.photo_url =
                        newAvatarUrl;

                }

                else if (
                    currentRow
                    &&
                    Object.prototype
                        .hasOwnProperty
                        .call(
                            currentRow,
                            "image_url"
                        )
                ) {

                    updateData.image_url =
                        newAvatarUrl;

                }

                else {

                    /*
                     * الافتراضي
                     */

                    updateData.avatar_url =
                        newAvatarUrl;

                }

            }



            /*
             * تحديث السجل
             */

            if (
                currentRow
                &&
                currentRow.id
            ) {


                const {
                    error
                } =
                    await supabaseClient
                        .from(currentTable)
                        .update(updateData)
                        .eq(
                            "id",
                            currentUser.id
                        );


                if (error) {

                    throw error;

                }

            }

            else {


                /*
                 * إنشاء سجل
                 */

                updateData.id =
                    currentUser.id;


                if (
                    currentUser.email
                ) {

                    updateData.email =
                        currentUser.email;

                }


                const {
                    error
                } =
                    await supabaseClient
                        .from(currentTable)
                        .insert(
                            updateData
                        );


                if (error) {

                    throw error;

                }

            }



            showSuccess(
                "تم حفظ بياناتك وصورتك الشخصية بنجاح ✅"
            );



            setTimeout(
                () => {

                    window.location.href =
                        "home.html";

                },
                1200
            );


        }

        catch (error) {

            console.error(
                "SAVE ERROR:",
                error
            );


            showError(
                error.message ||
                "حدث خطأ أثناء حفظ البيانات."
            );

        }


        finally {

            saveBtn.disabled =

);
