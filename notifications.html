<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>الإشعارات | الخوارزمي</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Cairo",Arial,sans-serif;
}

:root{
    --bg:#06060a;
    --card:rgba(18,18,27,.88);
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --muted:#9999a8;
    --primary:#7657ff;
    --primary-dark:#4d35d9;
    --success:#35d39a;
    --danger:#ff6078;
    --warning:#ffbd55;
}

body{

    min-height:100vh;

    color:var(--text);

    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(118,87,255,.17),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(70,45,190,.12),
            transparent 30%
        ),
        var(--bg);

    padding-bottom:60px;
}


/* ================= HEADER ================= */

header{

    height:74px;

    position:sticky;

    top:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 5%;

    background:
        rgba(6,6,10,.88);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid var(--border);
}


.logo-area{

    display:flex;

    align-items:center;

    gap:12px;
}


.logo{

    width:43px;

    height:43px;

    display:grid;

    place-items:center;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            #a796ff
        );

    font-size:20px;

    font-weight:900;

    box-shadow:
        0 0 30px
        rgba(118,87,255,.25);
}


.logo-text strong{

    display:block;

    font-size:17px;
}


.logo-text span{

    display:block;

    color:var(--muted);

    font-size:10px;
}


.back-btn{

    height:40px;

    padding:0 15px;

    border-radius:10px;

    border:1px solid var(--border);

    background:
        rgba(255,255,255,.04);

    color:white;

    cursor:pointer;

    transition:.25s;
}


.back-btn:hover{

    background:
        rgba(118,87,255,.12);

}


/* ================= MAIN ================= */

main{

    width:min(850px,94%);

    margin:auto;

    padding-top:30px;
}


/* ================= TOP ================= */

.page-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;
}


.page-title{

    font-size:
        clamp(23px,5vw,31px);

    font-weight:900;
}


.page-description{

    color:var(--muted);

    font-size:10px;

    margin-top:4px;
}


.read-all{

    border:0;

    background:
        rgba(118,87,255,.10);

    border:
        1px solid
        rgba(118,87,255,.20);

    color:#c6bcff;

    padding:9px 12px;

    border-radius:10px;

    cursor:pointer;

    font-size:9px;

    font-weight:800;
}


/* ================= FILTERS ================= */

.filters{

    display:flex;

    gap:8px;

    overflow-x:auto;

    margin-bottom:15px;

    padding-bottom:3px;
}


.filter{

    flex-shrink:0;

    padding:8px 13px;

    border-radius:20px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.03);

    color:var(--muted);

    cursor:pointer;

    font-size:9px;

    font-weight:700;

    transition:.2s;
}


.filter.active{

    color:white;

    border-color:
        rgba(118,87,255,.35);

    background:
        rgba(118,87,255,.15);
}


/* ================= NOTIFICATIONS ================= */

.notifications{

    display:flex;

    flex-direction:column;

    gap:10px;
}


.notification{

    position:relative;

    display:flex;

    align-items:flex-start;

    gap:13px;

    padding:17px;

    border-radius:16px;

    border:
        1px solid var(--border);

    background:
        var(--card);

    cursor:pointer;

    transition:
        transform .2s,
        border-color .2s,
        background .2s;
}


.notification:hover{

    transform:translateY(-2px);

    border-color:
        rgba(118,87,255,.25);

    background:
        rgba(25,24,36,.95);
}


.notification.unread{

    border-color:
        rgba(118,87,255,.20);
}


.notification.unread::before{

    content:"";

    position:absolute;

    right:0;

    top:15px;

    bottom:15px;

    width:3px;

    border-radius:5px 0 0 5px;

    background:
        var(--primary);
}


/* ================= ICON ================= */

.notification-icon{

    width:46px;

    height:46px;

    flex-shrink:0;

    display:grid;

    place-items:center;

    border-radius:13px;

    background:
        rgba(118,87,255,.10);

    border:
        1px solid
        rgba(118,87,255,.15);

    font-size:19px;
}


.notification-icon.exam{

    background:
        rgba(255,189,85,.08);

    border-color:
        rgba(255,189,85,.15);
}


.notification-icon.course{

    background:
        rgba(53,211,154,.08);

    border-color:
        rgba(53,211,154,.15);
}


.notification-icon.result{

    background:
        rgba(118,87,255,.10);
}


/* ================= CONTENT ================= */

.notification-content{

    flex:1;

    min-width:0;
}


.notification-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:4px;
}


.notification-title{

    font-size:12px;

    font-weight:900;
}


.notification-time{

    color:var(--muted);

    font-size:8px;

    white-space:nowrap;
}


.notification-text{

    color:#b5b5c2;

    font-size:10px;

    line-height:1.8;
}


/* ================= EMPTY ================= */

.empty{

    padding:65px 20px;

    border-radius:20px;

    border:
        1px solid var(--border);

    background:
        var(--card);

    text-align:center;

    display:none;
}


.empty-icon{

    width:70px;

    height:70px;

    margin:
        0 auto 14px;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:
        rgba(118,87,255,.08);

    font-size:29px;
}


.empty-title{

    font-size:16px;

    font-weight:900;

    margin-bottom:5px;
}


.empty-text{

    color:var(--muted);

    font-size:10px;

    line-height:1.8;
}


/* ================= LOADING ================= */

.loading{

    position:fixed;

    inset:0;

    z-index:999;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#06060a;
}


.loader{

    width:44px;

    height:44px;

    border-radius:50%;

    border:
        3px solid
        rgba(118,87,255,.15);

    border-top-color:
        var(--primary);

    animation:
        spin .8s linear infinite;
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* ================= RESPONSIVE ================= */

@media(max-width:600px){

    header{

        padding:0 4%;

    }

    .logo-text span{

        display:none;

    }

    .page-top{

        align-items:flex-start;

    }

    .read-all{

        white-space:nowrap;

    }

    .notification{

        padding:14px;

    }

    .notification-icon{

        width:42px;

        height:42px;

        font-size:17px;

    }

    .notification-head{

        align-items:flex-start;

        flex-direction:column;

        gap:2px;

    }

}

</style>

</head>


<body>


<!-- LOADING -->

<div
    class="loading"
    id="loading"
>

    <div class="loader"></div>

</div>


<!-- HEADER -->

<header>

    <div class="logo-area">

        <div class="logo">
            خ
        </div>

        <div class="logo-text">

            <strong>
                الخوارزمي
            </strong>

            <span>
                منصة التعليم
            </span>

        </div>

    </div>


    <button
        class="back-btn"
        onclick="goBack()"
    >
        ← رجوع
    </button>

</header>


<main>


    <!-- TITLE -->

    <section class="page-top">

        <div>

            <h1 class="page-title">
                🔔 الإشعارات
            </h1>

            <p class="page-description">
                تابع آخر أخبار الكورسات والاختبارات الخاصة بك
            </p>

        </div>


        <button
            class="read-all"
            onclick="markAllRead()"
        >
            قراءة الكل
        </button>

    </section>


    <!-- FILTERS -->

    <div class="filters">

        <button
            class="filter active"
            data-filter="all"
            onclick="filterNotifications('all',this)"
        >
            الكل
        </button>

        <button
            class="filter"
            data-filter="course"
            onclick="filterNotifications('course',this)"
        >
            📚 الكورسات
        </button>

        <button
            class="filter"
            data-filter="exam"
            onclick="filterNotifications('exam',this)"
        >
            📝 الاختبارات
        </button>

        <button
            class="filter"
            data-filter="result"
            onclick="filterNotifications('result',this)"
        >
            🏆 النتائج
        </button>

    </div>


    <!-- NOTIFICATIONS -->

    <section
        class="notifications"
        id="notifications"
    ></section>


    <!-- EMPTY -->

    <section
        class="empty"
        id="empty"
    >

        <div class="empty-icon">
            🔕
        </div>

        <div class="empty-title">
            مفيش إشعارات
        </div>

        <div class="empty-text">
            لما يكون فيه إشعار جديد هتلاقيه هنا.
        </div>

    </section>


</main>


<script>

/*
============================================================
    NOTIFICATIONS
============================================================

    لاحقًا البيانات هتيجي من Supabase.

    جدول مقترح:

    notifications

    id
    title
    message
    type
    student_id
    course_id
    exam_id
    is_read
    created_at

============================================================
*/


/* ================= ELEMENTS ================= */

const loading =
    document.getElementById(
        "loading"
    );

const notificationsContainer =
    document.getElementById(
        "notifications"
    );

const empty =
    document.getElementById(
        "empty"
    );


/* ================= DATA ================= */

/*
    بيانات تجريبية للواجهة فقط.

    عند الربط الحقيقي سيتم حذفها
    واستبدالها باستعلام Supabase.
*/

const demoNotifications = [

    {
        id:1,

        type:"course",

        title:"كورس جديد متاح",

        message:
            "تم إضافة كورس جديد إلى صفك الدراسي.",

        created_at:
            new Date(
                Date.now() - 1000 * 60 * 20
            ),

        is_read:false
    },


    {
        id:2,

        type:"exam",

        title:"اختبار جديد",

        message:
            "تم نشر اختبار جديد ويمكنك البدء فيه الآن.",

        created_at:
            new Date(
                Date.now() - 1000 * 60 * 90
            ),

        is_read:false
    },


    {
        id:3,

        type:"result",

        title:"ظهرت نتيجة الاختبار",

        message:
            "تم تصحيح اختبارك ويمكنك مشاهدة النتيجة الآن.",

        created_at:
            new Date(
                Date.now() - 1000 * 60 * 60 * 5
            ),

        is_read:true
    }

];


let allNotifications =
    [];

let currentFilter =
    "all";


/* ================= LOAD ================= */

async function loadNotifications(){

    loading.style.display =
        "flex";


    try{

        /*
        ======================================================
            SUPABASE

            بعد الربط:

            const { data, error } =
                await supabase
                    .from("notifications")
                    .select("*")
                    .eq("student_id", user.id)
                    .order(
                        "created_at",
                        { ascending:false }
                    );

        ======================================================
        */


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    400
                )
        );


        allNotifications =
            demoNotifications;


        renderNotifications();


    }catch(error){

        console.error(error);

        showEmpty();

    }finally{

        loading.style.display =
            "none";

    }

}


/* ================= RENDER ================= */

function renderNotifications(){

    notificationsContainer.innerHTML =
        "";


    let list =
        allNotifications.filter(
            notification => {

                if(
                    currentFilter ===
                    "all"
                ){

                    return true;

                }

                return (
                    notification.type ===
                    currentFilter
                );

            }
        );


    if(!list.length){

        showEmpty();

        return;

    }


    empty.style.display =
        "none";


    notificationsContainer.style.display =
        "flex";


    list.forEach(
        notification => {

            const item =
                document.createElement(
                    "article"
                );


            item.className =
                "notification" +
                (
                    notification.is_read
                    ? ""
                    : " unread"
                );


            const icon =
                getIcon(
                    notification.type
                );


            item.innerHTML = `

                <div
                    class="
                        notification-icon
                        ${notification.type}
                    "
                >
                    ${icon}
                </div>


                <div class="notification-content">

                    <div class="notification-head">

                        <div class="notification-title">

                            ${escapeHTML(
                                notification.title
                            )}

                        </div>


                        <div class="notification-time">

                            ${formatTime(
                                notification.created_at
                            )}

                        </div>

                    </div>


                    <div class="notification-text">

                        ${escapeHTML(
                            notification.message
                        )}

                    </div>

                </div>

            `;


            item.addEventListener(
                "click",
                () =>
                    markRead(
                        notification.id
                    )
            );


            notificationsContainer.appendChild(
                item
            );

        }
    );

}


/* ================= ICON ================= */

function getIcon(type){

    if(type === "course")
        return "📚";

    if(type === "exam")
        return "📝";

    if(type === "result")
        return "🏆";

    return "🔔";

}


/* ================= FILTER ================= */

function filterNotifications(
    filter,
    button
){

    currentFilter =
        filter;


    document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    renderNotifications();

}


/* ================= READ ================= */

async function markRead(id){

    const notification =
        allNotifications.find(
            item =>
                item.id === id
        );


    if(!notification)
        return;


    notification.is_read =
        true;


    /*
    ======================================================
        SUPABASE

        await supabase
            .from("notifications")
            .update({
                is_read:true
            })
            .eq("id",id);

    ======================================================
    */


    renderNotifications();

}


/* ================= READ ALL ================= */

async function markAllRead(){

    allNotifications.forEach(
        notification =>
            notification.is_read =
                true
    );


    /*
    ======================================================
        SUPABASE

        await supabase
            .from("notifications")
            .update({
                is_read:true
            })
            .eq(
                "student_id",
                user.id
            );

    ======================================================
    */


    renderNotifications();

}


/* ================= EMPTY ================= */

function showEmpty(){

    notificationsContainer.innerHTML =
        "";

    notificationsContainer.style.display =
        "none";

    empty.style.display =
        "block";

}


/* ================= TIME ================= */

function formatTime(date){

    const now =
        new Date();

    const target =
        new Date(date);

    const seconds =
        Math.floor(
            (
                now - target
            ) / 1000
        );


    if(seconds < 60)
        return "منذ لحظات";


    const minutes =
        Math.floor(
            seconds / 60
        );


    if(minutes < 60)
        return `منذ ${minutes} دقيقة`;


    const hours =
        Math.floor(
            minutes / 60
        );


    if(hours < 24)
        return `منذ ${hours} ساعة`;


    const days =
        Math.floor(
            hours / 24
        );


    if(days < 7)
        return `منذ ${days} يوم`;


    return target.toLocaleDateString(
        "ar-EG"
    );

}


/* ================= SECURITY ================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ================= NAVIGATION ================= */

function goBack(){

    window.location.href =
        "index.html";

}


/* ================= START ================= */

loadNotifications();

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

</body>

</html>
