<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>الخوارزمي | تعديل البيانات</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 20%,rgba(116,72,232,.2),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(49,84,223,.16),transparent 30%),
        #07070b;
    color:#fff;
}

.container{
    width:min(700px,94%);
    margin:auto;
}

header{
    height:75px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(7,7,11,.9);
    backdrop-filter:blur(15px);
}

.nav{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:25px;
    font-weight:900;
    background:linear-gradient(90deg,#fff,#9b7cff);
    -webkit-background-clip:text;
    color:transparent;
}

.back{
    color:#fff;
    text-decoration:none;
    background:#111119;
    border:1px solid rgba(255,255,255,.1);
    padding:10px 16px;
    border-radius:12px;
}

main{
    padding:35px 0 60px;
}

.card{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    padding:25px;
}

h1{
    font-size:26px;
    margin-bottom:8px;
}

.subtitle{
    color:#888;
    margin-bottom:25px;
}

.photo-box{
    text-align:center;
    margin-bottom:25px;
}

.avatar{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #7d52ff;
    background:#15151e;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.field.full{
    grid-column:1/-1;
}

label{
    color:#aaa;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    background:#0c0c12;
    color:#fff;
    outline:none;
}

input:focus{
    border-color:#7650ee;
}

input[readonly]{
    opacity:.55;
    cursor:not-allowed;
}

.save{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#7448e8,#3154df);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.save:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:14px;
    border-radius:12px;
    margin-bottom:18px;
}

.success{
    background:#092719;
    border:1px solid #1d7348;
    color:#75e9a9;
}

.error{
    background:#280f15;
    border:1px solid #6d2635;
    color:#ff9aaa;
}

@media(max-width:600px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .card{
        padding:18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="container nav">
        <div class="logo">الخوارزمي</div>

        <a href="home.html" class="back">
            ← رجوع
        </a>
    </div>
</header>

<main class="container">

    <div class="card">

        <h1>تعديل بياناتي</h1>

        <p class="subtitle">
            عدّل بياناتك الشخصية ثم اضغط حفظ البيانات.
        </p>

        <div id="success" class="message success"></div>
        <div id="error" class="message error"></div>

        <div class="photo-box">
            <img
                id="avatar"
                class="avatar"
                src="teacher.png"
                alt="صورة الطالب"
            >
        </div>

        <form id="profileForm">

            <div class="form-grid">

                <div class="field full">
                    <label>الاسم بالكامل</label>
                    <input
                        id="name"
                        type="text"
                        placeholder="الاسم بالكامل"
                        required
                    >
                </div>

                <div class="field">
                    <label>البريد الإلكتروني</label>
                    <input
                        id="email"
                        type="email"
                        readonly
                    >
                </div>

                <div class="field">
                    <label>رقم الهاتف</label>
                    <input
                        id="phone"
                        type="tel"
                        placeholder="01xxxxxxxxx"
                    >
                </div>

                <div class="field">
                    <label>رقم ولي الأمر</label>
                    <input
                        id="parentPhone"
                        type="tel"
                        placeholder="01xxxxxxxxx"
                    >
                </div>

                <div class="field">
                    <label>الصف الدراسي</label>
                    <input
                        id="grade"
                        type="text"
                        placeholder="مثال: ثالثة ثانوي"
                    >
                </div>

                <div class="field">
                    <label>المحافظة</label>
                    <input
                        id="governorate"
                        type="text"
                        placeholder="المحافظة"
                    >
                </div>

                <div class="field">
                    <label>المدينة</label>
                    <input
                        id="city"
                        type="text"
                        placeholder="المدينة"
                    >
                </div>

                <div class="field full">
                    <label>المدرسة</label>
                    <input
                        id="school"
                        type="text"
                        placeholder="اسم المدرسة"
                    >
                </div>

            </div>

            <button
                type="submit"
                class="save"
                id="saveBtn"
            >
                حفظ البيانات
            </button>

        </form>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>
"use strict";

let supabaseClient = null;
let currentUser = null;
let currentTable = null;
let currentRow = null;

const form = document.getElementById("profileForm");
const saveBtn = document.getElementById("saveBtn");
const successBox = document.getElementById("success");
const errorBox = document.getElementById("error");

function showSuccess(message){
    successBox.textContent = message;
    successBox.style.display = "block";
    errorBox.style.display = "none";
}

function showError(message){
    errorBox.textContent = message;
    errorBox.style.display = "block";
    successBox.style.display = "none";
}

function value(id){
    return document.getElementById(id).value.trim();
}

function setValue(id,val){
    document.getElementById(id).value = val || "";
}

function setAvatar(url){
    const img = document.getElementById("avatar");

    img.src = url || "teacher.png";

    img.onerror = () => {
        img.src = "teacher.png";
    };
}

function getField(row, names){

    for(const name of names){

        if(
            Object.prototype.hasOwnProperty.call(row,name) &&
            row[name] !== null &&
            row[name] !== undefined
        ){
            return row[name];
        }
    }

    return "";
}

async function loadProfile(){

    try{

        if(!window.supabaseClient){

            throw new Error(
                "Supabase غير متصل. تأكد من ملف supabase.js."
            );
        }

        supabaseClient = window.supabaseClient;

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();

        if(error) throw error;

        if(!data.session){

            window.location.href = "auth.html";
            return;
        }

        currentUser = data.session.user;

        /*
         * نحاول students أولاً
         */

        let response =
            await supabaseClient
            .from("students")
            .select("*")
            .eq("id",currentUser.id)
            .maybeSingle();

        if(!response.error && response.data){

            currentTable = "students";
            currentRow = response.data;

        }else{

            /*
             * لو لم توجد students
             * نحاول profiles
             */

            response =
                await supabaseClient
                .from("profiles")
                .select("*")
                .eq("id",currentUser.id)
                .maybeSingle();

            if(!response.error && response.data){

                currentTable = "profiles";
                currentRow = response.data;

            }else{

                /*
                 * لا توجد بيانات في الجدول
                 */

                currentTable = "students";

                currentRow = {
                    id:currentUser.id
                };
            }
        }

        const row = currentRow;

        const name = getField(row,[
            "full_name",
            "name",
            "student_name"
        ]) ||
        currentUser.user_metadata?.full_name ||
        currentUser.user_metadata?.name ||
        "";

        const phone = getField(row,[
            "phone",
            "phone_number"
        ]) ||
        currentUser.user_metadata?.phone ||
        "";

        const parentPhone = getField(row,[
            "parent_phone",
            "parentPhone"
        ]);

        const grade = getField(row,[
            "grade",
            "class",
            "grade_name"
        ]);

        const governorate = getField(row,[
            "governorate",
            "province"
        ]);

        const city = getField(row,[
            "city"
        ]);

        const school = getField(row,[
            "school"
        ]);

        const avatar = getField(row,[
            "avatar_url",
            "photo_url",
            "image_url"
        ]);

        setValue("name",name);

        setValue(
            "email",
            currentUser.email || getField(row,["email"])
        );

        setValue("phone",phone);
        setValue("parentPhone",parentPhone);
        setValue("grade",grade);
        setValue("governorate",governorate);
        setValue("city",city);
        setValue("school",school);

        setAvatar(avatar);

    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "حدث خطأ أثناء تحميل بياناتك"
        );
    }
}


form.addEventListener("submit",async(event)=>{

    event.preventDefault();

    if(!supabaseClient || !currentUser){
        showError("لم يتم تحميل الحساب بعد.");
        return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "جاري الحفظ...";

    try{

        const newName = value("name");
        const newPhone = value("phone");
        const newParentPhone = value("parentPhone");
        const newGrade = value("grade");
        const newGovernorate = value("governorate");
        const newCity = value("city");
        const newSchool = value("school");

        if(!newName){

            throw new Error(
                "اكتب الاسم بالكامل."
            );
        }

        /*
         * نبني البيانات حسب الأعمدة الموجودة
         */

        const updateData = {};

        if(
            currentRow &&
            Object.prototype.hasOwnProperty.call(
                currentRow,
                "full_name"
            )
        ){
            updateData.full_name = newName;
        }
        else if(
            currentRow &&
            Object.prototype.hasOwnProperty.call(
                currentRow,
                "name"
            )
        ){
            updateData.name = newName;
        }
        else{
            updateData.full_name = newName;
        }

        if(
            currentRow &&
            Object.prototype.hasOwnProperty.call(
                currentRow,
                "phone"
            )
        ){
            updateData.phone = newPhone;
        }

        if(
            currentRow &&
            Object.prototype.hasOwnProperty.call(
                currentRow,
                "phone_number"
            )
        ){
            updateData.phone_number = newPhone;
        }

        if(
            currentRow &&
            Object.prototype.hasOwnProperty.call(
                currentRow,
                "parent_phone"
            )
        ){
            updateData.parent_phone = newParentPhone;
        }

        if(
            currentRow &&
            Object.prototype.hasOwnProperty.call(
                currentRow,
                "grade"
            )
        ){
            updateData.grade = newGrade;
        }

        if(
            currentRow &&
            Object.prototype.hasOwnProperty.call(
                currentRow,
                "class"
            )
        ){
            updateData.class = newGrade;
        }

        if(
            currentRow &&
            Object.prototype.hasOwnProperty.call(
                currentRow,
                "governorate"
            )
        ){
            updateData.governorate = newGovernorate;
        }

        if(
            currentRow &&
            Object.prototype.hasOwnProperty.call(
                currentRow,
                "province"
            )
        ){
            updateData.province = newGovernorate;
        }

        if(
            currentRow &&
            Object.prototype.hasOwnProperty.call(
                currentRow,
                "city"
            )
        ){
            updateData.city = newCity;
        }

        if(
            currentRow &&
            Object.prototype.hasOwnProperty.call(
                currentRow,
                "school"
            )
        ){
            updateData.school = newSchool;
        }

        /*
         * لو السجل موجود
         */

        if(currentRow && currentRow.id){

            const {error} =
                await supabaseClient
                .from(currentTable)
                .update(updateData)
                .eq("id",currentUser.id);

            if(error) throw error;

        }else{

            /*
             * إنشاء سجل جديد
             */

            updateData.id = currentUser.id;

            if(!updateData.email && currentUser.email){
                updateData.email = currentUser.email;
            }

            const {error} =
                await supabaseClient
                .from(currentTable)
                .insert(updateData);

            if(error) throw error;
        }

        showSuccess(
            "تم حفظ بياناتك بنجاح ✅"
        );

        setTimeout(()=>{
            window.location.href = "home.html";
        },1200);

    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "حدث خطأ أثناء حفظ البيانات"
        );

    }finally{

        saveBtn.disabled = false;
        saveBtn.textContent = "حفظ البيانات";
    }
});


loadProfile();
</script>

</body>
</html>
