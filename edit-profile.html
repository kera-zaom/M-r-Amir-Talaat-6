<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>الخوارزمي | تعديل بياناتي</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(116,72,232,.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(49,84,223,.18),
            transparent 32%
        ),
        #07070b;

    color:#fff;
}


.container{

    width:min(700px,94%);

    margin:auto;
}


/* =========================
   HEADER
========================= */

header{

    height:72px;

    border-bottom:
        1px solid rgba(255,255,255,.08);

    background:
        rgba(7,7,11,.90);

    backdrop-filter:blur(15px);
}


.nav{

    height:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;
}


.logo{

    font-size:25px;

    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #fff,
            #9b7cff
        );

    -webkit-background-clip:text;

    color:transparent;
}


.back{

    text-decoration:none;

    color:#fff;

    background:#111119;

    padding:10px 16px;

    border-radius:12px;

    border:
        1px solid rgba(255,255,255,.10);
}


/* =========================
   MAIN
========================= */

main{

    padding:35px 0 60px;
}


.card{

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:25px;

    padding:25px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.30);
}


h1{

    font-size:27px;

    margin-bottom:8px;
}


.subtitle{

    color:#8d8d96;

    margin-bottom:28px;
}


/* =========================
   MESSAGES
========================= */

.message{

    display:none;

    padding:14px;

    border-radius:12px;

    margin-bottom:18px;

    line-height:1.7;
}


.success{

    background:#092719;

    border:
        1px solid #1d7348;

    color:#75e9a9;
}


.error{

    background:#280f15;

    border:
        1px solid #6d2635;

    color:#ff9aaa;
}


/* =========================
   PHOTO
========================= */

.photo-section{

    text-align:center;

    margin-bottom:30px;
}


.avatar-box{

    position:relative;

    width:145px;

    height:145px;

    margin:auto;
}


#studentAvatar{

    width:145px;

    height:145px;

    border-radius:50%;

    object-fit:cover;

    background:#111119;

    border:
        3px solid #7952ed;

    box-shadow:
        0 0 35px rgba(121,82,237,.28);
}


.camera{

    position:absolute;

    right:2px;

    bottom:2px;

    width:45px;

    height:45px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #7448e8,
            #3154df
        );

    border:
        3px solid #07070b;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    font-size:19px;
}


#photoInput{

    display:none;
}


.photo-title{

    margin-top:14px;

    font-weight:bold;
}


.photo-info{

    margin-top:7px;

    color:#888;

    font-size:13px;
}


/* =========================
   FORM
========================= */

.form-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;
}


.field{

    display:flex;

    flex-direction:column;

    gap:8px;
}


.full{

    grid-column:1 / -1;
}


label{

    color:#aaa;

    font-size:14px;
}


input{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:
        1px solid rgba(255,255,255,.10);

    background:#0c0c12;

    color:#fff;

    outline:none;

    font-size:15px;
}


input:focus{

    border-color:#7650ee;

    box-shadow:
        0 0 0 3px
        rgba(118,80,238,.10);
}


input[readonly]{

    opacity:.55;

    cursor:not-allowed;
}


/* =========================
   BUTTON
========================= */

.save{

    width:100%;

    margin-top:23px;

    padding:15px;

    border:0;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7448e8,
            #3154df
        );

    color:#fff;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}


.save:hover{

    transform:translateY(-2px);
}


.save:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}


.loading{

    text-align:center;

    color:#999;

    padding:25px;
}


@media(max-width:600px){

    .form-grid{

        grid-template-columns:1fr;

    }

    .full{

        grid-column:auto;

    }

    .card{

        padding:18px;

    }

    h1{

        font-size:23px;

    }

}

</style>

</head>


<body>


<header>

    <div class="container nav">

        <div class="logo">
            الخوارزمي
        </div>

        <a
            href="home.html"
            class="back"
        >
            ← رجوع
        </a>

    </div>

</header>



<main class="container">

<div class="card">


<h1>
    تعديل بياناتي
</h1>


<p class="subtitle">
    عدّل بياناتك الشخصية وصورتك الشخصية.
</p>



<div
    id="successBox"
    class="message success"
></div>


<div
    id="errorBox"
    class="message error"
></div>



<!-- =========================
     PHOTO
========================= -->

<div class="photo-section">


    <div class="avatar-box">


        <img
            id="studentAvatar"
            src="teacher.png"
            alt="صورة الطالب"
        >


        <label
            class="camera"
            for="photoInput"
        >
            📷
        </label>


        <input
            id="photoInput"
            type="file"
            accept="image/jpeg,image/png,image/webp"
        >


    </div>


    <div class="photo-title">
        صورتك الشخصية
    </div>


    <div class="photo-info">
        JPG / PNG / WEBP — الحد الأقصى 5MB
    </div>


</div>



<!-- =========================
     FORM
========================= -->

<form id="profileForm">


<div class="form-grid">


<div class="field full">

<label>
    الاسم بالكامل
</label>

<input
    id="fullName"
    type="text"
    placeholder="اكتب اسمك بالكامل"
    required
>

</div>



<div class="field">

<label>
    البريد الإلكتروني
</label>

<input
    id="email"
    type="email"
    readonly
>

</div>



<div class="field">

<label>
    رقم الهاتف
</label>

<input
    id="phone"
    type="tel"
    placeholder="01xxxxxxxxx"
>

</div>



<div class="field">

<label>
    رقم ولي الأمر
</label>

<input
    id="parentPhone"
    type="tel"
    placeholder="01xxxxxxxxx"
>

</div>



<div class="field">

<label>
    الصف الدراسي
</label>

<input
    id="grade"
    type="text"
    placeholder="مثال: ثالثة ثانوي"
>

</div>



<div class="field">

<label>
    المحافظة
</label>

<input
    id="governorate"
    type="text"
    placeholder="المحافظة"
>

</div>



<div class="field">

<label>
    المدينة
</label>

<input
    id="city"
    type="text"
    placeholder="المدينة"
>

</div>



<div class="field full">

<label>
    المدرسة
</label>

<input
    id="school"
    type="text"
    placeholder="اسم المدرسة"
>

</div>


</div>



<button
    class="save"
    id="saveBtn"
    type="submit"
>
    حفظ البيانات
</button>


</form>


</div>

</main>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>

"use strict";


let supabaseClient;

let currentUser;

let currentStudent;

let selectedFile = null;


const avatar =
    document.getElementById(
        "studentAvatar"
    );


const photoInput =
    document.getElementById(
        "photoInput"
    );


const form =
    document.getElementById(
        "profileForm"
    );


const saveBtn =
    document.getElementById(
        "saveBtn"
    );


const successBox =
    document.getElementById(
        "successBox"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );



/* =====================================================
   MESSAGE
===================================================== */

function success(message){

    successBox.textContent =
        message;

    successBox.style.display =
        "block";

    errorBox.style.display =
        "none";
}


function error(message){

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

    successBox.style.display =
        "none";
}



/* =====================================================
   GET VALUE
===================================================== */

function val(id){

    const element =
        document.getElementById(id);

    return element
        ? element.value.trim()
        : "";

}



/* =====================================================
   SET VALUE
===================================================== */

function setVal(id,value){

    const element =
        document.getElementById(id);

    if(element){

        element.value =
            value || "";

    }

}



/* =====================================================
   LOAD USER
===================================================== */

async function loadProfile(){

    try{


        if(!window.supabaseClient){

            throw new Error(
                "Supabase غير متصل. تأكد من supabase.js"
            );

        }


        supabaseClient =
            window.supabaseClient;



        const {
            data,
            error:sessionError
        } =
            await supabaseClient
                .auth
                .getSession();


        if(sessionError){

            throw sessionError;

        }


        if(
            !data ||
            !data.session
        ){

            window.location.href =
                "auth.html";

            return;

        }


        currentUser =
            data.session.user;



        /* =========================
           STUDENT
        ========================= */

        const {
            data:student,
            error:studentError
        } =
            await supabaseClient
                .from("students")
                .select("*")
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();



        if(studentError){

            throw studentError;

        }


        currentStudent =
            student || {};



        /* =========================
           DATA
        ========================= */

        setVal(
            "fullName",
            currentStudent.full_name
            ||
            currentStudent.name
            ||
            currentStudent.student_name
            ||
            currentUser
                .user_metadata
                ?.full_name
            ||
            currentUser
                .user_metadata
                ?.name
            ||
            ""
        );


        setVal(
            "email",
            currentUser.email
            ||
            currentStudent.email
            ||
            ""
        );


        setVal(
            "phone",
            currentStudent.phone
            ||
            currentStudent.phone_number
            ||
            ""
        );


        setVal(
            "parentPhone",
            currentStudent.parent_phone
            ||
            ""
        );


        setVal(
            "grade",
            currentStudent.grade
            ||
            currentStudent.class
            ||
            ""
        );


        setVal(
            "governorate",
            currentStudent.governorate
            ||
            currentStudent.province
            ||
            ""
        );


        setVal(
            "city",
            currentStudent.city
            ||
            ""
        );


        setVal(
            "school",
            currentStudent.school
            ||
            ""
        );



        /* =========================
           IMAGE
        ========================= */

        const savedAvatar =
            currentStudent.avatar_url
            ||
            currentStudent.photo_url
            ||
            currentStudent.image_url
            ||
            "";


        if(savedAvatar){

            avatar.src =
                savedAvatar;

        }
        else{

            avatar.src =
                "teacher.png";

        }


        avatar.onerror =
            function(){

                avatar.src =
                    "teacher.png";

            };


    }

    catch(err){

        console.error(
            "LOAD PROFILE:",
            err
        );


        error(
            err.message
            ||
            "تعذر تحميل بيانات الحساب."
        );

    }

}



/* =====================================================
   SELECT PHOTO
===================================================== */

photoInput.addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];


        if(!file){

            return;

        }


        /* =========================
           SIZE
        ========================= */

        if(
            file.size >
            5 * 1024 * 1024
        ){

            error(
                "حجم الصورة أكبر من 5MB."
            );

            this.value = "";

            return;

        }


        /* =========================
           TYPE
        ========================= */

        const allowed = [

            "image/jpeg",
            "image/png",
            "image/webp"

        ];


        if(
            !allowed.includes(
                file.type
            )
        ){

            error(
                "اختار JPG أو PNG أو WEBP فقط."
            );

            this.value = "";

            return;

        }


        selectedFile =
            file;



        /* =========================
           PREVIEW
        ========================= */

        const reader =
            new FileReader();


        reader.onload =
            function(event){

                avatar.src =
                    event.target.result;

            };


        reader.readAsDataURL(
            file
        );


        errorBox.style.display =
            "none";

    }
);



/* =====================================================
   UPLOAD IMAGE
===================================================== */

async function uploadStudentImage(){

    if(!selectedFile){

        return null;

    }


    /*
       اسم آمن وفريد

       USER_ID/
       profile-TIMESTAMP.extension
    */

    const extension =
        selectedFile.name
            .split(".")
            .pop()
            .toLowerCase();


    const filePath =
        currentUser.id
        +
        "/profile-"
        +
        Date.now()
        +
        "."
        +
        extension;



    console.log(
        "Uploading:",
        filePath
    );



    /* =========================
       UPLOAD
    ========================= */

    const {
        error:uploadError
    } =
        await supabaseClient
            .storage
            .from("avatars")
            .upload(
                filePath,
                selectedFile,
                {
                    cacheControl:"3600",
                    upsert:false,
                    contentType:
                        selectedFile.type
                }
            );


    if(uploadError){

        console.error(
            "UPLOAD ERROR:",
            uploadError
        );

        throw new Error(
            "فشل رفع الصورة: " +
            uploadError.message
        );

    }



    /* =========================
       PUBLIC URL
    ========================= */

    const {
        data
    } =
        supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(
                filePath
            );


    const publicUrl =
        data?.publicUrl;


    if(!publicUrl){

        throw new Error(
            "تم رفع الصورة ولكن لم يتم الحصول على رابطها."
        );

    }


    console.log(
        "PUBLIC URL:",
        publicUrl
    );


    return publicUrl;

}



/* =====================================================
   SAVE PROFILE
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        try{


            if(
                !supabaseClient ||
                !currentUser
            ){

                throw new Error(
                    "الحساب لم يتم تحميله بعد."
                );

            }



            const fullName =
                val("fullName");


            if(!fullName){

                throw new Error(
                    "اكتب الاسم بالكامل."
                );

            }



            saveBtn.disabled =
                true;


            saveBtn.textContent =
                "جاري الحفظ...";



            /* =========================
               UPLOAD IMAGE
            ========================= */

            let avatarUrl =
                currentStudent.avatar_url
                ||
                null;


            if(selectedFile){

                saveBtn.textContent =
                    "جاري رفع الصورة...";


                avatarUrl =
                    await uploadStudentImage();

            }



            /* =========================
               UPDATE DATA
            ========================= */

            const updateData = {

                full_name:
                    fullName,

                phone:
                    val("phone"),

                parent_phone:
                    val("parentPhone"),

                grade:
                    val("grade"),

                governorate:
                    val("governorate"),

                city:
                    val("city"),

                school:
                    val("school"),

                avatar_url:
                    avatarUrl

            };



            console.log(
                "UPDATE DATA:",
                updateData
            );



            saveBtn.textContent =
                "جاري حفظ البيانات...";



            const {
                error:updateError
            } =
                await supabaseClient
                    .from("students")
                    .update(
                        updateData
                    )
                    .eq(
                        "id",
                        currentUser.id
                    );



            if(updateError){

                console.error(
                    "UPDATE ERROR:",
                    updateError
                );

                throw new Error(
                    "فشل حفظ البيانات: " +
                    updateError.message
                );

            }



            /* =========================
               UPDATE LOCAL
            ========================= */

            currentStudent = {

                ...currentStudent,

                ...updateData

            };


            selectedFile =
                null;


            photoInput.value =
                "";



            /* =========================
               SHOW NEW IMAGE
            ========================= */

            if(avatarUrl){

                avatar.src =
                    avatarUrl
                    +
                    (
                        avatarUrl.includes("?")
                            ? "&"
                            : "?"
                    )
                    +
                    "v="
                    +
                    Date.now();

            }



            success(
                "تم حفظ بياناتك وصورتك الشخصية بنجاح ✅"
            );



            /*
               الانتقال بعد لحظة
            */

            setTimeout(
                function(){

                    window.location.href =
                        "home.html";

                },
                1200
            );


        }

        catch(err){

            console.error(
                "SAVE PROFILE:",
                err
            );


            error(
                err.message
                ||
                "حدث خطأ أثناء الحفظ."
            );


            saveBtn.disabled =
                false;


            saveBtn.textContent =
                "حفظ البيانات";

        }

    }
);



/* =====================================================
   START
===================================================== */

loadProfile();

</script>

</body>

</html>
