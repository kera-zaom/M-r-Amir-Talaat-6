<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تواصل مع المستر | الخوارزمي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Cairo",Arial,sans-serif;
}

body{

    min-height:100vh;

    color:#fff;

    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(118,87,255,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(74,44,200,.15),
            transparent 35%
        ),
        #050507;

    padding-bottom:50px;
}


/* HEADER */

header{

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 6%;

    position:sticky;

    top:0;

    z-index:100;

    background:rgba(5,5,7,.85);

    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.08);
}


.logo{

    display:flex;

    align-items:center;

    gap:10px;
}


.logo-icon{

    width:42px;

    height:42px;

    display:grid;

    place-items:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7657ff,
            #4d35d9
        );

    font-weight:900;

    font-size:20px;

    box-shadow:
        0 0 25px
        rgba(118,87,255,.25);
}


.logo-text{

    font-size:17px;

    font-weight:900;
}


.back{

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.04);

    color:#fff;

    padding:9px 14px;

    border-radius:10px;

    cursor:pointer;

    font-size:10px;

    transition:.25s;
}


.back:hover{

    background:rgba(118,87,255,.12);

}


/* MAIN */

main{

    width:min(700px,94%);

    margin:auto;

    padding-top:40px;
}


/* HERO */

.hero{

    text-align:center;

    margin-bottom:25px;
}


.hero-icon{

    width:75px;

    height:75px;

    display:grid;

    place-items:center;

    margin:auto;

    margin-bottom:15px;

    border-radius:23px;

    background:
        rgba(118,87,255,.10);

    border:
        1px solid
        rgba(118,87,255,.20);

    font-size:31px;

    box-shadow:
        0 0 35px
        rgba(118,87,255,.10);
}


.hero h1{

    font-size:
        clamp(25px,6vw,36px);

    font-weight:900;

    margin-bottom:6px;
}


.hero p{

    color:#9999a8;

    font-size:11px;

    line-height:1.9;
}


/* CARD */

.card{

    padding:25px;

    border-radius:22px;

    background:
        rgba(18,18,27,.90);

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.30);
}


.card-title{

    font-size:17px;

    font-weight:900;

    margin-bottom:20px;
}


/* INPUT */

.form-group{

    margin-bottom:15px;
}


label{

    display:block;

    color:#c4c4ce;

    font-size:10px;

    font-weight:700;

    margin-bottom:7px;
}


input,
textarea{

    width:100%;

    color:white;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);

    outline:none;

    border-radius:12px;

    padding:13px;

    font-size:11px;

    transition:.25s;
}


input{

    height:48px;
}


textarea{

    min-height:150px;

    resize:vertical;

    line-height:1.9;
}


input:focus,
textarea:focus{

    border-color:
        rgba(118,87,255,.50);

    background:
        rgba(118,87,255,.055);

    box-shadow:
        0 0 0 3px
        rgba(118,87,255,.06);
}


/* BUTTON */

.send-btn{

    width:100%;

    height:52px;

    border:0;

    border-radius:13px;

    color:#fff;

    cursor:pointer;

    font-size:11px;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #7657ff,
            #4d35d9
        );

    transition:.25s;

    box-shadow:
        0 10px 30px
        rgba(118,87,255,.18);
}


.send-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 15px 35px
        rgba(118,87,255,.30);
}


.send-btn:active{

    transform:scale(.98);

}


/* WHATSAPP INFO */

.whatsapp-info{

    margin-top:15px;

    padding:13px;

    border-radius:12px;

    background:
        rgba(37,211,102,.06);

    border:
        1px solid
        rgba(37,211,102,.13);

    color:#9ee8b8;

    text-align:center;

    font-size:9px;

    line-height:1.8;
}


/* RESPONSIVE */

@media(max-width:600px){

    header{

        padding:0 4%;

    }

    .card{

        padding:19px;

    }

    main{

        padding-top:25px;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        <div class="logo-icon">
            خ
        </div>

        <div class="logo-text">
            الخوارزمي
        </div>

    </div>


    <button
        class="back"
        onclick="goHome()"
    >
        ← الرئيسية
    </button>

</header>



<main>


    <section class="hero">

        <div class="hero-icon">
            💬
        </div>

        <h1>
            تواصل مع الخوارزمي 
        </h1>

        <p>
            عندك سؤال أو مشكلة؟
            اكتب رسالتك وسيتم تحويلها مباشرة إلى واتساب المستر.
        </p>

    </section>



    <section class="card">

        <div class="card-title">
            ✉️ اكتب رسالتك
        </div>


        <form
            onsubmit="sendWhatsApp(event)"
        >


            <div class="form-group">

                <label>
                    اسمك
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="اكتب اسمك بالكامل"
                    maxlength="100"
                    required
                >

            </div>



            <div class="form-group">

                <label>
                    رسالتك
                </label>

                <textarea
                    id="studentMessage"
                    placeholder="اكتب رسالتك للمستر هنا..."
                    maxlength="1000"
                    required
                ></textarea>

            </div>



            <button
                class="send-btn"
                type="submit"
            >
                💬 إرسال عبر واتساب
            </button>


        </form>



        <div class="whatsapp-info">

            📱 سيتم فتح واتساب وإرسال الرسالة إلى المستر
            <br>

            <strong>
                01212101614
            </strong>

        </div>


    </section>


</main>



<script>


function sendWhatsApp(event){

    event.preventDefault();


    const name =
        document
        .getElementById("studentName")
        .value
        .trim();


    const message =
        document
        .getElementById("studentMessage")
        .value
        .trim();


    if(!name || !message){

        alert(
            "من فضلك اكتب اسمك ورسالتك."
        );

        return;

    }


    /*
    ==========================================
        رقم الواتساب

        بدون الصفر في البداية
        وبكود مصر 20
    ==========================================
    */

    const phone =
        "201212101614";


    /*
    ==========================================
        الرسالة التي ستظهر في واتساب
    ==========================================
    */

    const whatsappMessage =
`السلام عليكم مستر 👋

👤 اسم الطالب:
${name}

💬 الرسالة:
${message}

📚 منصة الخوارزمي`;


    /*
    ==========================================
        تحويل الرسالة إلى رابط واتساب
    ==========================================
    */

    const whatsappURL =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(
            whatsappMessage
        );


    /*
    فتح واتساب
    */

    window.location.href =
        whatsappURL;

}



function goHome(){

    window.location.href =
        "index.html";

}


</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

</body>

</html>
