<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>الخوارزمي | تعديل البيانات</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 20%,rgba(116,72,232,.22),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(49,84,223,.18),transparent 35%),
        #07070b;
    color:white;
}

.container{
    width:min(700px,94%);
    margin:auto;
}

header{
    height:70px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(7,7,11,.9);
}

.nav{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:25px;
    font-weight:900;
    background:linear-gradient(90deg,#fff,#9b7cff);
    -webkit-background-clip:text;
    color:transparent;
}

.back{
    color:#fff;
    text-decoration:none;
    padding:10px 16px;
    border-radius:12px;
    background:#111119;
}

main{
    padding:35px 0;
}

.card{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    padding:25px;
}

h1{
    margin-bottom:8px;
}

.subtitle{
    color:#888;
    margin-bottom:25px;
}

.message{
    display:none;
    padding:13px;
    border-radius:12px;
    margin-bottom:18px;
}

.success{
    color:#75e9a9;
    background:#092719;
    border:1px solid #1d7348;
}

.error{
    color:#ff9aaa;
    background:#280f15;
    border:1px solid #6d2635;
}

.photo{
    text-align:center;
    margin-bottom:28px;
}

.avatar-box{
    position:relative;
    width:145px;
    height:145px;
    margin:auto;
}

#studentAvatar{
    width:145px;
    height:145px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #7952ed;
    background:#111119;
}

.camera{
    position:absolute;
    bottom:0;
    right:0;
    width:44px;
    height:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#7448e8,#3154df);
    border:3px solid #07070b;
    cursor:pointer;
}

#photoInput{
    display:none;
}

.photo-title{
    margin-top:12px;
    font-weight:bold;
}

.photo-info{
    color:#777;
    font-size:13px;
    margin-top:6px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.full{
    grid-column:1/-1;
}

label{
    color:#aaa;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    background:#0c0c12;
    color:white;
    outline:none;
}

input:focus{
    border-color:#7650ee;
}

input[readonly]{
    opacity:.5;
}

#saveBtn{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:13px;
    color:white;
    background:linear-gradient(135deg,#7448e8,#3154df);
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#saveBtn:disabled{
    opacity:.6;
}

@media(max-width:600px){

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

}

</style>
</head>

<body>

<header>

<div class="container nav">

    <div class="logo">
        الخوارزمي
    </div>

    <a href="home.html" class="back">
        ← رجوع
    </a>

</div>

</header>


<main class="container">

<div class="card">

<h1>تعديل بياناتي</h1>

<p class="subtitle">
    عدّل بياناتك الشخصية وصورتك.
</p>


<div id="successBox" class="message success"></div>

<div id="errorBox" class="message error"></div>


<!-- الصورة -->

<div class="photo">

    <div class="avatar-box">

        <img
            id="studentAvatar"
            src="teacher.png"
            alt="صورة الطالب"
        >

        <label
            for="photoInput"
            class="camera"
        >
            📷
        </label>

        <input
            id="photoInput"
            type="file"
            accept="image/*"
        >

    </div>

    <div class="photo-title">
        الصورة الشخصية
    </div>

    <div class="photo-info">
        اختر صورة JPG أو PNG أو WEBP بحجم أقل من 5MB
    </div>

</div>


<form id="profileForm">

<div class="grid">


<div class="field full">

<label>الاسم بالكامل</label>

<input
    id="fullName"
    type="text"
    required
>

</div>


<div class="field">

<label>البريد الإلكتروني</label>

<input
    id="email"
    type="email"
    readonly
>

</div>


<div class="field">

<label>رقم الهاتف</label>

<input
    id="phone"
    type="tel"
>

</div>


<div class="field">

<label>رقم ولي الأمر</label>

<input
    id="parentPhone"
    type="tel"
>

</div>


<div class="field">

<label>الصف الدراسي</label>

<input
    id="grade"
    type="text"
>

</div>


<div class="field">

<label>المحافظة</label>

<input
    id="governorate"
    type="text"
>

</div>


<div class="field">

<label>المدينة</label>

<input
    id="city"
    type="text"
>

</div>


<div class="field full">

<label>المدرسة</label>

<input
    id="school"
    type="text"
>

</div>


</div>


<button
    id="saveBtn"
    type="submit"
>
    حفظ البيانات
</button>

</form>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

"use strict";

let client;
let user;
let student = {};
let selectedFile = null;


const form =
    document.getElementById("profileForm");

const input =
    document.getElementById("photoInput");

const image =
    document.getElementById("studentAvatar");

const save =
    document.getElementById("saveBtn");

const success =
    document.getElementById("successBox");

const error =
    document.getElementById("errorBox");


/* =====================================
   MESSAGE
===================================== */

function showSuccess(text){

    success.textContent = text;
    success.style.display = "block";
    error.style.display = "none";

}


function showError(text){

    error.textContent = text;
    error.style.display = "block";
    success.style.display = "none";

}


/* =====================================
   START
===================================== */

async function start(){

    try{

        if(!window.supabaseClient){

            throw new Error(
                "Supabase غير متصل. تأكد من supabase.js"
            );

        }


        client =
            window.supabaseClient;


        const {
            data,
            error:sessionError
        } =
        await client.auth.getSession();


        if(sessionError){

            throw sessionError;

        }


        if(!data.session){

            location.href = "auth.html";
            return;

        }


        user =
            data.session.user;


        /* جلب بيانات الطالب */

        const {
            data:studentData,
            error:studentError
        } =
        await client
            .from("students")
            .select("*")
            .eq("id",user.id)
            .maybeSingle();


        if(studentError){

            throw studentError;

        }


        student =
            studentData || {};


        fillForm();


    }catch(err){

        console.error(err);

        showError(
            err.message ||
            "حدث خطأ أثناء تحميل البيانات"
        );

    }

}


/* =====================================
   FILL FORM
===================================== */

function fillForm(){

    document.getElementById("fullName").value =
        student.full_name ||
        student.name ||
        user.user_metadata?.full_name ||
        "";

    document.getElementById("email").value =
        user.email ||
        student.email ||
        "";

    document.getElementById("phone").value =
        student.phone || "";

    document.getElementById("parentPhone").value =
        student.parent_phone || "";

    document.getElementById("grade").value =
        student.grade ||
        student.class ||
        "";

    document.getElementById("governorate").value =
        student.governorate ||
        student.province ||
        "";

    document.getElementById("city").value =
        student.city || "";

    document.getElementById("school").value =
        student.school || "";


    /* الصورة الحالية */

    if(student.avatar_url){

        image.src =
            student.avatar_url;

    }

}


/* =====================================
   SELECT PHOTO
===================================== */

input.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){

            return;

        }


        if(
            file.size >
            5 * 1024 * 1024
        ){

            showError(
                "الصورة أكبر من 5MB"
            );

            this.value = "";

            return;

        }


        if(
            !file.type.startsWith("image/")
        ){

            showError(
                "الملف المختار ليس صورة"
            );

            this.value = "";

            return;

        }


        selectedFile =
            file;


        /* المعاينة */

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                image.src =
                    e.target.result;

            };

        reader.readAsDataURL(file);

    }
);


/* =====================================
   UPLOAD
===================================== */

async function uploadPhoto(){

    if(!selectedFile){

        return null;

    }


    const extension =
        selectedFile.name
        .split(".")
        .pop()
        .toLowerCase();


    const path =
        user.id +
        "/profile-" +
        Date.now() +
        "." +
        extension;


    console.log(
        "Uploading:",
        path
    );


    const {
        error:uploadError
    } =
    await client
        .storage
        .from("avatars")
        .upload(
            path,
            selectedFile,
            {
                contentType:
                    selectedFile.type,

                cacheControl:
                    "3600",

                upsert:false
            }
        );


    if(uploadError){

        throw new Error(
            "فشل رفع الصورة: " +
            uploadError.message
        );

    }


    /* الحصول على الرابط */

    const {
        data
    } =
    client
        .storage
        .from("avatars")
        .getPublicUrl(path);


    if(!data?.publicUrl){

        throw new Error(
            "تم رفع الصورة ولكن لم يتم إنشاء الرابط"
        );

    }


    return data.publicUrl;

}


/* =====================================
   SAVE
===================================== */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        try{

            save.disabled =
                true;

            save.textContent =
                "جاري الحفظ...";


            const fullName =
                document
                .getElementById("fullName")
                .value
                .trim();


            if(!fullName){

                throw new Error(
                    "اكتب الاسم بالكامل"
                );

            }


            /* =================================
               رفع الصورة
            ================================= */

            let avatarUrl =
                student.avatar_url ||
                null;


            if(selectedFile){

                save.textContent =
                    "جاري رفع الصورة...";


                avatarUrl =
                    await uploadPhoto();

            }


            /* =================================
               البيانات
            ================================= */

            const updateData = {

                full_name:
                    fullName,

                phone:
                    document
                    .getElementById("phone")
                    .value
                    .trim(),

                parent_phone:
                    document
                    .getElementById("parentPhone")
                    .value
                    .trim(),

                grade:
                    document
                    .getElementById("grade")
                    .value
                    .trim(),

                governorate:
                    document
                    .getElementById("governorate")
                    .value
                    .trim(),

                city:
                    document
                    .getElementById("city")
                    .value
                    .trim(),

                school:
                    document
                    .getElementById("school")
                    .value
                    .trim(),

                avatar_url:
                    avatarUrl

            };


            console.log(
                "UPDATE:",
                updateData
            );


            save.textContent =
                "جاري حفظ البيانات...";


            /* =================================
               تحديث الطالب
            ================================= */

            const {
                error:updateError
            } =
            await client
                .from("students")
                .update(updateData)
                .eq(
                    "id",
                    user.id
                );


            if(updateError){

                console.error(
                    updateError
                );

                throw new Error(
                    "فشل حفظ البيانات: " +
                    updateError.message
                );

            }


            /* =================================
               تم
            ================================= */

            student = {
                ...student,
                ...updateData
            };


            selectedFile = null;

            input.value = "";


            if(avatarUrl){

                image.src =
                    avatarUrl +
                    "?v=" +
                    Date.now();

            }


            showSuccess(
                "تم حفظ البيانات والصورة بنجاح ✅"
            );


            save.textContent =
                "تم الحفظ ✓";


            setTimeout(
                function(){

                    location.href =
                        "home.html";

                },
                1000
            );


        }catch(err){

            console.error(
                "SAVE ERROR:",
                err
            );


            showError(
                err.message ||
                "حدث خطأ أثناء الحفظ"
            );


            save.disabled =
                false;

            save.textContent =
                "حفظ البيانات";

        }

    }
);


/* =====================================
   RUN
===================================== */

start();

</script>

</body>
</html>
