<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الخوارزمي | تسجيل الدخول</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, #26306b 0%, transparent 35%),
                radial-gradient(circle at bottom left, #35185c 0%, transparent 35%),
                #080912;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .logo {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo-icon {
            width: 75px;
            height: 75px;
            margin: auto;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
            background: linear-gradient(135deg, #7448e8, #3154df);
            box-shadow: 0 0 35px rgba(116, 72, 232, .35);
        }

        .logo h1 {
            margin-top: 12px;
            font-size: 30px;
        }

        .logo p {
            color: #aeb3c7;
            margin-top: 6px;
        }

        .card {
            background: rgba(18, 20, 34, .94);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
            backdrop-filter: blur(15px);
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #0d0f1c;
            padding: 5px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        .tab {
            border: 0;
            background: transparent;
            color: #9da3b8;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .tab.active {
            background: linear-gradient(135deg, #7448e8, #3154df);
            color: white;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .title {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #969caf;
            font-size: 14px;
            margin-bottom: 22px;
            line-height: 1.7;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #d9dcec;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            border: 1px solid #292d42;
            background: #0c0e19;
            color: white;
            outline: none;
            padding: 0 14px;
            font-size: 15px;
            transition: .2s;
        }

        input:focus,
        select:focus {
            border-color: #7448e8;
            box-shadow: 0 0 0 3px rgba(116, 72, 232, .12);
        }

        input::placeholder {
            color: #60667a;
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #111321;
            color: white;
        }

        .btn {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 13px;
            background: linear-gradient(135deg, #7448e8, #3154df);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 7px;
            transition: .2s;
            box-shadow: 0 8px 25px rgba(68, 67, 220, .25);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-bottom: 15px;
            padding: 12px 14px;
            border-radius: 11px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(220, 50, 70, .12);
            border: 1px solid rgba(220, 50, 70, .3);
            color: #ff8f9e;
        }

        .message.success {
            background: rgba(35, 190, 120, .12);
            border: 1px solid rgba(35, 190, 120, .3);
            color: #6ee7b7;
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .normal-text {
            display: block;
        }

        .btn.loading-active .normal-text {
            display: none;
        }

        .btn.loading-active .loading {
            display: flex;
        }

        .footer {
            text-align: center;
            color: #62687d;
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 22px 18px;
            }

            .logo h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">خ</div>
        <h1>الخوارزمي</h1>
        <p>منصة الاختبارات</p>
    </div>

    <div class="card">

        <div class="tabs">
            <button class="tab active" id="loginTab">
                تسجيل الدخول
            </button>

            <button class="tab" id="registerTab">
                إنشاء حساب
            </button>
        </div>

        <div id="message" class="message"></div>

        <!-- ================= LOGIN ================= -->

        <form id="loginForm" class="form active">

            <h2 class="title">أهلاً بك 👋</h2>

            <p class="subtitle">
                سجل دخولك للوصول إلى حسابك في منصة الخوارزمي.
            </p>

            <div class="field">
                <label for="loginEmail">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="loginPassword">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn" id="loginBtn">

                <span class="normal-text">
                    تسجيل الدخول
                </span>

                <span class="loading">
                    <span class="spinner"></span>
                    جاري الدخول...
                </span>

            </button>

        </form>

        <!-- ================= REGISTER ================= -->

        <form id="registerForm" class="form">

            <h2 class="title">إنشاء حساب جديد</h2>

            <p class="subtitle">
                أنشئ حسابك كطالب وابدأ الاختبارات.
            </p>

            <div class="field">
                <label for="registerName">
                    الاسم بالكامل
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="اكتب اسمك بالكامل"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="field">
                <label for="registerEmail">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="registerPhone">
                    رقم الهاتف
                </label>

                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="01xxxxxxxxx"
                    inputmode="numeric"
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="field">
                <label for="parentPhone">
                    رقم ولي الأمر
                </label>

                <input
                    type="tel"
                    id="parentPhone"
                    placeholder="01xxxxxxxxx"
                    inputmode="numeric"
                    required
                >
            </div>

            <div class="field">
                <label for="grade">
                    الصف الدراسي
                </label>

                <select id="grade" required>

                    <option value="">
                        اختر الصف الدراسي
                    </option>

                    <option value="أولى إعدادي">
                        أولى إعدادي
                    </option>

                    <option value="ثانية إعدادي">
                        ثانية إعدادي
                    </option>

                    <option value="ثالثة إعدادي">
                        ثالثة إعدادي
                    </option>

                    <option value="أولى ثانوي">
                        أولى ثانوي
                    </option>

                    <option value="ثانية ثانوي">
                        ثانية ثانوي
                    </option>

                    <option value="ثالثة ثانوي">
                        ثالثة ثانوي
                    </option>

                </select>
            </div>

            <div class="field">
                <label for="registerPassword">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="6 أحرف على الأقل"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <div class="field">
                <label for="confirmPassword">
                    تأكيد كلمة المرور
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="أعد كتابة كلمة المرور"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="btn" id="registerBtn">

                <span class="normal-text">
                    إنشاء الحساب
                </span>

                <span class="loading">
                    <span class="spinner"></span>
                    جاري إنشاء الحساب...
                </span>

            </button>

        </form>

    </div>

    <div class="footer">
        منصة الخوارزمي للاختبارات
    </div>

</div>


<!-- =====================================================
     SUPABASE
     ===================================================== -->

<script src="supabase.js"></script>


<script>

"use strict";


/* =====================================================
   CHECK SUPABASE
   ===================================================== */

if (
    typeof window.supabaseClient === "undefined" ||
    !window.supabaseClient
) {
    document.body.innerHTML = `
        <div style="
            color:white;
            text-align:center;
            padding:40px;
            font-family:Arial;
        ">
            <h2>خطأ في الاتصال</h2>
            <p style="margin-top:10px;color:#aaa;">
                لم يتم العثور على إعدادات Supabase.
            </p>
        </div>
    `;

    throw new Error("supabaseClient غير موجود");
}


const supabase = window.supabaseClient;


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

const message = document.getElementById("message");

const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");


/* =====================================================
   TABS
   ===================================================== */

loginTab.addEventListener("click", () => {

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    loginForm.classList.add("active");
    registerForm.classList.remove("active");

    clearMessage();

});


registerTab.addEventListener("click", () => {

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    registerForm.classList.add("active");
    loginForm.classList.remove("active");

    clearMessage();

});


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text, type = "error") {

    message.textContent = text;

    message.className = "message show " + type;

}


function clearMessage() {

    message.textContent = "";

    message.className = "message";

}


/* =====================================================
   LOADING
   ===================================================== */

function setLoading(button, loading) {

    if (loading) {

        button.disabled = true;
        button.classList.add("loading-active");

    } else {

        button.disabled = false;
        button.classList.remove("loading-active");

    }

}


/* =====================================================
   PHONE VALIDATION
   ===================================================== */

function validEgyptianPhone(phone) {

    return /^01[0125][0-9]{8}$/.test(phone);

}


/* =====================================================
   GET USER ROLE
   ===================================================== */

async function getUserRole(userId) {

    const { data, error } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", userId)
        .maybeSingle();

    if (error) {
        throw error;
    }

    return data?.role || "student";

}


/* =====================================================
   REDIRECT BY ROLE
   ===================================================== */

async function redirectByRole(user) {

    if (!user) {
        window.location.replace("auth.html");
        return;
    }

    let role = "student";

    try {

        role = await getUserRole(user.id);

    } catch (error) {

        console.error("Role error:", error);

        /*
         * لو حصل خطأ في قراءة role
         * نعتبر المستخدم طالباً بشكل آمن.
         */

        role = "student";

    }


    if (role === "admin") {

        window.location.replace("admin/index.html");

    } else {

        window.location.replace("home.html");

    }

}


/* =====================================================
   CHECK EXISTING SESSION
   ===================================================== */

async function checkExistingSession() {

    try {

        const {
            data,
            error
        } = await supabase.auth.getSession();

        if (error) {
            console.error(error);
            return;
        }

        if (data?.session?.user) {

            await redirectByRole(data.session.user);

        }

    } catch (error) {

        console.error("Session error:", error);

    }

}


checkExistingSession();


/* =====================================================
   LOGIN
   ===================================================== */

loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessage();

    const email =
        document.getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();

    const password =
        document.getElementById("loginPassword")
            .value;


    if (!email || !password) {

        showMessage("من فضلك اكتب البريد الإلكتروني وكلمة المرور.");

        return;

    }


    setLoading(loginBtn, true);


    try {

        const {
            data,
            error
        } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
        });


        if (error) {

            console.error("Login error:", error);

            let text =
                "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            if (
                error.message &&
                error.message.toLowerCase().includes("email not confirmed")
            ) {

                text =
                    "يجب تأكيد البريد الإلكتروني أولاً.";

            }

            showMessage(text);

            return;

        }


        if (!data?.user) {

            showMessage("حدث خطأ أثناء تسجيل الدخول.");

            return;

        }


        showMessage(
            "تم تسجيل الدخول بنجاح، جاري تحويلك...",
            "success"
        );


        await redirectByRole(data.user);


    } catch (error) {

        console.error(error);

        showMessage(
            "حدث خطأ في الاتصال. حاول مرة أخرى."
        );

    } finally {

        setLoading(loginBtn, false);

    }

});


/* =====================================================
   REGISTER
   ===================================================== */

registerForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessage();


    const name =
        document.getElementById("registerName")
            .value
            .trim();

    const email =
        document.getElementById("registerEmail")
            .value
            .trim()
            .toLowerCase();

    const phone =
        document.getElementById("registerPhone")
            .value
            .trim();

    const parentPhone =
        document.getElementById("parentPhone")
            .value
            .trim();

    const grade =
        document.getElementById("grade")
            .value;

    const password =
        document.getElementById("registerPassword")
            .value;

    const confirmPassword =
        document.getElementById("confirmPassword")
            .value;


    /* ================= VALIDATION ================= */


    if (name.length < 3) {

        showMessage("اكتب الاسم بالكامل بشكل صحيح.");

        return;

    }


    if (!validEgyptianPhone(phone)) {

        showMessage(
            "رقم الهاتف غير صحيح. يجب أن يكون رقمًا مصريًا مثل 01012345678."
        );

        return;

    }


    if (!validEgyptianPhone(parentPhone)) {

        showMessage(
            "رقم ولي الأمر غير صحيح."
        );

        return;

    }


    if (!grade) {

        showMessage("اختر الصف الدراسي.");

        return;

    }


    if (password.length < 6) {

        showMessage(
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
        );

        return;

    }


    if (password !== confirmPassword) {

        showMessage(
            "كلمتا المرور غير متطابقتين."
        );

        return;

    }


    setLoading(registerBtn, true);


    try {

        /*
         * إنشاء حساب Supabase Auth
         */

        const {
            data,
            error
        } = await supabase.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    full_name: name,

                    phone: phone,

                    parent_phone: parentPhone,

                    grade: grade,

                    role: "student"

                }

            }

        });


        if (error) {

            console.error("Register error:", error);

            let text = "تعذر إنشاء الحساب.";

            const errorMessage =
                (error.message || "").toLowerCase();


            if (
                errorMessage.includes("already registered") ||
                errorMessage.includes("already exists")
            ) {

                text =
                    "هذا البريد الإلكتروني مسجل بالفعل.";

            } else if (
                errorMessage.includes("password")
            ) {

                text =
                    "كلمة المرور غير صالحة.";

            }


            showMessage(text);

            return;

        }


        /*
         * لو Supabase رجع User
         */

        if (data?.user) {

            /*
             * لو فيه Session مباشرة
             */

            if (data.session) {

                showMessage(
                    "تم إنشاء الحساب بنجاح، جاري تحويلك...",
                    "success"
                );

                await redirectByRole(data.user);

            } else {

                /*
                 * في حالة تفعيل تأكيد البريد الإلكتروني
                 */

                showMessage(
                    "تم إنشاء الحساب بنجاح. افتح بريدك الإلكتروني لتأكيد الحساب ثم سجل الدخول.",
                    "success"
                );

                registerForm.reset();

                setTimeout(() => {

                    loginTab.click();

                    document.getElementById("loginEmail").value =
                        email;

                }, 2500);

            }

        } else {

            showMessage(
                "تم إنشاء الحساب. حاول تسجيل الدخول."
            );

        }


    } catch (error) {

        console.error(error);

        showMessage(
            "حدث خطأ أثناء إنشاء الحساب. حاول مرة أخرى."
        );

    } finally {

        setLoading(registerBtn, false);

    }

});


/* =====================================================
   AUTH STATE
   ===================================================== */

supabase.auth.onAuthStateChange(
    async (event, session) => {

        console.log(
            "Auth event:",
            event
        );

        /*
         * لا نعيد التوجيه أثناء SIGNED_OUT
         */

        if (
            event === "SIGNED_IN" &&
            session?.user
        ) {

            /*
             * نترك redirectByRole يتعامل مع التوجيه
             * من عملية تسجيل الدخول/التسجيل.
             */

        }

    }
);

</script>

</body>
</html>
